services:
  comply:
    build: .
    image: 1cyber-comply:latest
    container_name: 1cyber-comply
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8080:8080"   # local only; put a reverse proxy in front for network access
    volumes:
      - comply-data:/data
    extra_hosts:
      # Lets the container reach services on the host (e.g. Wazuh) via
      # host.docker.internal, whatever IP the host gets from DHCP.
      - "host.docker.internal:host-gateway"

volumes:
  comply-data:
