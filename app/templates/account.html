{% extends "base.html" %}
{% block title %}Account · {{ app_name }}{% endblock %}
{% block content %}
{% if flash %}<div class="flash {{ 'ok' if flash_ok else 'err' }}">{{ flash }}</div>{% endif %}
<h1 style="font-size:22px;margin:0 0 16px">{{ request.state.user.username }} <span class="muted" style="font-size:14px">· {{ request.state.user.role }}</span></h1>
<h2>Change password</h2>
<div class="card" style="max-width:480px">
  <form method="post" action="/account/password" class="form">
    <input type="hidden" name="csrf_token" value="{{ request.state.csrf }}">
    <label>Current password <input type="password" name="current" autocomplete="current-password" required></label>
    <label>New password <span class="muted">(min. 12 characters)</span>
      <input type="password" name="password" autocomplete="new-password" minlength="12" required></label>
    <label>Confirm new password <input type="password" name="confirm" autocomplete="new-password" minlength="12" required></label>
    <div><button type="submit">Change password</button></div>
  </form>
  <p class="muted" style="font-size:13px;margin-bottom:0">Changing the password logs you out on all other devices.</p>
</div>
{% endblock %}
