<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ app_name }}{% endblock %}</title>
<style>
  :root { --bg:#0f1419; --card:#1a2129; --text:#e6e8eb; --muted:#8a939d; --ok:#3fb950; --off:#d29922;
          --line:#2a333d; --accent:#58a6ff; --auto:#1f3a5f; --manual:#3a3324; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; background:var(--bg); color:var(--text); line-height:1.45; }
  header { padding:16px 24px; border-bottom:1px solid var(--line); display:flex; gap:24px; align-items:center; flex-wrap:wrap; }
  header h1 { margin:0; font-size:18px; }
  header nav { display:flex; gap:16px; flex:1; }
  header nav a { color:var(--muted); text-decoration:none; font-size:14px; padding:4px 0; border-bottom:2px solid transparent; }
  header nav a.active, header nav a:hover { color:var(--text); border-bottom-color:var(--accent); }
  header .ver { color:var(--muted); font-size:12px; }
  main { max-width:1000px; margin:0 auto; padding:24px 16px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:16px; margin-bottom:24px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:16px; }
  .card .num { font-size:30px; font-weight:600; }
  .card .lbl { color:var(--muted); font-size:13px; }
  h2 { font-size:13px; color:var(--muted); font-weight:500; text-transform:uppercase; letter-spacing:.05em; margin:28px 0 10px; }
  .row { display:flex; justify-content:space-between; gap:12px; padding:10px 0; border-bottom:1px solid var(--line); }
  .row:last-child { border-bottom:0; }
  .ok { color:var(--ok); } .off { color:var(--off); } .muted { color:var(--muted); }
  a { color:var(--accent); }
  .tag { font-size:11px; padding:2px 8px; border-radius:10px; white-space:nowrap; }
  .tag.automated { background:var(--auto); color:#a5d0ff; }
  .tag.manual { background:var(--manual); color:#e3c27a; }
  code { font-size:12px; color:var(--muted); }
  .st { font-size:11px; font-weight:600; padding:2px 8px; border-radius:10px; text-transform:uppercase; white-space:nowrap; }
  .st.pass { background:#12361f; color:var(--ok); }
  .st.fail { background:#3d1418; color:#f85149; }
  .st.unknown { background:#2a333d; color:var(--muted); }
  .flash { padding:12px 16px; border-radius:8px; margin-bottom:20px; border:1px solid; }
  .flash.ok { background:#12361f; border-color:#238636; }
  .flash.err { background:#3d1418; border-color:#da3633; }
  button { background:#21262d; color:var(--text); border:1px solid var(--line); border-radius:6px; padding:5px 12px; font-size:13px; cursor:pointer; }
  button:hover { border-color:var(--accent); }
  form { display:inline; }
  .score { display:flex; gap:24px; align-items:center; flex-wrap:wrap; }
  .score .big { font-size:48px; font-weight:700; line-height:1; }
  .score .sub { color:var(--muted); font-size:13px; }
  .bar { height:8px; background:#2a333d; border-radius:4px; overflow:hidden; margin-top:6px; width:220px; }
  .bar > span { display:block; height:100%; background:var(--ok); }
  svg .g { stroke:#2a333d; stroke-width:1; }
  svg .t { fill:var(--muted); font-size:11px; font-family:inherit; }
  svg .l { fill:none; stroke:var(--accent); stroke-width:2; }
  svg .la { fill:none; stroke:var(--ok); stroke-width:1.5; stroke-dasharray:4 3; }
  svg .d { fill:var(--accent); }
  .legend { font-size:12px; color:var(--muted); }
  .legend i { display:inline-block; width:14px; height:2px; vertical-align:middle; margin:0 4px 0 10px; }
  .evidence { font-size:13px; margin-top:6px; padding:6px 10px; background:#0f1419; border-radius:6px; }
</style>
</head>
<body>
<header>
  <h1>{{ app_name }}</h1>
  <nav>
    <a href="/" class="{{ 'active' if page == 'home' }}">Dashboard</a>
    <a href="/controls" class="{{ 'active' if page == 'controls' }}">Controls</a>
  </nav>
  <span class="ver">v{{ version }}</span>
</header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
