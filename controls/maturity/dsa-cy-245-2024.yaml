# 1cyber Comply - Cyprus DSA cybersecurity maturity model catalogue
#
# Source: Decision K.D.P. 245/2024 of the Digital Security Authority (DSA), Annex E.
# Unofficial English translation; the Greek original prevails.
# Each EU national authority has its own framework, so each gets its own catalogue file.
#
# Field reference:
#   level0: the state that scores 0 (no measures in place)
#   levels: requirements per maturity level 1-5; ids keep the original numbering
#   na:     the requirement may be answered 'not applicable' under that section (justification required)
#   common: K1/K2/R1 marks a requirement repeated across measures (see common_requirements)
#   page:   page of K.D.P. 245/2024 where the measure starts

framework:
  id: dsa-cy-245-2024
  name: Cyprus DSA Cybersecurity Maturity Model
  authority: Digital Security Authority (DSA), Cyprus
  reference: K.D.P. 245/2024, Annex E
  language: en
  translation: >-
    Unofficial English translation by the 1cyber Comply project. The Greek text published in the Official
    Gazette of the Republic of Cyprus prevails. Requirement numbering follows the original, including
    gaps.
  scoring:
    type: maturity
    levels:
    - 0
    - 1
    - 2
    - 3
    - 4
    - 5
    cumulative: true
    target_level: 3
    rule: >-
      Levels are cumulative. A measure scores the highest level whose requirements, and the requirements
      of every level below it, are all met. The first unmet requirement is reported as the blocking requirement.
      The organisation is mature when every measure scores at least the target level.
  common_requirements:
    K1: >-
      The skills, capabilities and knowledge that the authorised roles need to run this process have been
      identified.
    K2: >-
      The organisation ensures that the responsible staff already have this knowledge, or otherwise arranges
      for them to acquire it.
    R1: >-
      The related documents are reviewed for suitability at least once a year. Any changes follow the
      change management process.
  not_applicable:
    cloud:
      title: Cloud
      condition: >-
        Only where the organisation does not use cloud services. DSA auditors accept not applicable for
        these requirements when the justification is noted in place.
categories:
- id: STR
  title: Strategy
  measures:
  - id: STR1
    title: Information security strategy
    objective: >-
      Establish an information security strategy that sets out the objectives and the high-level approach
      for mitigating information security risks.
    description: >-
      Define the vision and commitment for information security in a strategy that details specific security
      objectives, the approach to security and risk management, and the means of validating the strategy's
      effectiveness, supported by key performance indicators. The strategy is reflected in the information
      security policy [GOV3]. Staff know the strategy and the policy [TA1].
    source: C2M2 (Program)
    page: 32
    level0: >-
      The organisation has not structured or expressed its information security strategy in any way.
    levels:
      1:
      - id: '1.1'
        text: A documented information security strategy exists.
      - id: '1.2'
        text: >-
          The strategy contains a list of information security objectives, related actions to implement,
          and at least a high-level plan for implementing them.
      - id: '1.3'
        text: The strategy is managed and implemented at least ad hoc.
      2:
      - id: '2.1'
        text: >-
          The implementation plan states at least: 1) what must be implemented, 2) by when, 3) who is
          responsible for monitoring and completing it, 4) what resources are needed, and 5) how, and
          by which role, correct and effective implementation will be assessed.
      3:
      - id: '3.1'
        text: >-
          The documented strategy details specific security objectives, the approach to security and risk
          management, and the means of validating its effectiveness, supported by key performance indicators.
      - id: '3.2'
        text: >-
          The information security strategy is reflected in the information security policy, as described
          in measure [GOV3].
      - id: '3.3'
        text: Staff know the information security strategy and policy, as described in measure [TA1].
      - id: '3.4'
        text: >-
          Management supports the actions arising from the strategy by providing resources, knowledge
          and time.
      4:
      - id: '4.1'
        text: A documented process manages the lifecycle of the strategy.
      - id: '4.2'
        text: >-
          The process includes a review of the suitability of its elements at least once a year; resulting
          changes are made through the change management process.
      - id: '4.3'
        text: >-
          The process includes checking the policy's consistency with the organisation's objectives and
          with the requirements of its internal and external context.
      - id: '4.4'
        text: >-
          The process defines how the effectiveness of the individual strategy actions will be validated.
      - id: '4.5'
        text: >-
          The process produces key performance indicators directly linked to the organisation's objectives.
      5:
      - id: '5.1'
        text: >-
          The information security strategy is a sub-section of the organisation's business strategy.
      - id: '5.2'
        text: The strategy is part of the organisation's overall governance framework.
      - id: '5.3'
        text: >-
          Through governance, the organisation gives strategic direction so that it meets its obligations
          (legal, regulatory, contractual and other), manages risk effectively, uses its resources effectively
          and meets its objectives.
      - id: '5.4'
        text: >-
          Governance is supported by a formal information security oversight structure (cybersecurity
          oversight committee).
      - id: '5.5'
        text: >-
          Governance is supported by a system through which relevant controls are carried out regularly
          and effectively.
      - id: '5.6'
        text: >-
          Governance is supported by reports to senior management on implementation of the strategy and
          achievement of objectives, on high risks and on progress of treatment measures.
      - id: '5.7'
        text: Governance is supported by reports on security incidents and near misses.
      - id: '5.8'
        text: Governance is supported by trend analysis and improvement proposals.
      - id: '5.9'
        common: K1
        text: >-
          The skills, capabilities and knowledge that the authorised roles need to run this process have
          been identified.
      - id: '5.10'
        common: K2
        text: >-
          The organisation ensures that the responsible staff already have this knowledge, or otherwise
          arranges for them to acquire it.
- id: GOV
  title: Governance
  measures:
  - id: GOV1
    title: Information security roles and responsibilities
    objective: Define the roles and responsibilities for information security within the organisation.
    description: >-
      Define network and information security roles and responsibilities for all staff who process information
      or have access to information processing systems. The roles are reflected in the information security
      policy [GOV3]. Staff must be adequately informed and aware of their roles and responsibilities,
      as set out in measures [TA1, TA2]. Management should define these roles so that it is accountable
      for its decisions on network and information system security.
    source: C2M2, ISO 27002
    page: 34
    level0: >-
      The organisation has no systematic way of identifying the applicable legal and regulatory obligations
      for network and information security.
    levels:
      1:
      - id: '1.1'
        text: >-
          Network and information security roles and responsibilities have been defined for all staff
          who process information or have access to information processing systems.
      2:
      - id: '2.1'
        text: >-
          Roles and responsibilities are recorded and assigned to the corresponding staff, in a systematic
          and documented way.
      - id: '2.2'
        text: Management has approved the roles and responsibilities and their assignment.
      - id: '2.3'
        text: >-
          Conflicting duties and areas of responsibility are segregated to reduce opportunities for unauthorised
          or unintentional modification or misuse of the organisation's assets.
      - id: '2.4'
        text: The organisation has appointed a Network and Information Systems Security Officer.
      - id: '2.5'
        text: >-
          All minimum duties and characteristics of the Security Officer position set out in the legislation
          (KDP 389/2020, Article 12(3) and (4)) are met.
      - id: '2.6'
        text: >-
          The Security Officer was appointed on the basis of professional qualifications, mainly specialist
          knowledge of network and information security and the ability to perform the duties in paragraph
          (3) of the relevant legislation.
      - id: '2.7'
        text: >-
          The Security Officer performs these duties exclusively. (In small organisations the officer
          may perform other duties only where they do not create a conflict of interest, taking into account
          the entity's criticality level, and with the Authority's approval.)
      - id: '2.8'
        text: The entity has notified the Authority of the Security Officer's contact details.
      - id: '2.9'
        text: >-
          The entity ensures that candidates for the Security Officer position are adequately screened
          and that the person will perform the duties properly.
      3:
      - id: '3.1'
        text: >-
          Roles and responsibilities are reflected in the information security policy [GOV3], and all
          staff have been informed and made aware of their network and information security roles and
          responsibilities, as set out in measures [TA1, TA2].
      - id: '3.2'
        text: Roles and responsibilities are reviewed and updated, not necessarily systematically.
      4:
      - id: '4.1'
        text: >-
          Roles and responsibilities are reviewed and updated where needed at least annually, or when
          critical organisational changes affect them. Changes follow the change management process.
      - id: '4.2'
        text: >-
          Risks related to conflicting duties have been identified, assessed and treated as required.
      5:
      - id: '5.1'
        text: >-
          Assigned roles and responsibilities are managed to ensure adequate and redundant coverage, including
          succession planning.
      - id: '5.2'
        common: K1
        text: >-
          The skills, capabilities and knowledge that the authorised roles need to run this process have
          been identified.
      - id: '5.3'
        common: K2
        text: >-
          The organisation ensures that the responsible staff already have this knowledge, or otherwise
          arranges for them to acquire it.
  - id: GOV2
    title: Compliance with legal and regulatory obligations
    objective: >-
      Ensure compliance with all applicable legal and regulatory obligations for network and information
      security.
    description: >-
      Create and maintain a central repository of, and comply with, all relevant legislative, regulatory
      and contractual requirements for network and information security.
    source: ISMM (Compliance), ISO 27002 (18.1), NIST 800-53(AU-6, AU-11), C2M2 (Program)
    page: 35
    level0: >-
      The organisation has no systematic way of identifying the applicable legal and regulatory obligations
      for network and information security.
    levels:
      1:
      - id: '1.1'
        text: >-
          Some legislative, regulatory and contractual network and information security requirements have
          been identified and recorded.
      - id: '1.2'
        text: The processes for identifying requirements and checking compliance are at least ad hoc.
      2:
      - id: '2.1'
        text: >-
          All legislative, regulatory and contractual network and information security requirements have
          been identified and recorded.
      - id: '2.2'
        text: Checking compliance with these requirements has been assigned to an internal role.
      3:
      - id: '3.1'
        text: >-
          A central repository of all relevant legislative, regulatory and contractual network and information
          security requirements has been created and is maintained.
      4:
      - id: '4.1'
        text: >-
          A documented process exists, and an internal audit (by the internal audit function and/or a
          service provider) is carried out at least annually to establish compliance with all relevant
          legislative, regulatory and contractual requirements.
      - id: '4.2'
        text: >-
          The process makes provision for timely identification of relevant legislative, regulatory and
          contractual requirements.
      - id: '4.3'
        text: The central repository is updated when requirements are added or changed.
      - id: '4.4'
        text: >-
          The contents of the repository are communicated to the responsible staff as and when required.
      - id: '4.5'
        text: >-
          When a deviation from one or more requirements is found, a documented compliance action plan
          is created, stating: 1) what must be implemented, 2) by when, 3) who is responsible for monitoring
          and completing it, 4) what resources are needed, and 5) how, and by which role, correct and
          effective implementation will be assessed.
      - id: '4.6'
        text: >-
          The related policies and procedures are reviewed for suitability at least once a year. Any changes
          follow the change management process.
      5:
      - id: '5.1'
        text: >-
          The organisation commissions external inspections or audits of compliance with all relevant
          legislative, regulatory and contractual requirements.
      - id: '5.2'
        text: >-
          Audit data (internal and external) is protected from unauthorised access and kept for at least
          5 years, unless the relevant legislation provides otherwise.
      - id: '5.3'
        text: >-
          Where feasible, the organisation takes part in activities that keep it informed as early as
          possible of upcoming changes or new requirements.
      - id: '5.4'
        common: K1
        text: >-
          The skills, capabilities and knowledge that the authorised roles need to run this process have
          been identified.
      - id: '5.5'
        common: K2
        text: >-
          The organisation ensures that the responsible staff already have this knowledge, or otherwise
          arranges for them to acquire it.
  - id: GOV3
    title: Information security policies, standards, guidelines and procedures
    objective: >-
      Establish information security policies, standards, guidelines and procedures that reflect the information
      security strategy.
    description: >-
      Define the information security measures and describe their implementation in detail within an information
      security policy that reflects the objectives of the strategy [STR1]. The policy should include organisational
      roles and responsibilities [GOV1]. Implement specific policies and procedures for particular processing,
      systems or activities as needed, and define operational guidelines and standard operating procedures
      for activities involving information or information processing systems.
    source: ISO 27002
    page: 36
    level0: The organisation has not defined information security policies, guidelines or procedures.
    levels:
      1:
      - id: '1.1'
        text: A set of information security procedures and guidelines is followed.
      - id: '1.2'
        text: >-
          Policies and procedures are applied at least partially; staff may not be informed, or not fully
          informed.
      2:
      - id: '2.1'
        text: An information security policy exists that summarises and describes the measures taken.
      3:
      - id: '3.1'
        text: >-
          An information security policy exists that describes the measures taken in detail, including
          a detailed description of how they are implemented.
      - id: '3.2'
        text: >-
          The information security policy reflects the objectives in the information security strategy
          [STR1].
      - id: '3.3'
        text: >-
          The information security policy includes the organisational roles and responsibilities, as defined
          in [GOV1].
      - id: '3.4'
        text: >-
          A set of policies, guidelines and standard operating procedures has been created and is applied
          for specific processing, systems or activities as needed, and staff have been informed and trained
          on them.
      - id: '3.5'
        text: All policies and procedures have been approved by management.
      - id: '3.6'
        text: Staff have been informed and trained on the policies and procedures.
      4:
      - id: '4.1'
        text: >-
          All policies and procedures are reviewed for suitability at least once a year. Any changes follow
          the change management process.
      - id: '4.2'
        text: >-
          The review includes assessing opportunities to improve the policies, guidelines and procedures
          and the organisation's approach to information security, in response to changes in the organisational,
          business, legal or technical environment.
      5:
      - id: '5.1'
        text: The organisation uses automated systems to manage the related documentation.
      - id: '5.2'
        text: >-
          Policies and procedures are largely implemented through automated workflows, allowing direct
          integration of data, approvals and implementation.
      - id: '5.3'
        common: K1
        text: >-
          The skills, capabilities and knowledge that the authorised roles need to run this process have
          been identified.
      - id: '5.4'
        common: K2
        text: >-
          The organisation ensures that the responsible staff already have this knowledge, or otherwise
          arranges for them to acquire it.
- id: RM
  title: Risk management
  measures:
  - id: RM1
    title: Risk management methodology
    objective: >-
      Establish a risk management methodology that reflects the organisation's risk assessment process,
      risk analysis criteria, risk acceptance criteria and risk appetite policy.
    description: >-
      Define the risk assessment process, the risk analysis criteria (impact criteria, likelihood criteria,
      risk scoring), the risk acceptance criteria and the organisation's risk appetite policy. The methodology
      lets the organisation assess its information security risks and apply appropriate measures to treat
      or mitigate them. As a minimum the organisation keeps a risk register, a risk treatment plan and
      an information security governance structure detailing roles and responsibilities. The methodology
      is validated, agreed and supported by senior management and other relevant parties.
    source: C2M2 (Risk), NIST 800-53 (PM-9), ISO 27001 6.1
    page: 37
    level0: The organisation takes no action to manage information and network security risks.
    levels:
      1:
      - id: '1.1'
        text: >-
          Information and network security risk analysis and evaluation is carried out ad hoc, or has
          been carried out at least once in the last 2 years.
      - id: '1.2'
        text: >-
          The process is at least partly documented and is reflected in the records kept during its execution.
      2:
      - id: '2.1'
        text: A documented process for managing information and network security risks has been created.
      - id: '2.2'
        text: >-
          The process defines at least roles and responsibilities, criteria for carrying out risk assessment,
          and the records to be kept.
      - id: '2.4'
        text: Applying the process produces at least a prioritisation of the identified risks.
      - id: '2.3'
        text: >-
          All relevant information on information security risk management is recorded and provided to
          the Authority annually or on request.
      3:
      - id: '3.1'
        text: A risk management methodology has been established and documented.
      - id: '3.2'
        text: >-
          The methodology contains the risk assessment process and defines the risk analysis criteria
          (at least impact criteria, likelihood criteria and functions for deriving the risk score), the
          risk acceptance criteria and the organisation's risk appetite policy.
      - id: '3.3'
        text: >-
          The methodology defines the role of risk owner and describes risk owners' roles and responsibilities
          in risk management.
      - id: '3.4'
        text: >-
          The methodology allows the organisation to assess its information security risks and apply appropriate
          measures to treat or mitigate them, taking its operating context into account.
      - id: '3.5'
        text: >-
          Processes and tools support risk management as appropriate, including at least a risk register,
          a risk treatment plan and an information security governance structure detailing roles and responsibilities.
      - id: '3.6'
        text: >-
          The methodology is validated, agreed and supported by senior management and other relevant parties
          in the organisation.
      - id: '3.7'
        text: >-
          The methodology requires that it is applied in the organisation at regular intervals, at least
          annually.
      4:
      - id: '4.1'
        text: The risk management methodology follows relevant international best practice.
      - id: '4.2'
        text: >-
          The methodology covers the following steps: context establishment, risk assessment (risk identification,
          analysis and evaluation), risk treatment, risk recording and reporting, communication, and risk
          monitoring and review.
      - id: '4.3'
        text: >-
          The impact criteria are tailored to the organisation's business needs and objectives in the
          strategy [STR1], so that all staff involved can better understand how to complete the assessment
          and its results.
      - id: '4.4'
        text: >-
          The organisation measures, monitors and records risk management performance through suitable
          metrics.
      - id: '4.5'
        text: >-
          The methodology is compatible with, and feeds into, the Enterprise Risk Management process.
      - id: '4.6'
        text: >-
          A person with sufficient authority has been appointed to manage and monitor the methodology
          overall.
      - id: '4.7'
        common: R1
        text: >-
          The related documents are reviewed for suitability at least once a year. Any changes follow
          the change management process.
      - id: '4.8'
        text: >-
          The methodology clearly states how often it is applied and the need to update it after significant
          changes.
      - id: '4.9'
        text: >-
          A distinct risk appetite policy exists, directly linked to the organisation's objectives, context
          and strategy, and reflected in the risk acceptance criteria.
      5:
      - id: '5.1'
        text: >-
          The risk management methodology is part of the organisation's governance framework and is consistent
          with the strategy [STR1].
      - id: '5.2'
        text: >-
          External audits cover the design, operation and improvement of the risk management methodology.
      - id: '5.3'
        text: >-
          When a deviation from one or more requirements is found, a documented compliance action plan
          is created.
      - id: '5.4'
        common: K1
        text: >-
          The skills, capabilities and knowledge that the authorised roles need to run this process have
          been identified.
      - id: '5.5'
        common: K2
        text: >-
          The organisation ensures that the responsible staff already have this knowledge, or otherwise
          arranges for them to acquire it.
      - id: '5.6'
        text: >-
          Information on how the organisation manages information and network security risks is communicated
          to the relevant internal and external parties as required, and they are updated when the status
          of those risks changes.
  - id: RM2
    title: Context
    objective: Draw up an inventory of the organisation's assets, systems and processes.
    description: >-
      Draw up an inventory of assets, systems and processes and record the dependencies and interdependencies
      between them, to describe clearly the context in which risk assessment takes place. A clear picture
      of the context allows risks within the organisation to be identified.
    source: C2M2 (Configuration), NIST 800-53 (PM-9), ISO 27001 Α.8
    page: 38
    level0: >-
      The organisation has no specific or organised way of identifying its assets, systems and processes.
    levels:
      1:
      - id: '1.1'
        text: >-
          Assets are recorded at least non-systematically. A record is kept, centrally managed or not,
          and updated at least ad hoc.
      2:
      - id: '2.1'
        text: >-
          An inventory of the organisation's assets, systems and processes is kept; it may not include
          their interdependencies.
      - id: '2.2'
        text: The inventory has an identified owner responsible for keeping and updating its data.
      3:
      - id: '3.1'
        text: >-
          The inventory records the dependencies and interdependencies between assets, systems and processes,
          to describe clearly the context in which risk assessment takes place.
      - id: '3.3'
        text: >-
          A resource management process, as in [AM1], ensures the inventory is updated promptly when changes
          occur.
      4:
      - id: '4.1'
        text: >-
          An automated system identifies and records assets and systems both inside the organisation and
          outside it (hosted by third parties).
      - id: '4.2'
        text: >-
          Data from the automated system is supplemented with process information, and dependencies and
          interdependencies are mapped as automatically as possible.
      - id: '4.3'
        common: R1
        text: >-
          The related documents are reviewed for suitability at least once a year. Any changes follow
          the change management process.
      5:
      - id: '5.1'
        text: >-
          An automated system and processes check the integrity and validity of the asset, system and
          process inventory.
      - id: '5.2'
        text: >-
          When an item not in the inventory is detected, the responsible staff are notified automatically
          to check and update the data.
      - id: '5.3'
        text: >-
          For assets in particular, immediate containment actions are taken until the investigation is
          complete.
      - id: '5.4'
        common: K1
        text: >-
          The skills, capabilities and knowledge that the authorised roles need to run this process have
          been identified.
      - id: '5.5'
        common: K2
        text: >-
          The organisation ensures that the responsible staff already have this knowledge, or otherwise
          arranges for them to acquire it.
  - id: RM3
    title: Risk identification
    objective: >-
      Identify the threats, vulnerabilities and risks to which the organisation's assets, systems and
      processes are exposed.
    description: >-
      Identify and list the threats, vulnerabilities and risks to which the organisation is exposed with
      respect to the assets, systems and processes in measure [RM2]. Identified risks are recorded in
      a risk register so the organisation can monitor its exposure.
    source: C2M2 (RISK), NIST 800-53 (RA-1, RA-5), ISO 27001 6.1., ISO 27005
    page: 39
    level0: The organisation takes no action to identify information and network security risks.
    levels:
      1:
      - id: '1.1'
        text: >-
          Information and network security risk analysis and evaluation (risk identification) is carried
          out at least ad hoc, or has been carried out at least once in the last 2 years.
      - id: '1.2'
        text: >-
          The risk identification process may not be fully documented, but at least a list of information
          and network security risks has been created and is maintained.
      2:
      - id: '2.1'
        text: >-
          A complete documented process for managing information and network security risks exists, and
          it covers risk identification.
      - id: '2.2'
        text: >-
          The process defines at least roles and responsibilities, criteria for risk identification, and
          the records to be kept.
      - id: '2.3'
        text: Risks are identified for each item in the inventory of assets, systems and processes.
      3:
      - id: '3.1'
        text: >-
          The organisation has identified and listed the threats, vulnerabilities and risks it is exposed
          to with respect to the assets, systems and processes in measure [RM2].
      - id: '3.2'
        text: >-
          Identified risks are recorded in a risk register so the organisation can monitor the threats,
          vulnerabilities and risks it is exposed to.
      - id: '3.3'
        text: The list is consistent with international best practice.
      - id: '3.4'
        text: Each risk has at least one risk owner, as defined in the process in [RM1].
      - id: '3.5'
        text: >-
          The list always includes risks of accidental or unlawful destruction, loss, alteration, unauthorised
          disclosure of or access to information transmitted, stored or otherwise processed, and other
          risks that could affect essential economic and social functions and services provided by the
          operator of essential services or critical information infrastructure.
      4:
      - id: '4.1'
        text: >-
          Risks have been identified on the basis of the up-to-date inventory of assets, systems and processes
          described in [RM2].
      - id: '4.2'
        text: >-
          Risks cover all categories of risk sources, whether or not they are under the organisation's
          control. For complex and critical risk scenarios the methodology is iterated, first at high
          level and then in more detail, until the correct root cause is identified.
      - id: '4.3'
        text: >-
          Where assumptions and groupings have been made, they are documented with their rationale, showing
          that the risks are relevant at all levels of the organisation's context.
      - id: '4.4'
        text: >-
          Risk identification is a core part of risk management and is carried out at the frequency set
          in the process in [RM1].
      - id: '4.5'
        text: >-
          When the parties involved find that weaknesses, threats or risks no longer apply, the list is
          updated to mark the entry as inactive; the history is kept and documented.
      - id: '4.6'
        text: >-
          The list is updated and enriched in connection with the vulnerability recording and reporting
          process in [VM2].
      - id: '4.7'
        common: R1
        text: >-
          The related documents are reviewed for suitability at least once a year. Any changes follow
          the change management process.
      - id: '4.9'
        text: >-
          Threats, vulnerabilities and risks are identified with the participation of as many internal
          parties as possible.
      - id: '4.10'
        text: >-
          Staff know of a process through which they can report threats, vulnerabilities and risks ad
          hoc.
      - id: '4.11'
        text: >-
          The completeness of the lists is checked regularly against authoritative international sources.
      5:
      - id: '5.1'
        text: >-
          Reliable cyber threat intelligence is received in time and used, among other things, to update
          the list of threats, vulnerabilities and risks.
      - id: '5.2'
        text: >-
          Lessons learned from information security events and incidents are used to update the list of
          threats, vulnerabilities and risks, as set out in [EIM4].
      - id: '5.3'
        text: >-
          Regular, dedicated meetings with internal and external parties help enrich and update the list
          of threats, vulnerabilities and risks.
      - id: '5.4'
        text: >-
          Findings from internal and external audits that show compliance gaps are recorded as risks and
          analysed in the list.
      - id: '5.5'
        text: >-
          Risks arising from dependence on other critical infrastructure or third parties are included
          in the list.
      - id: '5.6'
        common: K1
        text: >-
          The skills, capabilities and knowledge that the authorised roles need to run this process have
          been identified.
      - id: '5.7'
        common: K2
        text: >-
          The organisation ensures that the responsible staff already have this knowledge, or otherwise
          arranges for them to acquire it.
  - id: RM4
    title: Risk analysis
    objective: Analyse information security risks to assets according to their likelihoods and impacts.
    description: >-
      Analyse information security risks to the assets identified in [RM2], taking into account the likelihood
      and impact ratings defined in [RM1]. The organisation determines a risk score in order to choose
      the appropriate mitigation strategy [RM5]. Risks of accidental or unlawful destruction, loss, alteration,
      unauthorised disclosure of or access to information are considered in particular, as are risks that
      could affect essential economic and social functions and services provided by the operator. Results
      are recorded in the risk register.
    source: C2M2 (RISK), NIST 800-53 (RA-1, RA-6), ISO 27001 6.1., ISO 27005
    page: 41
    level0: The organisation takes no action to analyse information and network security risks.
    levels:
      1:
      - id: '1.1'
        text: >-
          Information and network security risk analysis is carried out at least ad hoc, or has been carried
          out at least once in the last 2 years.
      - id: '1.2'
        text: >-
          The risk analysis process may not be fully documented, but at least a record of the analysis
          criteria and results is kept.
      2:
      - id: '2.1'
        text: >-
          A complete documented process for managing information and network security risks exists, and
          it covers risk analysis.
      - id: '2.2'
        text: >-
          The process defines at least roles and responsibilities, criteria for risk analysis, and the
          records to be kept.
      - id: '2.3'
        text: Risks are analysed for each item in the inventory of assets, systems and processes.
      3:
      - id: '3.1'
        text: >-
          Information security risks to the assets identified in [RM2] are analysed, taking into account
          the likelihood and impact ratings defined in [RM1].
      - id: '3.2'
        text: Each risk is determined and scored to choose the appropriate mitigation strategy [RM5].
      - id: '3.3'
        text: >-
          When assessing the appropriate security level, risks of accidental or unlawful destruction,
          loss, alteration, unauthorised disclosure of or access to information transmitted, stored or
          otherwise processed are considered in particular, as are risks that could affect essential economic
          and social functions and services provided by the operator of essential services or critical
          information infrastructure.
      - id: '3.4'
        text: Risk analysis results are recorded in the organisation's risk register.
      4:
      - id: '4.1'
        text: >-
          Likelihood and impact estimates take into account independent and dependent events (e.g. a second
          event that can occur because a first one has happened).
      - id: '4.2'
        text: Methods are in place to identify cascading risks and their impacts.
      - id: '4.3'
        common: R1
        text: >-
          The related documents are reviewed for suitability at least once a year. Any changes follow
          the change management process.
      - id: '4.4'
        text: Risk analysis involves as many internal parties as possible.
      - id: '4.5'
        text: >-
          Staff know of a process for informing the responsible staff when an error or omission in the
          risk analysis is found.
      - id: '4.6'
        text: >-
          Existing controls, if any, are taken into account when determining the likelihood and impact
          of identified risks.
      5:
      - id: '5.1'
        text: >-
          Reliable cyber threat intelligence is received in time and used, among other things, to update
          the risk analysis results.
      - id: '5.2'
        text: >-
          Lessons learned from information security events and incidents are used to update the risk analysis
          results, as set out in [EIM4].
      - id: '5.3'
        text: >-
          Regular, dedicated meetings with internal and external parties assess the correctness and validity
          of the risk analysis results.
      - id: '5.4'
        text: >-
          Relevant results of internal and external audits are used to update the risk analysis results.
      - id: '5.5'
        common: K1
        text: >-
          The skills, capabilities and knowledge that the authorised roles need to run this process have
          been identified.
      - id: '5.6'
        common: K2
        text: >-
          The organisation ensures that the responsible staff already have this knowledge, or otherwise
          arranges for them to acquire it.
      - id: '5.7'
        text: >-
          Where possible, automated tools and databases identify the vulnerabilities of assets, assess
          how easily they can be exploited, define attack scenarios and paths, and determine the likelihood
          of specific risks.
      - id: '5.8'
        text: >-
          A systematic framework checks the effectiveness of the controls implemented, and effectiveness
          data feeds systematically into the risk analysis.
  - id: RM5
    title: Risk evaluation
    objective: >-
      Evaluate information security risks against the organisation's risk appetite policy and decide on
      appropriate treatment strategies.
    description: >-
      Define appropriate and adequate strategies for treating the risks analysed under [RM4]. The organisation
      considers risk reduction, transfer, avoidance and acceptance (retention), taking into account the
      risk appetite policy in [RM1]. The result is recorded in the risk register.
    source: C2M2 (RISK), NIST 800-53 (RA-1, RA-6), ISO 27001 6.1., ISO 27005
    page: 42
    level0: The organisation takes no action to evaluate information and network security risks.
    levels:
      1:
      - id: '1.1'
        text: >-
          Information and network security risk evaluation is carried out at least ad hoc, or has been
          carried out at least once in the last 2 years.
      - id: '1.2'
        text: >-
          The risk evaluation process may not be fully documented, but at least a record of the evaluation
          criteria and results is kept.
      2:
      - id: '2.1'
        text: >-
          A complete documented process for managing information and network security risks exists, and
          it covers risk evaluation.
      - id: '2.2'
        text: >-
          The process defines at least roles and responsibilities, criteria for risk evaluation, and the
          records to be kept.
      - id: '2.3'
        text: Risks are evaluated for each item in the inventory of assets, systems and processes.
      3:
      - id: '3.1'
        text: >-
          Appropriate and adequate strategies have been defined for treating the risks analysed under
          [RM4].
      - id: '3.2'
        text: >-
          Risk reduction, transfer, avoidance and acceptance (retention) are considered as treatment strategies.
      - id: '3.3'
        text: >-
          The risk appetite policy defined in [RM1] is taken into account when evaluating treatment strategies.
      - id: '3.4'
        text: The result of risk evaluation is recorded in the organisation's risk register.
      - id: '3.5'
        text: Decisions on the strategy chosen in each case are documented and retained.
      4:
      - id: '4.1'
        text: >-
          Possible and chosen strategies are reviewed periodically by appropriately authorised parties
          to check that they remain suitable and effective.
      - id: '4.2'
        text: >-
          Changes in technology, services or new strategic partnerships trigger a review of the related
          strategies and decisions.
      - id: '4.3'
        common: R1
        text: >-
          The related documents are reviewed for suitability at least once a year. Any changes follow
          the change management process.
      - id: '4.4'
        text: >-
          The risk owner gives written acceptance of the residual risk and of the chosen treatment strategy.
      5:
      - id: '5.1'
        text: >-
          When choosing strategies, documentation is kept of pros, cons and an estimated cost, using internationally
          recognised practices (e.g. ROSI).
      - id: '5.2'
        common: K1
        text: >-
          The skills, capabilities and knowledge that the authorised roles need to run this process have
          been identified.
      - id: '5.3'
        common: K2
        text: >-
          The organisation ensures that the responsible staff already have this knowledge, or otherwise
          arranges for them to acquire it.
  - id: RM6
    title: Risk treatment
    objective: Define the actions for treating information security risks.
    description: >-
      Define appropriate and adequate risk treatment measures to implement the strategies chosen in the
      evaluation process [RM5]. The organisation considers preventive, detective and corrective measures
      from an administrative, technical and physical perspective, to achieve defence in depth where appropriate,
      and considers the security measures in the measures framework. The result is recorded in the risk
      treatment plan.
    source: C2M2 (RISK), NIST 800-53 (RA-1, RA-6), ISO 27001 6.1., ISO 27005
    page: 43
    level0: The organisation takes no action to treat information and network security risks.
    levels:
      1:
      - id: '1.1'
        text: >-
          Risk treatment actions are carried out at least ad hoc, or have been carried out at least once
          in the last 2 years.
      - id: '1.2'
        text: >-
          The risk treatment process may not be fully documented, but at least a record of the related
          actions is kept.
      2:
      - id: '2.1'
        text: >-
          A complete documented process for managing information and network security risks exists, and
          it covers risk treatment.
      - id: '2.2'
        text: >-
          The process defines at least roles and responsibilities, criteria for risk treatment, and the
          records to be kept.
      - id: '2.3'
        text: >-
          A record of treatment actions states what will be done, by when, who is responsible, and the
          expected risk level after treatment.
      3:
      - id: '3.1'
        text: >-
          Appropriate and adequate treatment measures are defined to implement the treatment strategy
          chosen in the evaluation process [RM5].
      - id: '3.2'
        text: >-
          Preventive, detective and corrective measures are considered from an administrative, technical
          and physical perspective, to achieve defence in depth where appropriate.
      - id: '3.3'
        text: >-
          The entity considers the security measures in the Authority's legislation (KDP 389/2020) when
          defining treatment actions.
      - id: '3.4'
        text: The result of risk treatment is recorded in the organisation's risk treatment plan.
      - id: '3.5'
        text: >-
          For each risk, the plan states at least: what will be done, by when, who is responsible, the
          expected risk level after treatment, the resources needed, how effectiveness will be checked,
          and the risk owner.
      4:
      - id: '4.1'
        text: >-
          Progress of treatment actions is checked periodically. The deadline for each action depends
          on the risk's criticality, as set in the process.
      - id: '4.2'
        common: R1
        text: >-
          The related documents are reviewed for suitability at least once a year. Any changes follow
          the change management process.
      - id: '4.3'
        text: >-
          The completeness of the chosen measures is checked regularly against structured control lists
          (e.g. ISO 27002 / ISO 27001 Annex A, ISO 27017, ISO 27011).
      - id: '4.4'
        text: >-
          When a feasible new action is identified, the organisation assesses it by running the risk management
          steps for the risks it could address.
      5:
      - id: '5.1'
        common: K1
        text: >-
          The skills, capabilities and knowledge that the authorised roles need to run this process have
          been identified.
      - id: '5.2'
        common: K2
        text: >-
          The organisation ensures that the responsible staff already have this knowledge, or otherwise
          arranges for them to acquire it.
      - id: '5.3'
        text: A systematic framework checks the effectiveness of the treatment measures implemented.
      - id: '5.4'
        text: >-
          The organisation commissions external inspections or audits of the effectiveness of the implemented
          measures.
      - id: '5.5'
        text: >-
          Effectiveness data feeds systematically into risk evaluation and treatment so that changes are
          made where needed.
- id: TA
  title: Awareness and training
  measures:
  - id: TA1
    title: Information security awareness
    objective: >-
      Establish an information security awareness programme for all staff, taking into account the organisation's
      information security policies, standards, guidelines and procedures.
    description: >-
      Define an information security awareness programme so that staff are adequately aware of their network
      and information security roles and responsibilities, as defined in [GOV1].
    source: CIS, ISO 27002
    page: 45
    level0: The organisation has no information security awareness programme for its staff.
    levels:
      1:
      - id: '1.1'
        text: An information security awareness programme exists; it may not run systematically.
      - id: '1.2'
        text: The training covers at least the basic principles of information security.
      2:
      - id: '2.1'
        text: >-
          An information security awareness programme is attended by all staff at set intervals, so that
          they understand and show the behaviours and skills needed to keep the organisation secure.
      3:
      - id: '3.1'
        text: >-
          An information security awareness programme has been defined so that staff are adequately aware
          of their network and information security roles and responsibilities, as defined in [GOV1].
      - id: '3.2'
        text: >-
          The programme is based on the organisation's policies and procedures, taking into account the
          information to be protected and the measures in place to protect it.
      - id: '3.3'
        text: The programme is designed around the roles of the organisation's employees.
      - id: '3.4'
        text: >-
          Programme activities are scheduled at regular intervals, at least once a year, so that they
          are repeated and reach new employees.
      - id: '3.5'
        text: New employees are trained as soon as possible after hiring.
      4:
      - id: '4.1'
        text: >-
          The programme is updated regularly to stay consistent with organisational policies and procedures,
          and draws on lessons learned from information security incidents.
      - id: '4.2'
        text: >-
          The programme includes a range of awareness activities, such as campaigns (e.g. an 'information
          security day') and leaflets or newsletters.
      - id: '4.3'
        text: >-
          The programme's effectiveness is assessed periodically (at least once a year) and improved as
          needed. Changes follow the change management process.
      - id: '4.4'
        text: >-
          The programme takes into account the organisation's awareness expectations for contractors,
          which are communicated to them.
      5:
      - id: '5.1'
        text: >-
          The programme uses different forms of training (e.g. lectures, self-study) and includes continuous
          training and professional development for staff with significant information security responsibilities.
      - id: '5.2'
        common: K1
        text: >-
          The skills, capabilities and knowledge that the authorised roles need to run this process have
          been identified.
      - id: '5.3'
        common: K2
        text: >-
          The organisation ensures that the responsible staff already have this knowledge, or otherwise
          arranges for them to acquire it.
  - id: TA2
    title: Information security awareness and training
    objective: Provide training to all staff as defined in the information security programme.
    description: >-
      Keep staff adequately informed of their network and information security roles and responsibilities
      [GOV1] through suitable education and training supported by senior management. Training includes
      specific information on the staff's operational activities on behalf of the organisation involving
      information processing or access to information processing systems.
    source: C2M2, ISO 27002, ISO 27003, ENISA
    page: 46
    level0: The organisation does not train staff on information security.
    levels:
      1:
      - id: '1.1'
        text: Some information security training is given to the staff involved.
      2:
      - id: '2.1'
        text: >-
          All staff receive information security training systematically, not necessarily within an awareness
          programme as described in [TA1].
      - id: '2.2'
        text: Information security training objectives for staff are defined and maintained.
      3:
      - id: '3.1'
        text: >-
          Staff are adequately informed of their network and information security roles and responsibilities
          [GOV1] through suitable education and training supported by senior management.
      - id: '3.2'
        text: >-
          Training includes specific information on staff's operational activities on behalf of the organisation
          involving information processing or access to information processing systems.
      - id: '3.3'
        text: The information security awareness programme described in [TA1] is followed.
      - id: '3.4'
        text: Documented information on training sessions and their results is kept.
      4:
      - id: '4.1'
        text: Staff knowledge of information security is tested.
      - id: '4.2'
        text: >-
          Training effectiveness is assessed periodically, at least once a year, and on defined triggers
          such as system changes and external incidents, and improved as needed.
      - id: '4.3'
        text: >-
          Induction training is given not only to new employees but also to those moving to new positions
          or roles with different information security requirements.
      5:
      - id: '5.1'
        text: >-
          Staff are offered training towards recognised information security or cybersecurity certifications.
      - id: '5.2'
        text: >-
          Contacts and channels with information security groups and associations keep staff up to date
          with current recommended security practices, techniques and technologies.
      - id: '5.3'
        common: K1
        text: >-
          The skills, capabilities and knowledge that the authorised roles need to run this process have
          been identified.
      - id: '5.4'
        common: K2
        text: >-
          The organisation ensures that the responsible staff already have this knowledge, or otherwise
          arranges for them to acquire it.
- id: TPS
  title: Third-party and supplier management
  measures:
  - id: TPS1
    title: Due diligence on third parties and suppliers
    objective: Exercise due diligence on third parties and suppliers.
    description: >-
      Exercise due diligence when selecting and contracting third parties and suppliers, taking into account
      third-party risks such as supplier dependency, incident management and liability for network and
      information security, particularly when acquiring or delivering software.
    source: C2M2, ISO 27002
    page: 47
    level0: >-
      When selecting and contracting third parties and suppliers, the organisation does not consider information
      security matters such as third-party risks, dependency on the supplier, incident handling, or supplier
      liability.
    levels:
      1:
      - id: '1.1'
        text: >-
          The organisation considers suppliers' and third parties' information security capability and
          competence when selecting them, at least ad hoc.
      2:
      - id: '2.1'
        text: >-
          Key dependencies and key risks arising from suppliers and third parties are identified, at least
          ad hoc and not necessarily systematically.
      - id: '2.2'
        text: >-
          Third parties and suppliers with access to, control of or custody of systems or information
          important to the organisation are identified, at least ad hoc and not necessarily systematically.
          This may not be reflected in contracts.
      3:
      - id: '3.1'
        text: >-
          A defined method (process) is followed to identify risks arising from suppliers and third parties.
      - id: '3.2'
        text: >-
          A defined method (process) is followed to identify information security requirements and apply
          measures that protect against risks from suppliers and third parties.
      - id: '3.3'
        text: >-
          The way different types of suppliers and third parties may access information, and how that
          access is monitored and controlled, is defined.
      4:
      - id: '4.1'
        text: >-
          Suppliers and third parties periodically confirm their ability to meet the information security
          requirements agreed with the organisation.
      - id: '4.2'
        text: >-
          All policies and procedures are reviewed for suitability at least once a year. Any changes follow
          the change management process.
      5:
      - id: '5.1'
        text: >-
          Security requirements for suppliers and third parties include secure software and secure product
          development requirements, where feasible.
      - id: '5.2'
        common: K1
        text: >-
          The skills, capabilities and knowledge that the authorised roles need to run this process have
          been identified.
      - id: '5.3'
        common: K2
        text: >-
          The organisation ensures that the responsible staff already have this knowledge, or otherwise
          arranges for them to acquire it.
  - id: TPS2
    title: Third-party and supplier relationships
    objective: >-
      Ensure information security clauses are included in contracts with third parties and suppliers.
    description: >-
      Maintain a central register of suppliers, vendors and other third parties. All third-party relationships
      should be backed by appropriate contractual clauses so that, among other things, roles, responsibilities
      and liability for network and information security incidents are properly documented.
    source: C2M2, ISO 27002
    page: 47
    level0: >-
      The organisation has no contracts with suppliers or third parties that could affect information
      security.
    levels:
      1:
      - id: '1.1'
        text: Contracts with suppliers and third parties are in place.
      2:
      - id: '2.1'
        text: >-
          Contracts with suppliers and third parties include some security requirements, at least ad hoc
          and not necessarily systematically for all suppliers involved in information security matters.
      3:
      - id: '3.1'
        text: A list of suppliers and third parties has been created.
      - id: '3.2'
        text: Suppliers and third parties are prioritised according to decided and approved criteria.
      - id: '3.3'
        text: A defined method (process) is followed to assess suppliers and other third parties.
      - id: '3.4'
        text: >-
          Stricter information security controls apply to higher-priority suppliers and third parties.
      - id: '3.5'
        text: >-
          Contracts with suppliers and third parties include legal and regulatory requirements, including
          data protection and intellectual property rights, and describe how compliance will be ensured.
      - id: '3.6'
        text: >-
          Contracts with suppliers and third parties include incident management requirements and procedures
          (in particular notification and cooperation during incident recovery).
      - id: '3.7'
        text: >-
          A security policy for suppliers and third parties has been created and communicated to them.
      4:
      - id: '4.1'
        text: >-
          Supplier and third-party prioritisation is reviewed periodically and on defined triggers such
          as system changes and external incidents. Changes follow the change management process.
      - id: '4.2'
        text: >-
          Annual on-site information security inspections are carried out at higher-priority suppliers
          or third parties.
      - id: '4.3'
        text: >-
          All policies and procedures are reviewed for suitability at least once a year. Any changes follow
          the change management process.
      - id: '4.4'
        text: >-
          Contracts include the classification of information according to the organisation's classification
          scheme, and a mapping between the organisation's and the supplier's classification schemes.
      5:
      - id: '5.1'
        text: >-
          An independent third party is engaged to inspect the information security of higher-priority
          suppliers or third parties.
      - id: '5.2'
        text: Suppliers and third parties fully comply with the organisation's security requirements.
      - id: '5.3'
        common: K1
        text: >-
          The skills, capabilities and knowledge that the authorised roles need to run this process have
          been identified.
      - id: '5.4'
        common: K2
        text: >-
          The organisation ensures that the responsible staff already have this knowledge, or otherwise
          arranges for them to acquire it.
- id: DS
  title: Data security
  measures:
  - id: DS1
    title: Information lifecycle management
    objective: >-
      Protect data throughout the information lifecycle, including collection, recording, organisation,
      structuring, storage, adaptation or alteration, retrieval, consultation, use, disclosure, dissemination,
      alignment or combination, restriction, erasure or destruction.
    description: >-
      Establish, apply and maintain information security measures that protect information throughout
      its lifecycle, i.e. all stages of processing, whether automated or not.
    source: ENISA (PII MEASURES), CNIL
    page: 49
    level0: >-
      The organisation has no process or other means of identifying and applying measures to protect data
      throughout its lifecycle.
    levels:
      1:
      - id: '1.1'
        text: Some measures are applied to protect information.
      2:
      - id: '2.1'
        text: >-
          A process exists for managing the full lifecycle of the organisation's information (personal
          and non-personal data).
      - id: '2.2'
        text: >-
          The process includes a methodology or approach for identifying the information the organisation
          processes in its operations.
      - id: '2.3'
        text: >-
          Information is recorded in an inventory, at least by category (e.g. operating procedures, financial
          data, staff personal data); the inventory may be the same as, linked to or derived from the
          asset, system and process inventory in [RM2].
      - id: '2.4'
        text: The inventory has an identified owner responsible for keeping and updating its data.
      3:
      - id: '3.1'
        text: >-
          Information security measures that protect information throughout its lifecycle have been established,
          are applied and are maintained. (The lifecycle covers every processing operation, automated
          or not, such as collection, recording, organisation, structuring, storage, adaptation or alteration,
          retrieval, consultation, use, disclosure, dissemination, alignment or combination, restriction,
          erasure or destruction.)
      - id: '3.2'
        text: >-
          Information is handled according to written instructions that set out handling rules and restrictions
          throughout the lifecycle, from creation or collection to destruction.
      - id: '3.3'
        text: >-
          Destruction measures include at least: 1) multiple passes of software-based overwriting for
          reusable storage media, or physical destruction otherwise; 2) cross-cut shredding of paper;
          3) equivalent provisions in third-party contracts where required.
      - id: '3.4'
        text: Measures for data in transit or exchanged are consistent with [DS4].
      - id: '3.5'
        text: Critical or sensitive data at rest is encrypted in line with the policy in [AM5].
      - id: '3.6'
        text: The organisation has set a retention period for every data category and applies it.
      4:
      - id: '4.1'
        common: R1
        text: >-
          The related documents are reviewed for suitability at least once a year. Any changes follow
          the change management process.
      - id: '4.2'
        text: Personal data is protected with appropriate measures both in transit and at rest.
      - id: '4.3'
        text: >-
          Where encryption cannot be applied, this is recorded as a risk and other measures are designed
          and implemented to reach the required security level.
      - id: '4.4'
        text: >-
          Processes and policies have been designed to comply with legal and regulatory requirements on
          personal data protection.
      - id: '4.5'
        text: >-
          Risk management has been adapted to identify, assess and evaluate risks of varying likelihood
          and severity to the rights and freedoms of individuals arising from the organisation's processing
          of their data.
      - id: '4.6'
        text: >-
          Appropriate technical and organisational measures are implemented according to the risk assessment
          results. For data erasure, a documented secure erasure procedure sets out roles, responsibilities,
          methods, criteria and tools for each classification level under [DS2].
      - id: '4.7'
        text: >-
          The procedure also covers the measures applied when assets are moved to external parties (e.g.
          at the end of a lease or for repair).
      - id: '4.8'
        text: >-
          Where a third party performs erasure or destruction, the contract contains provisions ensuring
          the rules are applied correctly and effectively.
      - id: '4.9'
        na: cloud
        text: >-
          Where data is stored with third parties (e.g. cloud services), the third party gives specific
          commitments and evidence that these arrangements are implemented; otherwise compensating measures
          are taken.
      - id: '4.10'
        text: Automated or semi-automated means enforce the data retention period.
      5:
      - id: '5.1'
        text: An automated data loss prevention (DLP) system is in place.
      - id: '5.2'
        text: >-
          It is configured according to the information classification scheme and the handling instructions
          [DS2].
      - id: '5.3'
        text: >-
          Every new medium or asset is encrypted automatically where possible, before or when it enters
          the organisation.
      - id: '5.4'
        text: Where data is erased by software, additional physical measures are used (e.g. degaussing).
      - id: '5.5'
        text: >-
          Where a third party performs erasure or destruction, it is done on the organisation's premises
          to avoid transport risks; if this is not feasible, specific measures mitigate the risk (e.g.
          locked containers, live feed, staff presence).
      - id: '5.6'
        text: Automated measures enforce the data retention period.
      - id: '5.7'
        text: The audits referred to in [GOV2] include checks on compliance with retention periods.
      - id: '5.8'
        common: K1
        text: >-
          The skills, capabilities and knowledge that the authorised roles need to run this process have
          been identified.
      - id: '5.9'
        common: K2
        text: >-
          The organisation ensures that the responsible staff already have this knowledge, or otherwise
          arranges for them to acquire it.
  - id: DS2
    title: Information classification and labelling
    objective: >-
      Ensure data is classified and labelled to reflect its sensitivity, so that it is processed appropriately.
    description: >-
      Establish, apply and maintain a classification and labelling policy that classifies and labels information
      according to its confidentiality and sensitivity. Consider schemes based on international and industry
      best practice, such as the Traffic Light Protocol. At a minimum, distinguish public, private and
      classified information.
    source: CIS (1.3 Data protection), ENISA (SO 23 – Security of data at rest), NIST 800-53 (MP-3)
    page: 50
    level0: >-
      The organisation has no process or other means of classifying and labelling its information.
    levels:
      1:
      - id: '1.1'
        text: Some data is recognised as more critical or sensitive and is recorded, at least ad hoc.
      2:
      - id: '2.1'
        text: >-
          At least 2 categories of information (internal and public) have been identified, and at least
          one of them is labelled.
      - id: '2.2'
        text: >-
          Information is handled according to written instructions that set out handling rules and restrictions
          throughout the lifecycle, from creation or collection to destruction.
      3:
      - id: '3.1'
        text: >-
          A classification and labelling policy that classifies and labels information according to its
          confidentiality and sensitivity has been established, is applied and is maintained.
      - id: '3.2'
        text: >-
          The policy requires at least the distinction between Public, Private and Classified information.
      - id: '3.3'
        text: >-
          Information is handled according to written instructions that set out handling rules and restrictions
          throughout the lifecycle, as described in [DS1].
      4:
      - id: '4.1'
        text: >-
          A documented classification and labelling procedure describes how information is classified
          and labelled.
      - id: '4.2'
        text: >-
          An automated means (e.g. software) labels and manages information according to the scheme in
          use.
      - id: '4.3'
        common: R1
        text: >-
          The related documents are reviewed for suitability at least once a year. Any changes follow
          the change management process.
      5:
      - id: '5.1'
        text: >-
          When a document or item of information enters the organisation, its owner is identified and
          it is classified and labelled using suitable tools; information created by the organisation
          is likewise classified and labelled at creation.
      - id: '5.2'
        common: K1
        text: >-
          The skills, capabilities and knowledge that the authorised roles need to run this process have
          been identified.
      - id: '5.3'
        common: K2
        text: >-
          The organisation ensures that the responsible staff already have this knowledge, or otherwise
          arranges for them to acquire it.
      - id: '5.4'
        text: Compliance with classification and labelling requirements is audited.
  - id: DS3
    title: Backup and data recovery
    objective: Make it possible to restore information after security events and incidents.
    description: >-
      Establish, apply and maintain a backup and data recovery process to ensure timely and effective
      restoration of data after an event or incident, or on request. Backup and recovery should be tested
      adequately and often. Backup and recovery systems and infrastructure should be geographically dispersed
      (off-site storage) to protect against physical risks.
    page: 51
    level0: The organisation takes no backups in any form.
    levels:
      1:
      - id: '1.1'
        text: >-
          Backups are taken for some information, at least ad hoc and not necessarily in a defined or
          documented way.
      2:
      - id: '2.1'
        text: Backups cover the whole inventory of assets, systems and processes.
      - id: '2.2'
        text: A named person is responsible for operating and keeping the backups.
      3:
      - id: '3.1'
        text: >-
          A backup and data recovery process has been established, is applied and is maintained to ensure
          timely and effective restoration after an event or incident, or on request.
      - id: '3.2'
        text: >-
          Backup and recovery procedures are tested adequately and often, to ensure all supporting processes
          and systems work correctly and reliably.
      - id: '3.3'
        text: >-
          Backup and recovery systems and infrastructure are geographically dispersed (off-site storage)
          to protect against physical risks.
      - id: '3.4'
        text: Backups capture all information, or its changes, at least daily.
      4:
      - id: '4.1'
        text: >-
          The backup and recovery process is supported by suitable software, licensed where required.
      - id: '4.2'
        text: Backup files are encrypted using algorithms as required by [AM1].
      - id: '4.3'
        text: >-
          Provision is made to access and recover data from backups as required (e.g. the backup software
          can be obtained, installed or used, and the keys are available).
      - id: '4.4'
        common: R1
        text: >-
          The related documents are reviewed for suitability at least once a year. Any changes follow
          the change management process.
      - id: '4.5'
        text: Backups of at least critical systems are taken every 8 hours.
      - id: '4.6'
        text: A daily, weekly, monthly and yearly backup retention scheme exists.
      5:
      - id: '5.1'
        text: >-
          Critical systems, as identified by the business impact analysis and the business continuity
          and disaster recovery plans, are replicated to an alternate site.
      - id: '5.2'
        text: >-
          At least once a year a full functional test checks replication status and the organisation's
          ability to operate from the alternate site.
      - id: '5.3'
        text: >-
          Separate backups are also kept at a third secure location, to protect against cyber extortion
          (ransomware) attacks.
      - id: '5.4'
        text: >-
          The frequency of these backups is appropriate to the organisation's context, objectives and
          strategy.
      - id: '5.5'
        common: K1
        text: >-
          The skills, capabilities and knowledge that the authorised roles need to run this process have
          been identified.
      - id: '5.6'
        common: K2
        text: >-
          The organisation ensures that the responsible staff already have this knowledge, or otherwise
          arranges for them to acquire it.
  - id: DS4
    title: Information transfer and exchange
    objective: >-
      Apply adequate measures when transmitting and exchanging information internally or with third parties,
      to ensure secure data transfer.
    description: >-
      Establish, apply and maintain information transfer and exchange procedures that protect information
      transferred or exchanged internally or with third parties, taking into account the regulatory and
      legal requirements in [GOV2], for example for international data transfers.
    source: C2M2 (Architecture), ISO 27001, OWASP API, OWASP ASVS
    page: 52
    level0: >-
      The organisation has no process or other means of identifying and applying measures to protect data
      in transfer or exchange.
    levels:
      1:
      - id: '1.1'
        text: Some measures protect data in exchange or transfer at specific points.
      2:
      - id: '2.1'
        text: >-
          At least 2 categories of information (internal and public) have been identified, and at least
          one of them is labelled.
      - id: '2.2'
        text: >-
          All ways in which internal information can be exchanged have been identified and documented
          in written instructions.
      - id: '2.3'
        text: >-
          Where third parties are given access to this information, only parties that can provide appropriate
          assurances and guarantees for protecting the data throughout its lifecycle are used.
      - id: '2.4'
        text: The written handling instructions are communicated to the third party so that it complies.
      - id: '2.5'
        text: >-
          Where compliance is not possible, the organisation identifies the risk and introduces appropriate
          compensating measures.
      3:
      - id: '3.1'
        text: >-
          Information transfer and exchange procedures have been established, are applied and are maintained
          to protect information transferred or exchanged internally or with third parties.
      - id: '3.2'
        text: >-
          Information transfer and exchange takes into account the regulatory and legal requirements in
          [GOV2], for example for international data transfers.
      - id: '3.3'
        text: >-
          Critical or sensitive data is encrypted in exchange or transfer, for example with Transport
          Layer Security (TLS) or OpenSSH.
      - id: '3.4'
        text: Data transported on physical media is suitably encrypted before it is sent.
      - id: '3.5'
        text: Encryption keys are sent separately, by another channel, without indicating their purpose.
      - id: '3.6'
        text: Online transfers use the latest stable versions of protocols such as SFTP or HTTPS.
      4:
      - id: '4.1'
        text: Mechanisms ensure the integrity and authenticity of the information exchanged.
      - id: '4.2'
        text: Relevant information is exchanged using digital signatures.
      - id: '4.3'
        text: >-
          A register is kept of critical or sensitive information exchanged, recording the measures applied
          and the assurances from the parties involved.
      - id: '4.4'
        text: >-
          Temporary storage locations are checked at the predefined time and the information is securely
          deleted.
      - id: '4.5'
        common: R1
        text: >-
          The related documents are reviewed for suitability at least once a year. Any changes follow
          the change management process.
      - id: '4.6'
        text: Sensitive personal data is additionally protected with data masking where applicable.
      - id: '4.7'
        text: >-
          Information exchange through APIs is designed, configured, implemented and operated to match
          the organisation's security level.
      - id: '4.8'
        text: International best practice (e.g. OWASP API Security Top 10) is applied.
      - id: '4.9'
        text: >-
          Data confidentiality is ensured by channel-level or data-level encryption when data crosses
          different networks, even within the organisation.
      5:
      - id: '5.1'
        text: An automated data loss prevention system (e.g. host-based DLP) is in place.
      - id: '5.2'
        text: >-
          It is configured according to the information classification scheme and the handling instructions
          [DS2].
      - id: '5.3'
        text: >-
          The system covers all information processed or exchanged by the organisation, including information
          held by third parties.
      - id: '5.4'
        common: K1
        text: >-
          The skills, capabilities and knowledge that the authorised roles need to run this process have
          been identified.
      - id: '5.5'
        common: K2
        text: >-
          The organisation ensures that the responsible staff already have this knowledge, or otherwise
          arranges for them to acquire it.
      - id: '5.6'
        text: Regular checks monitor whether staff apply and comply with the procedures.
      - id: '5.7'
        text: >-
          Equivalent technical checks are carried out (e.g. penetration tests), and for software and APIs,
          security assessments based on international best practice (e.g. OWASP ASVS).
      - id: '5.8'
        text: Any deviation found immediately triggers the security incident response process [EIM1].
  - id: DS5
    title: Data loss and data leakage prevention
    objective: Protect data from intentional or unintentional loss and leakage.
    description: >-
      Establish, apply and maintain reasonable technical and organisational measures to reduce the risk
      of data loss and leakage, considering external and internal threat actors who could disclose classified
      or sensitive information. Apply adequate access controls around data loss prevention measures. Data
      sharing policies should be role-based [IAM1]. Consider classification, protection and monitoring
      of information when defining the measures.
    page: 53
    level0: >-
      The organisation has no process or measures to protect data from intentional or unintentional loss
      and leakage.
    levels:
      1:
      - id: '1.1'
        text: >-
          Some measures protect data from intentional or unintentional loss and leakage at specific points.
      2:
      - id: '2.1'
        text: >-
          An access control policy for all data in the inventory has been established, is applied and
          is maintained, in line with [IAM1].
      - id: '2.2'
        text: >-
          For each information level under [DS2], measures have been chosen to protect against leakage
          through removable storage media [DS1] and through sending information [DS4].
      - id: '2.3'
        text: Network protection measures follow [NS1].
      3:
      - id: '3.1'
        text: >-
          Reasonable technical and organisational measures to reduce the risk of data loss and leakage
          have been established, are applied and are maintained.
      - id: '3.2'
        text: >-
          The measures take into account external and internal threat actors who could disclose classified
          or sensitive information.
      - id: '3.3'
        text: Adequate access controls are applied around the data loss and leakage prevention measures.
      - id: '3.4'
        text: Data exchange and sharing policies are role-based, as defined in [IAM1].
      - id: '3.5'
        text: >-
          The organisation considers classification, protection and monitoring of information when defining
          the measures.
      - id: '3.6'
        text: Staff are trained on attack methods (e.g. phishing) that can lead to data loss.
      4:
      - id: '4.1'
        text: Access to known data transfer services and to non-corporate messaging systems is blocked.
      - id: '4.2'
        text: >-
          Copying data to USB is blocked. Where a full block is not possible, exceptions are managed with
          organisational and technical measures that control the type of information, the justification,
          the authorisation and appropriate encryption.
      - id: '4.3'
        common: R1
        text: >-
          The related documents are reviewed for suitability at least once a year. Any changes follow
          the change management process.
      5:
      - id: '5.1'
        text: An automated data loss prevention system (e.g. host-based DLP) is in place.
      - id: '5.2'
        text: >-
          It is configured according to the information classification scheme and the handling instructions
          [DS2].
      - id: '5.3'
        text: >-
          The system covers all information processed or exchanged by the organisation, including information
          held by third parties.
      - id: '5.4'
        text: >-
          Anomalies in normal traffic patterns are recorded and handled through the security incident
          management process [EIM1].
      - id: '5.5'
        common: K1
        text: >-
          The skills, capabilities and knowledge that the authorised roles need to run this process have
          been identified.
      - id: '5.6'
        common: K2
        text: >-
          The organisation ensures that the responsible staff already have this knowledge, or otherwise
          arranges for them to acquire it.
- id: CM
  title: Change management
  measures:
  - id: CM1
    title: Change management
    objective: >-
      Ensure changes to information processes and systems are made securely, without affecting the confidentiality,
      integrity, availability or authenticity of information.
    description: >-
      Establish, apply and maintain change management procedures to control changes to systems, applications
      and other supporting assets. The process should handle change requests from stakeholders, assess
      the risks of each change, plan changes with appropriate security measures, and include preparation
      and verification of changes.
    page: 55
    level0: The organisation does not manage or control changes.
    levels:
      1:
      - id: '1.1'
        text: The organisation controls some changes made to critical systems.
      - id: '1.2'
        text: Records are at least occasional and may be managed at least ad hoc.
      2:
      - id: '2.1'
        text: A process exists for managing changes to critical systems.
      - id: '2.2'
        text: >-
          The change management process is documented and identifies the roles responsible for approving
          changes.
      3:
      - id: '3.1'
        text: >-
          A change management process to control changes to systems, applications and other supporting
          assets has been established, is applied and is maintained.
      - id: '3.2'
        text: >-
          The process provides for change requests, so that changes requested by stakeholders are considered.
      - id: '3.3'
        text: >-
          The process allows the organisation to assess the risks of change requests and plan changes
          with appropriate security measures.
      - id: '3.4'
        text: >-
          For critical systems, every change is first installed on a test or similar low-risk system.
      - id: '3.5'
        text: The process includes preparation and verification of changes.
      - id: '3.6'
        text: The process is run in a way that makes changes traceable.
      - id: '3.7'
        text: >-
          Risk-based change categories exist, each with defined steps and approvals (classification into
          criticality and priority, justification, analysis, testing, rollback and confirmation steps
          before production, roles involved in design, review, implementation and approval, and records
          kept).
      - id: '3.8'
        text: The process includes provisions for handling emergency changes.
      - id: '3.9'
        text: Everyone involved is informed of the details of each change.
      - id: '3.10'
        text: >-
          The process includes a rollback plan for when a change fails or an event prevents its successful
          completion.
      - id: '3.11'
        text: >-
          Third parties are informed of significant changes to critical systems that affect the services
          they receive.
      4:
      - id: '4.1'
        text: >-
          A change advisory board reviews and approves changes, with no conflict of interest between those
          who request, implement and approve a change.
      - id: '4.2'
        text: >-
          The change process is tested to confirm that changes to critical systems always follow the predefined
          way.
      - id: '4.3'
        text: >-
          Particular attention is paid to changes in production, especially when moving a system from
          development to operation.
      - id: '4.4'
        text: >-
          Changes to systems are reviewed regularly, starting both from the system and from the change
          documentation, to check that the process is followed.
      - id: '4.5'
        text: >-
          The change process takes input from all the organisation's functions, as referred to in various
          controls of this framework.
      - id: '4.6'
        text: The change process is directly linked to the configuration management process in [CM2].
      5:
      - id: '5.1'
        text: >-
          An automated change management system links each change to the affected item, creates change
          requests, routes them on a set schedule, takes the change risk analysis (including security
          risks) as input, categorises changes, selects the approval workflow by risk and priority, records
          approvals, holds the implementation, communication, review and testing actions, the rollback
          plan and other relevant information.
      - id: '5.2'
        common: K1
        text: >-
          The skills, capabilities and knowledge that the authorised roles need to run this process have
          been identified.
      - id: '5.3'
        common: K2
        text: >-
          The organisation ensures that the responsible staff already have this knowledge, or otherwise
          arranges for them to acquire it.
  - id: CM2
    title: Configuration management
    objective: >-
      Identify, maintain and verify information on the organisation's assets and their configurations.
    description: >-
      Establish, apply and maintain configuration management procedures for the assets supporting networks
      and information systems. Keep a register of the configurations in force, and define and record the
      relationships between asset configurations to identify interdependencies and manage configuration
      changes properly.
    source: PNNL, NIST 800-53, ENISA
    page: 56
    level0: The organisation does not manage the configuration of its assets in any way.
    levels:
      1:
      - id: '1.1'
        text: >-
          Critical systems are configured, and a copy of the configuration is usually taken before major
          changes.
      2:
      - id: '2.1'
        text: >-
          A documented process for managing changes to critical systems exists, with identified roles
          responsible for approving changes.
      - id: '2.2'
        text: >-
          Configuration changes to critical systems (e.g. changes to core firewall rules) are recorded
          as part of change management.
      3:
      - id: '3.1'
        text: >-
          Configuration management procedures to control the configurations of assets supporting networks
          and information systems have been established, are applied and are maintained.
      - id: '3.2'
        text: >-
          Relationships between asset configurations are defined and recorded to identify interdependencies
          and manage configuration changes properly.
      - id: '3.3'
        text: >-
          A register of the configurations in force for these assets is kept. Configuration means all
          parameters in hardware, software or firmware that can be changed and can affect a system's security
          or functionality.
      - id: '3.4'
        text: >-
          The register contains at least: registry settings, permission settings on files, folders and
          other resources, settings for open ports, enabled or disabled services and protocols, and allowed
          or blocked connections.
      - id: '3.5'
        text: >-
          For every change that can affect the baseline configuration, the item being changed is always
          identified.
      - id: '3.6'
        text: >-
          As a basic step, the item's configuration is backed up and stored in a protected location, linked
          to the specific change.
      - id: '3.7'
        text: Secure configurations follow the specifications in [SS3].
      4:
      - id: '4.1'
        text: >-
          Internal and/or external inspections check the completeness and integrity of asset configurations.
      - id: '4.2'
        text: >-
          Audits trace changes starting from the change documentation, to confirm that a configuration
          record exists for each change, and compare current configurations with the stored records.
      - id: '4.3'
        text: The procedures set how long configuration history is kept.
      - id: '4.4'
        text: >-
          Configurations are protected at the highest classification level in [DS2], with strict access
          control.
      - id: '4.5'
        text: >-
          Input from security incidents and from notices of weaknesses and improvements feeds the configuration
          management process and triggers changes.
      - id: '4.6'
        text: A process exists for granting exceptions from specific secure baselines.
      - id: '4.7'
        text: >-
          System configuration management tools enforce and refresh settings automatically on a schedule
          or after an incident or event (e.g. Active Directory Group Policy Objects for Windows, Puppet
          for UNIX).
      - id: '4.8'
        text: >-
          Changes to these baselines go through change management [CM1] (e.g. for updates and patches,
          or setting changes based on incidents or information from other trusted parties).
      - id: '4.9'
        text: When an item has a problem, it is replaced with a clean build from the baseline.
      - id: '4.10'
        text: >-
          Every item on the organisation's network is uniquely identifiable and listed in the asset inventory
          in [DS1/RM2].
      - id: '4.11'
        text: >-
          Equivalent procedures and instructions exist for other kinds of software, such as applications
          and databases.
      - id: '4.12'
        text: Configuration files are backed up according to the backup policy.
      - id: '4.13'
        common: R1
        text: >-
          The related documents are reviewed for suitability at least once a year. Any changes follow
          the change management process.
      5:
      - id: '5.1'
        text: Automated tools verify the baseline configurations of assets to detect changes.
      - id: '5.2'
        text: >-
          Detected changes are recorded, the network and information security officer is notified, and
          the security incident management process is triggered.
      - id: '5.3'
        text: Previous baselines are kept for history and rollback if needed.
      - id: '5.4'
        text: Baselines are also kept for development and test systems, separate from production ones.
      - id: '5.5'
        text: >-
          The resilience of baselines is checked and tested; weaknesses found are fixed promptly through
          change management.
      - id: '5.6'
        text: >-
          Devices connecting remotely are checked remotely for their configuration, installed software
          and patch level.
      - id: '5.7'
        text: >-
          For third-party devices connecting to the systems, the organisation has communicated the minimum
          acceptable security level and runs security checks before access is granted.
      - id: '5.8'
        common: K1
        text: >-
          The skills, capabilities and knowledge that the authorised roles need to run this process have
          been identified.
      - id: '5.9'
        common: K2
        text: >-
          The organisation ensures that the responsible staff already have this knowledge, or otherwise
          arranges for them to acquire it.
- id: AM
  title: Asset management
  measures:
  - id: AM1
    title: Asset lifecycle management
    objective: >-
      Ensure assets are secure throughout their lifecycle, including procurement, deployment, maintenance
      and disposal.
    description: >-
      Establish, apply and maintain information security measures within the asset lifecycle management
      plan, so that security is an integral part of procurement, installation, maintenance and disposal.
      Information lifecycle management [DS1] is part of this plan, which describes all procedures for
      handling information according to the classification and labelling policy [DS2].
    page: 58
    level0: The organisation has no structured way of managing its assets throughout their lifecycle.
    levels:
      1:
      - id: '1.1'
        text: >-
          Asset acquisition and removal are carried out at least ad hoc, based on the knowledge of the
          staff involved.
      2:
      - id: '2.1'
        text: A documented procedure describes how assets are managed throughout their lifecycle.
      - id: '2.2'
        text: >-
          The procedure includes actions by authorised roles for procurement, installation, maintenance
          and disposal.
      - id: '2.3'
        text: >-
          Related roles and responsibilities are assigned to staff. Changes to assets are made at least
          ad hoc, and at least basic documented information is kept.
      3:
      - id: '3.1'
        text: >-
          The procedure includes information security elements, so that security is an integral part of
          procurement, installation, maintenance and disposal.
      - id: '3.2'
        text: >-
          Information lifecycle management, as described in [DS1], is part of the asset lifecycle management
          plan.
      - id: '3.3'
        text: >-
          The asset lifecycle procedure describes all sub-procedures for handling information according
          to the classification and labelling policy [DS2].
      - id: '3.4'
        text: Changes to assets follow the change management process [CM1].
      - id: '3.5'
        text: The plan describes the criteria used to assign assets to criticality categories.
      - id: '3.6'
        text: Security specifications suited to the asset's intended use are defined before procurement.
      4:
      - id: '4.1'
        text: Minimum maintenance procedures are defined per asset category and criticality category.
      - id: '4.2'
        text: >-
          At least once a year a check confirms whether the asset lifecycle plan is applied correctly
          and effectively, and whether there are enough resources (people, equipment, tools, money) to
          run it effectively.
      - id: '4.3'
        text: Any deviation found is recorded immediately and corrective actions are scheduled.
      - id: '4.4'
        text: >-
          Asset criticality categories are used and are consistent with those used in risk management.
      - id: '4.5'
        common: R1
        text: >-
          The related documents are reviewed for suitability at least once a year. Any changes follow
          the change management process.
      - id: '4.6'
        text: Data is securely destroyed before equipment is reused or at the end of its life.
      5:
      - id: '5.1'
        text: >-
          Equipment components able to retain data are physically destroyed at end of life, as provided
          in [DS1].
      - id: '5.2'
        common: K1
        text: >-
          The skills, capabilities and knowledge that the authorised roles need to run this process have
          been identified.
      - id: '5.3'
        common: K2
        text: >-
          The organisation ensures that the responsible staff already have this knowledge, or otherwise
          arranges for them to acquire it.
  - id: AM2
    title: Asset inventory and ownership
    objective: >-
      Ensure assets are recorded in an inventory and their ownership is defined, for traceability and
      accountability.
    description: >-
      Establish, apply and maintain an asset inventory so the organisation has a clear, accurate and current
      view of the assets it holds (e.g. hardware, software, information). The inventory identifies each
      asset's owner and lets the organisation track all assets for which it must apply and maintain information
      security measures.
    page: 59
    level0: The organisation has no specific or organised way of identifying its assets.
    levels:
      1:
      - id: '1.1'
        text: Assets are recorded at least ad hoc.
      - id: '1.2'
        text: A record is kept, centrally managed or not, and updated at least ad hoc.
      2:
      - id: '2.1'
        text: An asset inventory is kept.
      - id: '2.2'
        text: The inventory has an identified owner responsible for keeping and updating its data.
      3:
      - id: '3.1'
        text: >-
          An asset inventory has been established, is applied and is maintained, giving a clear, accurate
          and current view of the assets held (e.g. hardware, software, information).
      - id: '3.2'
        text: The inventory identifies the owner of each asset.
      - id: '3.3'
        text: >-
          The inventory lets the organisation track all assets for which it applies and maintains information
          security measures, at least manually.
      - id: '3.4'
        text: >-
          The inventory includes each asset's function or use and location, so that it is a complete register.
      4:
      - id: '4.1'
        text: >-
          An automated system identifies and records assets and systems both inside the organisation and
          outside it (hosted by third parties).
      - id: '4.2'
        text: >-
          Data from the automated system is supplemented with process information, and dependencies and
          interdependencies are mapped as automatically as possible.
      - id: '4.3'
        common: R1
        text: >-
          The related documents are reviewed for suitability at least once a year. Any changes follow
          the change management process.
      - id: '4.4'
        text: >-
          A list of unauthorised applications and executable file types exists, and their execution on
          the organisation's assets is blocked (application blacklisting).
      5:
      - id: '5.1'
        text: >-
          An automated system and processes check the integrity and validity of the asset, system and
          process inventory.
      - id: '5.2'
        text: >-
          When an item not in the inventory is detected, the responsible staff are notified automatically
          to check and update the data.
      - id: '5.3'
        text: >-
          For assets in particular, immediate containment actions are taken until the investigation is
          complete.
      - id: '5.4'
        common: K1
        text: >-
          The skills, capabilities and knowledge that the authorised roles need to run this process have
          been identified.
      - id: '5.5'
        common: K2
        text: >-
          The organisation ensures that the responsible staff already have this knowledge, or otherwise
          arranges for them to acquire it.
  - id: AM3
    title: Asset monitoring
    objective: >-
      Ensure assets are monitored for attacks, anomalies and security threats, so that event and incident
      handling procedures are triggered.
    description: >-
      Establish, apply and maintain asset monitoring capabilities so the organisation can detect anomalies
      against normal conditions (e.g. location, use) or in asset operation. The acceptable use policy
      [HRS6] states what acceptable use and operation of assets is. The asset inventory [AM2] may also
      describe acceptable use, function and location. When anomalies are detected, event and incident
      management procedures are triggered.
    source: C2M2 (Situation), PNNL, NIST 800-53, ISO 27001
    page: 60
    level0: The organisation does not monitor its assets.
    levels:
      1:
      - id: '1.1'
        text: At least some assets are monitored; monitoring may not be complete or systematic.
      2:
      - id: '2.1'
        text: Monitoring is enabled for critical assets listed in the inventory [AM2 / RM2].
      - id: '2.2'
        text: >-
          Monitoring covers at least: actions of people, objects and entities accessing or using assets;
          events that could disrupt normal operation; asset changes that deviate from the security baseline;
          unexpected assets connecting to the organisation's networks; and any other suspicious activity.
      3:
      - id: '3.1'
        text: >-
          Asset monitoring capabilities have been established, are applied and are maintained, so the
          organisation can detect anomalies against normal conditions (e.g. location, use) or in asset
          operation.
      - id: '3.2'
        text: The acceptable use policy [HRS6] states what acceptable use and operation of assets is.
      - id: '3.3'
        text: >-
          The description of acceptable use, function and location of assets is included in the asset
          inventory [AM2], so that it is a complete register.
      - id: '3.4'
        text: >-
          When anomalies are detected, event and incident management procedures are triggered so that
          the organisation stays resilient.
      - id: '3.5'
        text: >-
          Monitoring records (logs) contain at least: date, time, source and destination address (where
          applicable), record type, and any additional explanatory information.
      - id: '3.6'
        text: >-
          For each asset, the organisation has defined the type of logging enabled (e.g. system, security,
          application), the event scope (e.g. audit success, audit failure, login success, object access,
          warning), the retention period (e.g. 3 months) and the storage location (e.g. on the device,
          a syslog server, other storage), based on its context, its information security strategy and
          objectives [STR1] and the applicable legal and regulatory framework.
      4:
      - id: '4.1'
        text: >-
          An analysis has determined the storage and computing capacity needed to store and manage monitoring
          data for each system without problems.
      - id: '4.2'
        text: >-
          Monitoring data is reviewed daily, manually or semi-automatically, to identify possible anomalies,
          trends, imminent or actual attacks.
      - id: '4.3'
        text: >-
          At least two time synchronisation sources are defined so that monitoring data is correctly timestamped.
      - id: '4.4'
        text: >-
          Time synchronisation covers all critical assets (at least all servers and network equipment).
      - id: '4.5'
        text: Monitoring data is checked to confirm it contains the elements required at level 3.
      - id: '4.6'
        text: >-
          The status of assets is monitored through appropriate technical measures, as required by [AM6].
      - id: '4.7'
        text: >-
          If monitoring fails, the asset is taken out of service until the cause is fully investigated
          (not applicable to assets directly involved in security management).
      - id: '4.8'
        common: R1
        text: >-
          The related documents are reviewed for suitability at least once a year. Any changes follow
          the change management process.
      5:
      - id: '5.1'
        text: A SIEM collects monitoring data from all of the organisation's assets.
      - id: '5.2'
        text: >-
          Rules are configured and notifications and alerts are sent to the appropriate staff when a rule
          fires.
      - id: '5.3'
        text: >-
          Rules take common attack methods into account. At least, they alert when: 1) an account is added
          to a privileged group, an existing account's rights are elevated, or a new privileged account
          is created; 2) the password or other secret of a privileged account is changed; 3) a login comes
          from a location not allowed by the organisation's rules; 4) several (e.g. >3) failed logins
          come from the same source in a short time; 5) the same account fails to log in on different
          machines; 6) a network scan is performed; 7) a DHCP server appears on the network; 8) an attack
          matching the OWASP Top 10 is detected; 9) the organisation's IPS/IDS raise alerts; 10) the DLP
          raises alerts; 11) any log record is changed, including deletion or disabling of logging.
      - id: '5.4'
        text: >-
          Log storage is protected and write-only. Where that is not feasible, separate machines with
          strictly defined access are used, as required by [IAM2].
      - id: '5.5'
        common: K1
        text: >-
          The skills, capabilities and knowledge that the authorised roles need to run this process have
          been identified.
      - id: '5.6'
        common: K2
        text: >-
          The organisation ensures that the responsible staff already have this knowledge, or otherwise
          arranges for them to acquire it.
  - id: AM4
    title: Availability management
    objective: >-
      Ensure the availability of networks and information systems through sufficient resource availability,
      redundancy and high-availability systems and processes.
    description: >-
      Establish, apply and maintain availability management procedures so the organisation delivers the
      required level of service. Resources (premises, staff, IT systems, etc.) must be available at all
      times. As described in [NS6], the organisation guarantees redundancy and high availability of all
      IT systems so that data can be recovered promptly and effectively after an event or incident, or
      on request, and backs up information as described in [DS3].
    page: 61
    level0: >-
      The organisation has taken no measures to ensure the availability of networks and IT systems.
    levels:
      1:
      - id: '1.1'
        text: Some spare equipment exists that can be used if an asset fails.
      2:
      - id: '2.1'
        text: Critical assets have been identified.
      - id: '2.2'
        text: For each of them there is at least one spare (identical or of equivalent capability).
      - id: '2.3'
        text: These assets are listed in the asset inventory.
      3:
      - id: '3.1'
        text: >-
          Availability management procedures have been established, are applied and are maintained to
          deliver the required level of service.
      - id: '3.2'
        text: Resources (premises, staff, IT systems, etc.) are available at all times.
      - id: '3.3'
        text: >-
          As described in [NS6], the organisation guarantees redundancy and high availability of all IT
          systems, so that data can be recovered promptly and effectively after an event or incident,
          or on request.
      - id: '3.4'
        text: Information is backed up as described in [DS3].
      - id: '3.5'
        text: At least power, capacity, network and connectivity are redundant.
      - id: '3.6'
        text: No critical equipment lacks an active or standby spare on the same premises.
      - id: '3.7'
        text: >-
          Equipment at a secondary site has been planned so that core activities can be recovered within
          a defined time and to a defined level.
      4:
      - id: '4.1'
        text: >-
          Asset status is monitored continuously through technical measures (whether assets at both primary
          and backup sites respond and are in good working order).
      - id: '4.2'
        text: >-
          When a system is detected as unavailable (alert), the appropriate staff are notified to investigate
          and switch manually to the backup system if needed.
      - id: '4.3'
        text: >-
          Provision is made to access and recover data from backups as required (e.g. backup software
          can be obtained, installed or used, and the keys are available), as required by [DS3].
      - id: '4.4'
        common: R1
        text: >-
          The related documents are reviewed for suitability at least once a year. Any changes follow
          the change management process.
      5:
      - id: '5.1'
        text: >-
          Critical systems, as identified by the business impact analysis and the business continuity
          and disaster recovery plans, are replicated to an alternate site.
      - id: '5.2'
        text: >-
          If primary equipment fails or becomes unavailable, the secondary is activated automatically.
      - id: '5.3'
        text: >-
          At least once a year a full functional test checks replication status and the organisation's
          ability to operate from the alternate site.
      - id: '5.4'
        text: >-
          Separate backups are also kept at a third secure location, to protect against cyber extortion,
          as required by [DS3].
      - id: '5.5'
        common: K1
        text: >-
          The skills, capabilities and knowledge that the authorised roles need to run this process have
          been identified.
      - id: '5.6'
        common: K2
        text: >-
          The organisation ensures that the responsible staff already have this knowledge, or otherwise
          arranges for them to acquire it.
  - id: AM5
    title: Cryptography
    objective: >-
      Ensure the confidentiality, integrity and authenticity of information by adopting appropriate cryptographic
      solutions.
    description: >-
      Establish, apply and maintain a policy on cryptographic measures to protect data at rest, in use
      and in transit. The policy covers all stages of the information lifecycle and considers applications,
      systems, network equipment and communication channels.
    source: CSA CCM v4., ANSII guidelines, NIST 800-53, NIST 800-57, CIS
    page: 62
    level0: The organisation does not use cryptography in any form.
    levels:
      1:
      - id: '1.1'
        text: Cryptographic solutions are used for some assets, at least ad hoc.
      2:
      - id: '2.1'
        text: Data, or whole devices, identified as critical in the asset inventory are encrypted.
      - id: '2.2'
        text: Removable media, where used, and endpoint devices are also encrypted.
      3:
      - id: '3.1'
        text: >-
          A policy on the use of cryptographic measures to protect the confidentiality, integrity and
          authenticity of data at rest, in use and in transit has been established, is applied and is
          maintained.
      - id: '3.2'
        text: >-
          The policy covers all stages of the information lifecycle and considers applications, systems,
          network equipment and communication channels.
      - id: '3.3'
        text: >-
          At least the following are used: SHA-256, SHA-512 or SHA-384 as hash functions; HMAC with SHA-256;
          bcrypt, scrypt or PBKDF2 for password storage; AES or AES-CBC for symmetric encryption; RSA-OAEP
          (PKCS#1 v2.1) for asymmetric encryption and RSA-SSA-PSS (PKCS#1 v2.1) for signatures.
      - id: '3.4'
        text: >-
          Appropriate keys are always used: AES keys of at least 128 bits; for RSA-based algorithms, moduli
          and secret exponents of at least 2048 or 3072 bits, with public exponents for encryption greater
          than 65536.
      - id: '3.5'
        text: Data in transit and at rest is protected as required by [DS2] and [DS4].
      4:
      - id: '4.1'
        text: Software and cryptographic libraries used have been reviewed by reputable third parties.
      - id: '4.2'
        text: >-
          Certified solutions are used where available, e.g. VeraCrypt for encrypted containers and GNU
          Privacy Guard for asymmetric cryptography.
      - id: '4.3'
        text: No Wi-Fi-enabled equipment is configured to receive or share encryption keys.
      - id: '4.4'
        text: >-
          Encryption keys are protected as information of the highest classification level in [DS2], under
          strict access control.
      - id: '4.5'
        common: R1
        text: >-
          The related documents are reviewed for suitability at least once a year. Any changes follow
          the change management process.
      5:
      - id: '5.1'
        text: An automated system monitors and manages certificates and other cryptographic material.
      - id: '5.2'
        text: >-
          Where the organisation manages (including issues) cryptographic keys, a key management system
          supports generation, single use, rotation, revocation, destruction, activation, deactivation
          and archiving of keys.
      - id: '5.3'
        text: Immediate response procedures exist for a compromised or leaked key, to contain the risk.
      - id: '5.4'
        text: >-
          International best practice for on-premises and cloud systems in the CSA CCM v4.0 Cryptography,
          Encryption and Key Management (CEK) domain is applied.
      - id: '5.5'
        common: K1
        text: >-
          The skills, capabilities and knowledge that the authorised roles need to run this process have
          been identified.
      - id: '5.6'
        common: K2
        text: >-
          The organisation ensures that the responsible staff already have this knowledge, or otherwise
          arranges for them to acquire it.
  - id: AM6
    title: Capacity management
    objective: >-
      Ensure appropriate capacity and performance of information systems, services and processes.
    description: >-
      Establish, apply and maintain a capacity management process so that the capacity and performance
      of IT systems are not harmed by increased demand. It should include business capacity management
      (turning business needs into capacity requirements), service capacity management (managing the capacity
      of IT subsystems) and capacity reporting.
    page: 63
    level0: The organisation does not manage the capacity of its IT systems in any way.
    levels:
      1:
      - id: '1.1'
        text: Some metrics are monitored for some resources, at least ad hoc.
      2:
      - id: '2.1'
        text: >-
          A set of critical resources from the asset inventory has been identified, and their capacity
          is monitored.
      - id: '2.2'
        text: >-
          For these assets at least the basic metrics (disk, memory, CPU, bandwidth) are defined and alert
          rules are configured.
      3:
      - id: '3.1'
        text: >-
          A capacity management process has been established, is applied and is maintained so that IT
          capacity and performance are not harmed by increased demand.
      - id: '3.2'
        text: >-
          The process includes business capacity management (turning business needs into capacity requirements),
          service capacity management (managing the capacity of IT subsystems) and a capacity reporting
          mechanism.
      - id: '3.3'
        text: The availability of critical assets and core functions is monitored automatically.
      4:
      - id: '4.1'
        text: >-
          Resource planning studies covering 5 years have been carried out for critical assets and core
          functions.
      - id: '4.2'
        text: >-
          The studies are based on historical and recent data and consider trends, future plans and the
          organisation's objectives [STR1].
      - id: '4.3'
        common: R1
        text: >-
          The related documents are reviewed for suitability at least once a year. Any changes follow
          the change management process.
      - id: '4.4'
        text: Monitored resources include facilities, equipment, people, offices and others.
      - id: '4.5'
        text: >-
          System tuning and monitoring are carried out on critical assets to achieve the best possible
          capacity performance.
      5:
      - id: '5.1'
        text: System capacity is monitored continuously.
      - id: '5.2'
        text: >-
          Performance data and reports are produced, and planning is revised as needed based on actual
          usage and trends.
      - id: '5.3'
        common: K1
        text: >-
          The skills, capabilities and knowledge that the authorised roles need to run this process have
          been identified.
      - id: '5.4'
        common: K2
        text: >-
          The organisation ensures that the responsible staff already have this knowledge, or otherwise
          arranges for them to acquire it.
      - id: '5.5'
        text: Stress tests confirm the effectiveness of the capacity plans.
- id: IAM
  title: Identity and access management
  measures:
  - id: IAM1
    title: Role-based access control
    objective: >-
      Verify user authenticity and authorisation based on least privilege and on organisational roles
      and responsibilities.
    description: >-
      Establish, apply and maintain identity and access management measures based on roles, providing
      technical and organisational means to enforce least privilege and manage privileged users. Role-based
      access control grants users adequate permissions based on their responsibilities, and follows the
      human resources security procedures in [HRS1] so that access roles match staff roles and responsibilities.
    page: 65
    level0: The organisation does not manage access to its systems at all.
    levels:
      1:
      - id: '1.1'
        text: The organisation has systems for managing access to its systems.
      2:
      - id: '2.1'
        text: >-
          An access control policy covers all assets and buildings listed in the asset inventory [AM2].
      - id: '2.2'
        text: >-
          The access control policy covers access to applications, networks, resources and buildings.
      3:
      - id: '3.1'
        text: >-
          Role-based identity and access management measures have been established, are applied and are
          maintained, providing technical and organisational means to enforce least privilege and manage
          privileged users.
      - id: '3.2'
        text: >-
          Role-based access control grants users adequate permissions based on their responsibilities
          linked to their roles.
      - id: '3.3'
        text: >-
          Role-based access control follows the human resources security procedures in [HRS1], so that
          access roles match staff roles and responsibilities.
      - id: '3.4'
        text: >-
          Resource owners define the access rights and rules for the roles that need access to the resources
          they are responsible for.
      - id: '3.5'
        text: >-
          These are based on the resource's criticality, need for access, least privilege and the risk
          analysis results.
      - id: '3.6'
        text: >-
          The following principles apply: 1) security functions are limited to the minimum number of users
          needed to secure the systems; 2) a role that does not need access to information does not get
          it; 3) duties are segregated where possible.
      - id: '3.7'
        text: >-
          The access control policy states who (groups, entities, users, systems, services, etc.) can
          access which information, entity, object, system, service or network, and at what level.
      - id: '3.8'
        text: A register of accounts and entities is kept.
      4:
      - id: '4.1'
        text: Rights are assigned by role.
      - id: '4.2'
        text: Business roles and access control profiles are aligned.
      - id: '4.3'
        text: >-
          The policy includes relevant legislation and contractual obligations on restricting access to
          data or services.
      - id: '4.4'
        text: Access rights are reviewed regularly.
      - id: '4.5'
        common: R1
        text: >-
          The related documents are reviewed for suitability at least once a year. Any changes follow
          the change management process.
      5:
      - id: '5.1'
        text: >-
          An automated system detects accounts or entities in the organisation that are not explicitly
          authorised for specific actions.
      - id: '5.2'
        common: K1
        text: >-
          The skills, capabilities and knowledge that the authorised roles need to run this process have
          been identified.
      - id: '5.3'
        common: K2
        text: >-
          The organisation ensures that the responsible staff already have this knowledge, or otherwise
          arranges for them to acquire it.
  - id: IAM2
    title: External access control
    objective: Ensure adequate measures for external access to organisational resources.
    description: >-
      Establish, apply and maintain access controls for external and remote access to organisational resources.
      Remote network access uses virtual private networks (VPN), and remote applications are accessed
      through external interfaces. Identity and access management reflects the information security policy
      [GOV3] and role-based access control [IAM1].
    page: 66
    level0: >-
      The organisation does not manage external access to its resources in an organised way. Some systems
      are accessible externally, but access methods are not defined and follow no policy.
    levels:
      1:
      - id: '1.1'
        text: External access to resources is granted after approval by an authorised person.
      - id: '1.2'
        text: That person keeps a list of external access granted per system.
      - id: '1.3'
        text: Each external access may use a different method and different measures.
      2:
      - id: '2.1'
        text: A policy for managing external access to the organisation's resources exists.
      - id: '2.2'
        text: The policy has a clear owner, and the steps for enabling external access are defined.
      - id: '2.3'
        text: External access is granted after an approval process by the identified resource owner.
      3:
      - id: '3.1'
        text: >-
          External access to resources is limited and subject to strict access management and control
          procedures.
      - id: '3.2'
        text: >-
          Roles granted external access are specific, distinct and properly authorised by resource owners
          or other appropriate roles defined by the organisation.
      - id: '3.3'
        text: External access is always encrypted.
      - id: '3.4'
        text: External connections are logged automatically by a suitable system.
      4:
      - id: '4.1'
        text: Access uses multi-factor authentication (MFA).
      - id: '4.2'
        text: >-
          External access goes through specific, defined access gateways with strict security protocols.
      - id: '4.3'
        text: >-
          Before an external connection is made, the device is checked for compliance with specific security
          policies (e.g. anti-malware, USB, firewall, password, applications).
      - id: '4.4'
        text: Access actions are logged regardless of user level.
      - id: '4.5'
        text: >-
          Logs are reviewed at regular intervals to confirm compliance with the access control policy
          and detect deviations.
      - id: '4.6'
        text: Where possible, this review is automated.
      - id: '4.7'
        common: R1
        text: >-
          The related documents are reviewed for suitability at least once a year. Any changes follow
          the change management process.
      5:
      - id: '5.1'
        text: Web application firewalls protect all web-accessible or business-critical applications.
      - id: '5.2'
        text: Direct remote access to critical resources is not allowed.
      - id: '5.3'
        text: >-
          A suitably segregated architecture allows access to critical resources when needed without affecting
          their security.
      - id: '5.4'
        text: >-
          Logs are reviewed at regular intervals to confirm compliance with the access control policy
          and detect deviations.
      - id: '5.5'
        text: >-
          Suitable correlations, rules and alerts are implemented in the systems to inform the organisation
          promptly.
      - id: '5.6'
        common: K1
        text: >-
          The skills, capabilities and knowledge that the authorised roles need to run this process have
          been identified.
      - id: '5.7'
        common: K2
        text: >-
          The organisation ensures that the responsible staff already have this knowledge, or otherwise
          arranges for them to acquire it.
  - id: IAM3
    title: Privileged user management
    objective: >-
      Ensure adequate measures for users with privileged access to organisational resources, systems and
      networks.
    description: >-
      Establish, apply and maintain measures to manage privileged users properly and enable privileges
      only when needed. Users do not receive privileged rights by default, and technical and organisational
      measures protect privileged rights from malicious or other harmful behaviour. Systems and applications
      do not run with privileged user rights by default, to reduce the risk of privilege escalation.
    page: 67
    level0: >-
      The organisation has no control over granting privileged access to resources, systems and networks.
    levels:
      1:
      - id: '1.1'
        text: >-
          For critical resources, the organisation has limited the number of users with privileged access.
      2:
      - id: '2.1'
        text: A specific policy or procedure governs granting privileged access rights to users.
      - id: '2.2'
        text: >-
          A list is kept of all accounts (users, service accounts, etc.) with privileged access to resources,
          systems and networks.
      3:
      - id: '3.1'
        text: >-
          A documented policy or procedure governs privileged access to resources, systems and networks.
      - id: '3.2'
        text: >-
          The policy or procedure is consistent with the organisation's business needs and access control
          policy.
      - id: '3.3'
        text: >-
          Privileged access rights are granted only as needed (need-to-use and event-by-event basis).
      - id: '3.4'
        text: Users' privileged accounts are separate from the accounts they use for everyday work.
      4:
      - id: '4.1'
        text: >-
          Privileged accounts are logged, and the logs cannot be modified, disabled, deleted or altered
          by those accounts.
      - id: '4.2'
        text: Privileged accounts use MFA, whether resources are on-site or hosted by third parties.
      - id: '4.3'
        text: >-
          A list is kept of all accounts (users, service accounts, etc.) with privileged access to resources,
          systems and networks.
      - id: '4.4'
        text: >-
          The list contains at least: resource, account, type of privileged access, date granted, resource
          owner, review date and purpose.
      - id: '4.5'
        text: >-
          Privileged rights are reviewed at least quarterly to confirm that all active accounts are authorised.
      - id: '4.6'
        text: Privileged account passwords are known only to their assigned owner.
      - id: '4.7'
        common: R1
        text: >-
          The related documents are reviewed for suitability at least once a year. Any changes follow
          the change management process.
      5:
      - id: '5.1'
        text: Privileged accounts have a defined password change policy.
      - id: '5.2'
        text: >-
          Generic privileged accounts are not used, except in specific cases where there is no alternative.
      - id: '5.3'
        text: >-
          Passwords of generic privileged accounts are protected and accessible only to specific authorised
          people when needed.
      - id: '5.4'
        text: >-
          Use of generic privileged accounts is logged, and an automated system notifies authorised staff
          when they are used.
      - id: '5.5'
        text: >-
          Such cases are handled as potential security incidents and the incident management process is
          triggered.
      - id: '5.6'
        text: >-
          When a generic privileged account must be used, the (emergency or planned) change management
          process is followed, and the account is not used until authorisation is complete.
      - id: '5.7'
        common: K1
        text: >-
          The skills, capabilities and knowledge that the authorised roles need to run this process have
          been identified.
      - id: '5.8'
        common: K2
        text: >-
          The organisation ensures that the responsible staff already have this knowledge, or otherwise
          arranges for them to acquire it.
  - id: IAM4
    title: Strong authentication
    objective: >-
      Ensure authorised individuals are authenticated securely, using strong authentication measures.
    description: >-
      Establish, apply and maintain strong access control and authentication measures so that authorised
      individuals are properly identified and authenticated when using organisational resources. The organisation
      considers multi-factor authentication using at least two of: something you have (e.g. a key or token),
      something you know (e.g. password, passphrase or other secret), and something you are (biometric
      or morphological traits, or visual verification by a trusted party such as a security guard).
    page: 68
    level0: The organisation has no specific or organised policy on how accounts are authenticated.
    levels:
      1:
      - id: '1.1'
        text: >-
          Access to most systems is authenticated, but some functions (mainly inside the internal network)
          may not require authentication.
      2:
      - id: '2.1'
        text: >-
          Authentication mechanisms are chosen as a result of risk analysis (systems of different criticality
          may need different levels of authentication).
      - id: '2.2'
        text: The identity of all users, processes and resources is verified before access is granted.
      3:
      - id: '3.1'
        text: A documented policy or procedure governs authentication.
      - id: '3.2'
        text: >-
          The policy or procedure is consistent with the organisation's business needs and access control
          policy (it may be part of the latter).
      - id: '3.3'
        text: >-
          The policy lists the categories of authentication mechanisms allowed per system criticality
          (e.g. single sign-on, two-factor, multi-factor) for resources, networks (including remote and
          Wi-Fi) and other functions such as applications.
      - id: '3.4'
        text: >-
          Users and systems have unique identifiers and are authenticated before accessing services and
          systems.
      - id: '3.5'
        text: >-
          The authentication system is protected against brute-force logon attempts and logs successful
          and failed attempts.
      - id: '3.6'
        text: Multi-factor authentication is used to prove a person's identity.
      - id: '3.7'
        text: >-
          It uses at least two of: something you have (e.g. a key or token), something you know (e.g.
          password, passphrase or other secret), something you are (biometric or morphological traits,
          or visual verification by a trusted party such as a security guard).
      4:
      - id: '4.1'
        text: Default (built-in or vendor) accounts are disabled or renamed where possible.
      - id: '4.2'
        text: How each authentication mechanism operates is specified and documented.
      - id: '4.3'
        text: >-
          Where passwords are used, a documented password policy covers complexity, uniqueness and reuse,
          temporary passwords, invalid logon attempts, etc.
      - id: '4.4'
        text: Passwords are protected by encryption wherever they are stored.
      - id: '4.5'
        text: >-
          Where other or additional mechanisms are used (e.g. authenticator apps, one-time passwords),
          their security level is specified per case and matches the risk analysis results.
      - id: '4.6'
        text: >-
          Authentication is replay-resistant for network access to privileged and non-privileged accounts.
      - id: '4.7'
        text: Authentication systems' responses do not reveal information that attackers could exploit.
      - id: '4.8'
        common: R1
        text: >-
          The related documents are reviewed for suitability at least once a year. Any changes follow
          the change management process.
      5:
      - id: '5.1'
        text: >-
          The organisation uses port-level access control (IEEE 802.1X) and controls which devices can
          authenticate to the network.
      - id: '5.2'
        text: >-
          The authentication system is linked to the hardware asset inventory so that only authorised
          devices can connect to the network.
      - id: '5.3'
        text: >-
          Authentication system logs are reviewed automatically, and authorised staff are notified when
          a risk or trend is detected.
      - id: '5.4'
        common: K1
        text: >-
          The skills, capabilities and knowledge that the authorised roles need to run this process have
          been identified.
      - id: '5.5'
        common: K2
        text: >-
          The organisation ensures that the responsible staff already have this knowledge, or otherwise
          arranges for them to acquire it.
  - id: IAM5
    title: Credential management
    objective: >-
      Ensure secure management of credentials for access to corporate resources, and secure user authentication
      for the organisation's services.
    description: >-
      Establish, apply and maintain credential management procedures for the identification and authentication
      means users use to access organisational resources. Consider federated credentials (e.g. single
      sign-on) to improve user experience, and manage credentials for users, systems and networks to control
      access throughout the information lifecycle [DS1].
    page: 69
    level0: >-
      There is no structured or organised way of managing credentials for access to resources, systems
      and networks. Some systems may have passwords, but no policy applies.
    levels:
      1:
      - id: '1.1'
        text: Access to critical resources is protected with credentials.
      - id: '1.2'
        text: >-
          Passwords are at least 8 characters for standard users and at least 14 characters for privileged
          users.
      2:
      - id: '2.1'
        text: >-
          Authentication mechanisms are chosen as a result of risk analysis (systems of different criticality
          may need different levels of authentication).
      - id: '2.2'
        text: The identity of all users, processes and resources is verified before access is granted.
      3:
      - id: '3.1'
        text: >-
          A documented credential management procedure ensures proper management of the identification
          and authentication means users use to access organisational resources.
      - id: '3.2'
        text: Credential protection requirements have been communicated to all staff involved.
      - id: '3.3'
        text: Specific actions check the effectiveness of this communication.
      - id: '3.4'
        text: >-
          Where passwords are used, they are complex, changed periodically, not reused across systems,
          and stored encrypted.
      - id: '3.5'
        text: The system is protected against repeated failed access attempts.
      4:
      - id: '4.1'
        common: R1
        text: >-
          The related documents are reviewed for suitability at least once a year. Any changes follow
          the change management process.
      - id: '4.2'
        text: >-
          Federated credentials (e.g. single sign-on) have been implemented to improve user experience.
      - id: '4.3'
        text: An interactive system automatically enforces credential compliance with the policy.
      - id: '4.4'
        text: Where MFA is used, the type of authentication method and its security are specified.
      5:
      - id: '5.1'
        common: K1
        text: >-
          The skills, capabilities and knowledge that the authorised roles need to run this process have
          been identified.
      - id: '5.2'
        common: K2
        text: >-
          The organisation ensures that the responsible staff already have this knowledge, or otherwise
          arranges for them to acquire it.
  - id: IAM6
    title: Traceability and auditing
    objective: >-
      Ensure non-repudiable traceability of user actions on organisational resources, so that intentional
      or unintentional harmful activity can be detected and investigated.
    description: >-
      Establish, apply and maintain identity and access management measures for chronological traceability
      and auditability, so that users are accountable for the commands they run on information processing
      systems. Consider non-repudiation measures and traceability across systems, applications and networks.
    page: 70
    level0: >-
      User actions are not monitored in an organised way. Systems may create some activity records, but
      their characteristics are not defined and they are not checked manually or automatically.
    levels:
      1:
      - id: '1.1'
        text: >-
          Systems create some activity records case by case, ad hoc, after action by the authorised resource
          owner (or authorised custodian, e.g. IT).
      2:
      - id: '2.1'
        text: A documented policy defines which systems log activity.
      - id: '2.2'
        text: >-
          The scope of logging comes from risk analysis carried out under the responsibility of resource
          owners.
      - id: '2.3'
        text: 'The key characteristics defined are: log type, retention period and storage medium.'
      - id: '2.4'
        text: Security-related logging is enabled at least on critical systems.
      3:
      - id: '3.1'
        text: Security-related logging is enabled on all systems.
      - id: '3.2'
        text: External connections are logged automatically by a suitable system.
      - id: '3.3'
        text: The authentication system logs successful and failed attempts.
      - id: '3.4'
        text: Logs never show the password or other secret used or entered in an access attempt.
      4:
      - id: '4.1'
        text: Access actions are logged regardless of user level.
      - id: '4.2'
        text: >-
          Logs are reviewed at regular intervals to confirm compliance with the access control policy
          and detect deviations; where possible, automatically.
      - id: '4.3'
        text: >-
          Privileged accounts are logged, and the logs cannot be modified, disabled, deleted or altered
          by those accounts.
      - id: '4.4'
        text: >-
          Logs are retained for at least 3 months per system. Where this is technically not feasible,
          an exception mechanism exists.
      - id: '4.5'
        text: Exception approval follows the change control process.
      - id: '4.6'
        text: The exception request states how the risk is reduced through compensating measures.
      - id: '4.7'
        common: R1
        text: >-
          The related documents are reviewed for suitability at least once a year. Any changes follow
          the change management process.
      5:
      - id: '5.1'
        text: >-
          Properly configured intrusion detection/prevention and anomaly detection systems are in place.
      - id: '5.2'
        text: Logs are retained for at least one year.
      - id: '5.3'
        text: >-
          Certain categories (e.g. privileged account use on critical systems) are archived longer, taking
          relevant legislation into account.
      - id: '5.4'
        text: Access to these systems is controlled and restricted.
      - id: '5.5'
        text: >-
          Log data is classified as confidential under the organisation's classification scheme and handled
          accordingly.
      - id: '5.6'
        text: >-
          Log data is backed up according to the backup policy, the risk assessment and the resource's
          criticality.
      - id: '5.7'
        text: >-
          Logs are reviewed automatically at regular intervals to confirm compliance with the access control
          policy and detect deviations.
      - id: '5.8'
        text: >-
          Suitable correlations, rules and alerts are implemented in the systems to inform the organisation
          promptly.
      - id: '5.9'
        text: >-
          Use of generic privileged accounts is logged and an automated system notifies authorised staff;
          such cases are handled as potential security incidents and the incident management process is
          triggered.
      - id: '5.10'
        text: >-
          Authentication system logs are reviewed automatically, and authorised staff are notified when
          a risk or trend is detected.
      - id: '5.11'
        common: K1
        text: >-
          The skills, capabilities and knowledge that the authorised roles need to run this process have
          been identified.
      - id: '5.12'
        common: K2
        text: >-
          The organisation ensures that the responsible staff already have this knowledge, or otherwise
          arranges for them to acquire it.
  - id: IAM7
    title: Identity lifecycle management
    objective: Ensure roles and identity approvals reflect the lifecycle of the user's identity.
    description: >-
      Establish, apply and maintain adequate identity and access management throughout the identity lifecycle,
      including provisioning, authentication, approval and removal of identities. Identity lifecycle controls
      should be integrated into the human resources security procedures [HRS1], so that access roles follow
      the staff employment lifecycle.
    page: 71
    level0: >-
      Users are not managed in an organised or structured way. Each system has accounts assigned to users,
      but there is no basic structure, control or way to verify accounts.
    levels:
      1:
      - id: '1.1'
        text: >-
          Accounts are created and access to resources is granted after approval by an authorised person.
      - id: '1.2'
        text: That person keeps a list of accounts created per system.
      - id: '1.3'
        text: When someone leaves, authorised staff remove or disable their accounts.
      2:
      - id: '2.1'
        text: >-
          A policy or procedure exists for creating accounts and managing access to resources, covering
          both registration and deregistration.
      - id: '2.2'
        text: The policy has a clear owner, and the steps for enabling accounts and access are defined.
      - id: '2.3'
        text: Access to resources is granted after an approval process by the identified resource owner.
      - id: '2.4'
        text: Every account and access right change is recorded.
      - id: '2.5'
        text: A central list of user accounts on the organisation's systems is kept.
      - id: '2.6'
        text: A list of account rights is also kept.
      3:
      - id: '3.1'
        text: >-
          A documented policy or procedure governs account management across systems, resources and networks.
      - id: '3.2'
        text: It covers creation, modification, review, disabling and deletion of accounts.
      - id: '3.3'
        text: It identifies the specific roles in the organisation that carry out these actions.
      - id: '3.4'
        text: >-
          A set of roles has been defined based on requirements and operations and mapped to access rights
          to resources, systems and networks.
      - id: '3.5'
        text: >-
          A new account request includes: account type (standard, privileged, other categories as needed),
          owner, activation date, role and duration (where applicable).
      - id: '3.6'
        text: >-
          Account management is integrated and aligned with the human resources security procedures in
          HRS1, so that access roles and accounts follow the employment lifecycle of staff, contractors,
          etc.
      - id: '3.7'
        text: >-
          Every job change (demotion, promotion, transfer) triggers a change or review of access rights.
      - id: '3.8'
        text: User accounts are reviewed at least ad hoc.
      4:
      - id: '4.1'
        text: Accounts on all systems are reviewed at least quarterly and after major changes.
      - id: '4.2'
        text: Accounts inactive for more than 90 days are disabled.
      - id: '4.3'
        text: Account disabling and removal are as automated as possible.
      - id: '4.4'
        text: >-
          Any deviation found is recorded immediately and the security incident response process is triggered.
      - id: '4.5'
        text: >-
          Where possible, accounts are disabled after changing their credentials and removing their rights;
          otherwise they are deleted. (Use an automated process to revoke access by disabling accounts
          immediately on termination or change of responsibilities; disabling rather than deleting preserves
          audit trails.)
      - id: '4.6'
        text: >-
          Account and rights assignment and review cover both logical and physical access. Accounts previously
          owned or assigned are not reassigned to other users.
      - id: '4.7'
        text: Every account lifecycle change has a history with an exact timestamp.
      - id: '4.8'
        text: >-
          Account management actions are performed by roles and people without a conflict of interest.
      - id: '4.9'
        common: R1
        text: >-
          The related documents are reviewed for suitability at least once a year. Any changes follow
          the change management process.
      5:
      - id: '5.1'
        text: Account review and management are automated and continuous.
      - id: '5.2'
        text: Technical measures run the whole account lifecycle with minimal human intervention.
      - id: '5.3'
        text: >-
          At least quarterly, a technical assessment checks the effectiveness of the automated account
          management mechanism.
      - id: '5.4'
        text: These checks are performed by roles and people without a conflict of interest.
      - id: '5.5'
        text: The procedures cover all of the organisation's systems, networks and resources.
      - id: '5.6'
        text: >-
          Where a system, network or resource cannot be included in the automated process, an exception
          mechanism exists.
      - id: '5.7'
        text: Exception approval follows the change control process.
      - id: '5.8'
        text: The exception request states how the risk is reduced through compensating measures.
      - id: '5.9'
        common: K1
        text: >-
          The skills, capabilities and knowledge that the authorised roles need to run this process have
          been identified.
      - id: '5.10'
        common: K2
        text: >-
          The organisation ensures that the responsible staff already have this knowledge, or otherwise
          arranges for them to acquire it.
- id: VM
  title: Vulnerability and security update management
  measures:
  - id: VM1
    title: Vulnerability scanning and identification
    objective: >-
      Ensure the organisation knows its system vulnerabilities so that they are handled appropriately.
    description: >-
      Draw up, apply and maintain a risk-based plan and approach for testing applications, systems and
      networks for vulnerabilities and weaknesses that threats could exploit, including those arising
      from new or changed processes or systems. Vulnerabilities are identified in the context of threats
      to confidentiality, integrity and availability. Consider penetration testing. Results are recorded
      as described in [VM2].
    page: 74
    level0: The organisation takes no action to scan for and identify vulnerabilities.
    levels:
      1:
      - id: '1.1'
        text: >-
          Vulnerabilities are fixed reactively, at least ad hoc, and usually not on the organisation's
          own initiative (e.g. automatic security updates).
      2:
      - id: '2.1'
        text: >-
          Mechanisms and contacts are in place to receive timely information on vulnerabilities in critical
          systems.
      3:
      - id: '3.1'
        text: >-
          A risk-based plan and approach for testing applications, systems and networks for exploitable
          vulnerabilities and weaknesses has been established, is applied and is maintained.
      - id: '3.2'
        text: >-
          Scanning for vulnerabilities arising from new or changed processes or systems is considered.
      - id: '3.3'
        text: >-
          Vulnerabilities are identified in the context of threats to the confidentiality, integrity and
          availability of information.
      - id: '3.4'
        text: Results of vulnerability scanning and identification are recorded as described in [VM2].
      4:
      - id: '4.1'
        text: Automated methods and tools are used for vulnerability scanning and identification.
      - id: '4.2'
        text: >-
          Internal vulnerability scanning is done at least quarterly, authenticated and/or unauthenticated,
          with tools compatible with international best practice such as SCAP.
      - id: '4.3'
        text: >-
          Externally exposed systems are scanned at least monthly, with tools compatible with international
          best practice such as SCAP.
      - id: '4.4'
        text: Vulnerabilities are recorded under [VM2] and remediated under [VM3].
      - id: '4.5'
        text: >-
          The organisation subscribes to vulnerability information-sharing services to stay informed,
          and uses that information to improve its scanning process and mechanisms.
      - id: '4.6'
        text: Vulnerability data is an input to risk management.
      - id: '4.7'
        text: >-
          Authoritative vulnerability sources are used, giving access to verification and classification
          data.
      - id: '4.8'
        common: R1
        text: >-
          The related documents are reviewed for suitability at least once a year. Any changes follow
          the change management process.
      5:
      - id: '5.1'
        text: >-
          The organisation takes part in and receives reliable cyber threat intelligence, used among other
          things to update the list of threats, vulnerabilities and risks under [RM3] and [VM2].
      - id: '5.2'
        text: >-
          An independent external party carries out vulnerability assessments at regular intervals, covering
          all critical systems according to the criticality analysis under [DS2].
      - id: '5.3'
        text: Penetration tests are carried out to find and identify vulnerabilities.
      - id: '5.4'
        text: >-
          Vulnerability assessment results are used as the starting point to target penetration testing
          better.
      - id: '5.5'
        text: >-
          Internal penetration tests are carried out at least once a year according to plan; they may
          be white-box or grey-box.
      - id: '5.6'
        text: >-
          Taking into account the organisation's context, security objectives and strategy, and legal,
          regulatory and contractual requirements, an organised penetration testing programme is drawn
          up.
      - id: '5.7'
        text: >-
          The programme covers scope (e.g. network, web applications, APIs, hosted services, physical
          access controls), constraints (e.g. permitted hours, staff to be informed), test types, methodologies
          and standards, frequency, objective, roles and responsibilities, documentation to be kept and
          delivered, points of contact, and an immediate action plan for findings.
      - id: '5.8'
        common: K1
        text: >-
          The skills, capabilities and knowledge that the authorised roles need to run this process have
          been identified.
      - id: '5.9'
        common: K2
        text: >-
          The organisation ensures that the responsible staff already have this knowledge, or otherwise
          arranges for them to acquire it.
  - id: VM2
    title: Vulnerability recording and reporting
    objective: >-
      Ensure vulnerabilities are recorded and reported so that management can make informed decisions
      on handling them.
    description: >-
      Establish, apply and maintain procedures to record and report identified vulnerabilities, so that
      systems and processes can be remediated and updated to protect confidentiality, integrity and availability.
      Recording and reporting result from the scanning efforts in [VM1]. Consider including high-risk
      vulnerabilities in general management reports, to ensure top-down awareness and identify appropriate
      remediation measures as described in [VM3].
    page: 75
    level0: The organisation takes no action to scan for, identify, record or report vulnerabilities.
    levels:
      1:
      - id: '1.1'
        text: >-
          Vulnerabilities are fixed reactively, at least ad hoc, and usually not on the organisation's
          initiative (e.g. automatic security updates), possibly without recording the vulnerability.
      2:
      - id: '2.1'
        text: >-
          Mechanisms and contacts are in place to receive timely information on vulnerabilities in critical
          systems.
      - id: '2.2'
        text: Vulnerability details are recorded and communicated internally.
      3:
      - id: '3.1'
        text: >-
          A procedure to record and report identified vulnerabilities, so that systems and processes can
          be remediated and updated, has been established, is applied and is maintained.
      - id: '3.2'
        text: >-
          Vulnerability recording and reporting result from the scanning and identification efforts described
          in [VM1].
      - id: '3.3'
        text: >-
          Including high-risk vulnerabilities in general management reports is considered, to ensure top-down
          awareness and identify appropriate remediation measures as described in [VM3].
      - id: '3.4'
        text: >-
          Vulnerabilities are recorded in the list of threats, vulnerabilities and risks referred to in
          [RM3].
      - id: '3.5'
        text: >-
          The severity of each vulnerability is assessed considering its exploitability and potential
          impact per case and per asset category, taking existing measures into account (e.g. network-level
          and asset-level measures).
      4:
      - id: '4.1'
        text: >-
          When the parties involved find that weaknesses, threats or risks no longer apply, the list is
          updated to mark the entry inactive, keeping and documenting the history. Updates may come from
          different sources, as in [RM3] and [VM1].
      - id: '4.2'
        text: >-
          Authoritative vulnerability sources are used, giving access to verification and classification
          data.
      - id: '4.3'
        text: Vulnerabilities are classified according to international best practice (e.g. CVSS).
      - id: '4.4'
        text: >-
          The vulnerability list records at least: asset, vulnerability, threat(s) that could exploit
          it, resulting risk, exploitability and severity.
      - id: '4.5'
        common: R1
        text: >-
          The related documents are reviewed for suitability at least once a year. Any changes follow
          the change management process.
      5:
      - id: '5.1'
        text: >-
          International best practice and tools (e.g. STIX and the MISP threat sharing platform) are used
          for structured recording, receiving and sending of threat intelligence.
      - id: '5.2'
        common: K1
        text: >-
          The skills, capabilities and knowledge that the authorised roles need to run this process have
          been identified.
      - id: '5.3'
        common: K2
        text: >-
          The organisation ensures that the responsible staff already have this knowledge, or otherwise
          arranges for them to acquire it.
  - id: VM3
    title: Vulnerability remediation and security updates
    objective: >-
      Ensure system vulnerabilities are remediated and security updates applied, following management
      decision.
    description: >-
      Establish, apply and maintain procedures to remediate vulnerabilities and apply security updates
      for vulnerabilities in systems, applications and network components that require mitigation following
      management assessment, based on the recording and reporting described in [VM2].
    source: C2M2 (THREAT, ASSET), NIST 800-53 (SA-22), ISO 27001, ISO 27002
    page: 76
    level0: The organisation takes no action to remediate vulnerabilities.
    levels:
      1:
      - id: '1.1'
        text: >-
          Vulnerabilities are fixed reactively, at least ad hoc, and usually not on the organisation's
          initiative (e.g. automatic security updates), possibly without recording the vulnerability.
      2:
      - id: '2.1'
        text: Vulnerability remediation policies are enabled or applied for critical systems only.
      - id: '2.2'
        text: >-
          Updates are not installed automatically; authorised staff check them first and then install
          them.
      3:
      - id: '3.1'
        text: >-
          Procedures to remediate vulnerabilities and apply security updates for vulnerabilities in systems,
          applications and network components that require mitigation following management assessment
          have been established, are applied and are maintained.
      - id: '3.2'
        text: >-
          Remediation and security updates result from a management decision based on the recording and
          reporting described in [VM2].
      - id: '3.3'
        text: Remediation actions follow the change management process referred to in [CM1].
      - id: '3.4'
        text: >-
          The procedures define how the organisation responds to vulnerabilities of a given severity per
          asset category in the asset inventory [DS2].
      - id: '3.5'
        text: >-
          The procedures state which actions are applied automatically without testing and which only
          after testing. (For critical systems, an update is always installed on a test or similar low-risk
          system first.)
      - id: '3.6'
        text: Management has approved the procedure.
      - id: '3.7'
        text: Monitoring in these cases follows the change management process [CM1].
      4:
      - id: '4.1'
        text: >-
          The techniques in [VM1] and [VM2] are applied to scan for, identify and record vulnerabilities.
      - id: '4.2'
        text: >-
          A system tracks the status of assets against identified vulnerabilities and whether the latest
          security updates are installed.
      - id: '4.3'
        text: >-
          When new versions of software or other components are released, their cost and benefit of upgrading
          are assessed.
      - id: '4.4'
        text: >-
          As a rule, the organisation runs the latest tested and stable versions of the software it uses.
      - id: '4.5'
        text: >-
          End-of-life software or equipment is not allowed. Where unavoidable, it is recorded as a risk
          and compensating measures are designed following [RM1-6].
      - id: '4.6'
        text: >-
          All identified high-severity vulnerabilities are tracked and recorded through change management
          [CM1].
      - id: '4.7'
        text: >-
          Anti-malware solutions with vulnerability detection and anti-exploitation filters are in place.
      - id: '4.8'
        common: R1
        text: >-
          The related documents are reviewed for suitability at least once a year. Any changes follow
          the change management process.
      5:
      - id: '5.1'
        text: >-
          After a vulnerability is treated (by an update or other actions depending on the vulnerability),
          the effectiveness of the actions against the vulnerability or threat is checked.
      - id: '5.2'
        text: >-
          How effectiveness will be assessed is recorded in the change record, and may include tests,
          analysis, advanced threat hunting, active defence, etc.
      - id: '5.3'
        text: If the effectiveness assessment is negative, corrective actions are taken.
      - id: '5.4'
        text: >-
          The requirements apply to third-party, open-source and in-house software; for in-house software,
          [AS1] also applies.
      - id: '5.5'
        common: K1
        text: >-
          The skills, capabilities and knowledge that the authorised roles need to run this process have
          been identified.
      - id: '5.6'
        common: K2
        text: >-
          The organisation ensures that the responsible staff already have this knowledge, or otherwise
          arranges for them to acquire it.
- id: NS
  title: Network security
  measures:
  - id: NS1
    title: Perimeter security
    objective: >-
      Ensure the interface between the local and external network is protected from attacks, threats and
      other intentional or unintentional harmful actions.
    description: >-
      Establish, apply and maintain network security measures that protect the network perimeter from
      external threats and ensure the confidentiality, integrity and availability of information on the
      internal network. Perimeter security is only one layer of a defence-in-depth architecture. Consider
      organisation- and sector-specific threats and risks, firewalls and intrusion detection and prevention
      systems [NS7], and filter traffic according to the organisation's security policies.
    source: C2M2, NIST 800-53, CIS, ISO 27002
    page: 78
    level0: The organisation applies no measures to protect its (logical) perimeter.
    levels:
      1:
      - id: '1.1'
        text: A firewall acts as the interface between the local and external network.
      - id: '1.2'
        text: >-
          The firewall's configuration is at least basic, and it may not be checked and managed regularly
          and meaningfully.
      2:
      - id: '2.1'
        text: >-
          A network architecture has been designed and implemented to achieve the required network security
          level, taking into account the practices and measures in [NS2]–[NS7].
      - id: '2.2'
        text: >-
          The architecture is documented in a network diagram giving sufficient information on interconnections,
          operation and protection layers.
      - id: '2.3'
        text: The equipment performing security functions at each layer has been identified.
      - id: '2.4'
        text: >-
          Perimeter equipment has security policies and rules based on default deny (everything closed,
          opened only when needed), minimal services (unnecessary services disabled), controlled access
          (per [IAM1]) and activity monitoring and logging (per [IAM2]).
      - id: '2.5'
        text: >-
          At least the following are disabled: a) inbound and outbound traffic to and from the external
          network on TCP 445 (SMB), UDP 137 (NetBIOS Name Resolution), UDP 138 (NetBIOS Datagram) and
          TCP 139 (NetBIOS Session); b) inbound SMB on TCP 445 on assets that do not host shares; c) SMBv1
          and SMBv2 on the internal network.
      - id: '2.6'
        text: Changes to perimeter equipment follow the change management process in [CM1].
      - id: '2.7'
        text: >-
          Host-based firewalls or port filtering tools have an explicit or implicit rule that drops all
          traffic except explicitly authorised services, protocols and ports.
      3:
      - id: '3.1'
        text: >-
          Network security measures that protect the network perimeter from external threats and ensure
          the confidentiality, integrity and availability of information on the internal network have
          been established, are applied and are maintained.
      - id: '3.2'
        text: >-
          A defence-in-depth architecture is in place, in which perimeter security is only one layer.
      - id: '3.3'
        text: >-
          Security rules and mechanisms were designed taking into account risk assessment results and
          organisation- and sector-specific network threats and risks.
      - id: '3.4'
        text: A set of security policies ensures traffic is filtered to the required level.
      - id: '3.5'
        text: >-
          Networks are segregated as required by [NS2]. Assets that must be reachable from the external
          network are always separated from the internal network.
      - id: '3.6'
        text: >-
          Connections to external networks or systems are made only through the managed interfaces of
          assets identified at the logical perimeter (per the implemented architecture).
      - id: '3.7'
        text: Port security is enabled on switches and unused ports are disabled.
      - id: '3.8'
        text: Unused router interfaces and routing protocols are disabled.
      - id: '3.9'
        text: MFA is required to access the management interfaces of perimeter assets.
      - id: '3.10'
        text: >-
          Protocols such as SMB, SNTP and others that can carry data, messages or status are used only
          when needed, after analysis and proper configuration; related records are kept through change
          control.
      - id: '3.11'
        text: >-
          A documented network security policy is applied, covering at least roles and responsibilities,
          principles of the network architecture design, core network management procedures, records kept,
          logs and their retention, and the security measures applied.
      - id: '3.12'
        text: >-
          The network diagram gives detailed information on architecture layers, the assets in each layer
          and their main characteristics, possible single points of failure, and where monitoring is enabled.
      - id: '3.13'
        text: Diagrams are handled as information of the highest classification level (per [DS2]).
      - id: '3.14'
        text: >-
          Configuration files of these assets are backed up according to the backup policy and additionally
          before every change; backup history is kept.
      - id: '3.15'
        text: >-
          Remote access uses a VPN connecting to the organisation's AAA (Authentication, Authorization
          and Accounting) infrastructure; user authentication at the appropriate point is required to
          reach other internal assets.
      4:
      - id: '4.1'
        text: >-
          Remote user access to the internal network uses a VPN with two-factor authentication and current
          encryption algorithms.
      - id: '4.2'
        text: >-
          IT administrative tasks are performed from assets used exclusively for that purpose, segregated
          as required by [NS2].
      - id: '4.3'
        text: Host-based intrusion detection is implemented according to [NS7].
      - id: '4.4'
        text: >-
          All assets protecting the perimeter and other security layers are monitored and logged as required
          by [AM3]; data is collected and responded to as required by [AM3] and [EIM1].
      - id: '4.5'
        text: Monitoring between network segments is enabled as required.
      - id: '4.6'
        text: >-
          Every workstation (endpoint) and, where possible, every other asset has a firewall that blocks
          all network connections except the ports and services needed for business.
      - id: '4.7'
        text: Configuration detects TCP sessions lasting unusually long.
      - id: '4.8'
        text: >-
          Proxy servers monitor and log TCP sessions and filter and block specific URLs, domains and IPs
          according to the organisation's rules and risk.
      - id: '4.9'
        text: >-
          A maximum session duration is defined, and technical rules and tools end connections when it
          is reached or after a period of inactivity (the duration may vary with information criticality
          and other conditions).
      - id: '4.10'
        common: R1
        text: >-
          The related documents are reviewed for suitability at least once a year. Any changes follow
          the change management process.
      - id: '4.11'
        text: >-
          All traffic to and from the internet passes through an authenticated application-layer (web)
          proxy configured to block unauthorised connections.
      5:
      - id: '5.1'
        text: >-
          Zero trust network architecture principles are applied according to international best practice
          (e.g. NIST SP 800-207).
      - id: '5.2'
        text: >-
          At least the following principles are met: a) all data and systems are treated as resources;
          b) all communication is secured regardless of network location; c) access to resources is granted
          only when strictly needed and per session; d) access is decided by a dynamic policy that can
          include behavioural and environmental attributes; e) the integrity and security posture of assets
          is monitored; f) dynamic authentication and authorisation are enforced before access; g) as
          much information as possible is collected on the current state of assets, network infrastructure
          and communications and used to improve security.
      - id: '5.3'
        text: >-
          Network intrusion detection and prevention systems (e.g. NIDS, or an equivalent cloud provider
          service with appropriate guarantees) detect and prevent attacks in every segment or subnet.
      - id: '5.4'
        text: >-
          A hardware data diode enforces one-way data flow to protect critical information in high-security
          segments or subnets.
      - id: '5.5'
        text: >-
          Measures prevent unauthorised exfiltration, e.g.: 1) limiting to specific protocols and communication
          methods; 2) monitoring possible beaconing from organisational assets; 3) tools and effort to
          detect steganography; 4) disconnecting external interfaces when not in use; 5) traffic analysis
          to tell normal from abnormal system behaviour; 6) packet header analysis. (Deep packet inspection
          firewalls or XML gateways partly provide these.)
      - id: '5.6'
        common: K1
        text: >-
          The skills, capabilities and knowledge that the authorised roles need to run this process have
          been identified.
      - id: '5.7'
        common: K2
        text: >-
          The organisation ensures that the responsible staff already have this knowledge, or otherwise
          arranges for them to acquire it.
  - id: NS2
    title: Network segregation and segmentation
    objective: >-
      Ensure logical network segregation according to business functions and prevent the spread of malicious
      elements.
    description: >-
      Establish, apply and maintain appropriate network segregation and segmentation, logical and/or physical.
      Take into account the organisation's functional areas and the nature and volume of data processed
      in each business activity. Consider VLANs when designing segregation, and at least separate research
      and development, administration, central information infrastructure, and publicly available (internet-facing)
      applications and systems.
    source: NIST 800-53 (SC-3), ISO 27001, ISO 27002, PNNL
    page: 80
    level0: The organisation applies no measures to protect its (logical) perimeter.
    levels:
      1:
      - id: '1.1'
        text: A firewall acts as the interface between the local and external network.
      - id: '1.2'
        text: >-
          The firewall's configuration is at least basic, and it may not be checked and managed regularly
          and meaningfully (segregation may only separate the internal from the external network).
      2:
      - id: '2.1'
        text: >-
          A network architecture has been designed and implemented to achieve the required network security
          level, taking into account the practices and measures in [NS2]–[NS7].
      - id: '2.2'
        text: >-
          The architecture is documented in a network diagram giving sufficient information on interconnections,
          operation and protection layers.
      - id: '2.3'
        text: Critical systems are protected by more than one layer.
      3:
      - id: '3.1'
        text: >-
          Appropriate network segregation and segmentation, logical and/or physical (where feasible),
          has been established, is applied and is maintained.
      - id: '3.2'
        text: >-
          The organisation's functional areas are taken into account when designing, applying and maintaining
          segregation and segmentation.
      - id: '3.3'
        text: >-
          The nature and volume of data processed in each business activity are taken into account to
          ensure adequate segregation.
      - id: '3.4'
        text: >-
          An asset inventory exists as in [RM2], and assets are classified by criticality as in [DS2].
      - id: '3.5'
        text: >-
          Critical systems are segregated so that additional protection, stricter access management and
          monitoring can be applied; traffic between these segments or subnets is filtered to limit information
          flow to what is strictly necessary for business.
      4:
      - id: '4.1'
        text: >-
          VLANs are used in the segmented network design, planned according to each department's needs,
          security objectives, data criticality and other criteria the organisation considers necessary.
      - id: '4.2'
        text: >-
          At least research and development, administration, central information infrastructure, and public
          (internet-facing) applications and systems are separated.
      - id: '4.3'
        text: >-
          IT administrative tasks are performed from dedicated assets, physically or logically separated
          from others and without direct internet access, following segregation rules.
      - id: '4.4'
        text: >-
          Regular checks and tests confirm that the rules are applied and the required segregation exists
          at all levels.
      - id: '4.5'
        common: R1
        text: >-
          The related documents are reviewed for suitability at least once a year. Any changes follow
          the change management process.
      5:
      - id: '5.1'
        text: >-
          Zero trust network architecture principles are applied according to international best practice
          (e.g. NIST SP 800-207).
      - id: '5.2'
        text: >-
          Security functions are separated from other functions through an isolation boundary, implemented
          in the most suitable way (e.g. security kernels via processor rings or modes, or separating
          security and non-security code as far as possible).
      - id: '5.3'
        text: Where possible, the identified layers are physically rather than just logically separated.
      - id: '5.4'
        common: K1
        text: >-
          The skills, capabilities and knowledge that the authorised roles need to run this process have
          been identified.
      - id: '5.5'
        common: K2
        text: >-
          The organisation ensures that the responsible staff already have this knowledge, or otherwise
          arranges for them to acquire it.
  - id: NS3
    title: Denial-of-service protection
    objective: >-
      Protect organisational resources from denial-of-service attacks without affecting legitimate service
      delivery.
    description: >-
      Establish, apply and maintain adequate protection against denial-of-service and distributed denial-of-service
      attacks, so that authorised and authenticated users receive timely, quality service and productivity
      stays stable. Consider capabilities that tell legitimate users and applications from malicious access
      attempts, and the redundancy and high-availability measures in [NS6].
    source: NIST 800-53, PNNL
    page: 82
    level0: The organisation applies no measures to protect its (logical) perimeter.
    levels:
      1:
      - id: '1.1'
        text: A firewall acts as the interface between the local and external network.
      - id: '1.2'
        text: >-
          The firewall's configuration is at least basic, and it may not be checked and managed regularly
          and meaningfully.
      2:
      - id: '2.1'
        text: As part of [RM2], an analysis identifies which assets are used to deliver services.
      - id: '2.2'
        text: >-
          For each critical asset (as identified in [DS2]), the ways it can be overloaded and the limits
          (bandwidth, processing power, storage) beyond which its availability is at risk are identified
          and recorded.
      - id: '2.3'
        text: >-
          Risks of losing the availability of critical assets are included in risk analysis and evaluation.
      - id: '2.4'
        text: Critical systems are protected by more than one layer.
      3:
      - id: '3.1'
        text: >-
          Adequate protection against denial-of-service and distributed denial-of-service attacks has
          been established, is applied and is maintained.
      - id: '3.2'
        text: >-
          Accounts accessing the organisation are authorised and authenticated; unauthenticated access
          is not allowed, as required by [IAM1].
      - id: '3.3'
        text: Activity monitoring and logging are enabled as required by [IAM6].
      - id: '3.4'
        text: >-
          Redundancy and high-availability measures in [NS6] and [AM4] are taken into account so that
          operations continue if the availability of information and services is threatened.
      - id: '3.5'
        text: Networks are segregated as required by [NS2].
      - id: '3.6'
        text: >-
          Assets that must be reachable from the external network (and are more likely to be targeted)
          are always separated from the internal network.
      4:
      - id: '4.1'
        text: >-
          Availability monitoring of critical services and assets (per [AM4]) can detect denial-of-service
          attacks and send real-time alerts.
      - id: '4.2'
        text: >-
          Organisations providing internet services take specific DNS measures: at least 2 DNS servers,
          physically and logically protected, in different locations, with zone transfers at least every
          24 hours and resilience measures against attacks.
      - id: '4.3'
        text: Source routing is prohibited.
      - id: '4.4'
        text: >-
          Critical systems can handle excess capacity (e.g. bandwidth, memory) to reduce the impact of
          such attacks.
      - id: '4.5'
        text: >-
          When such an attempt is detected, authorised staff are notified immediately and respond as required
          by [EIM1].
      - id: '4.6'
        text: >-
          Monitoring data is checked to confirm it contains the elements required at level 3, and asset
          status is monitored through technical measures as required by [AM6].
      - id: '4.7'
        text: >-
          Threshold rules on resource consumption (e.g. bandwidth, memory, disk) notify administrators
          immediately.
      - id: '4.8'
        text: >-
          Staff immediately analyse and extract trends to find the cause, and trigger the security incident
          management process under [EIM1].
      - id: '4.9'
        common: R1
        text: >-
          The related documents are reviewed for suitability at least once a year. Any changes follow
          the change management process.
      - id: '4.10'
        text: >-
          Domain registrar locking prevents denial of service through unauthorised deletion, transfer
          or alteration of the domain registration.
      - id: '4.11'
        text: >-
          Software used (custom, open-source or proprietary) is protected by default and by design at
          least against the OWASP Top 10 (for web applications and APIs) and equivalent best practice
          for other applications (OWASP ASVS).
      5:
      - id: '5.1'
        text: >-
          Public applications are hosted by a recognised, high-security external cloud provider (e.g.
          CSA score of at least 10), after thorough assessment of its ability to withstand denial-of-service
          attacks; contracts include measures and guarantees as required by [TPS1].
      - id: '5.2'
        text: >-
          A specialised security-as-a-service cloud provider protects public applications from distributed
          denial-of-service attacks (e.g. CSA score of at least 10), after thorough assessment; contracts
          include measures and guarantees as required by [TPS1].
      - id: '5.3'
        common: K1
        text: >-
          The skills, capabilities and knowledge that the authorised roles need to run this process have
          been identified.
      - id: '5.4'
        common: K2
        text: >-
          The organisation ensures that the responsible staff already have this knowledge, or otherwise
          arranges for them to acquire it.
  - id: NS4
    title: Secure communication protocols
    objective: >-
      Ensure appropriate communication protocols for secure communication between network resources.
    description: >-
      Establish, apply and maintain secure protocols for information flows between network points, applications
      and systems, protecting confidentiality and integrity in transit and preventing network attacks
      such as eavesdropping. Consider the most current protocols, and cryptographic measures as defined
      in [AM5], using technologies such as HTTPS, IPsec and TLS/SSL as appropriate.
    page: 83
    level0: The organisation applies no measures to protect its (logical) perimeter.
    levels:
      1:
      - id: '1.1'
        text: A firewall acts as the interface between the local and external network.
      - id: '1.2'
        text: >-
          The firewall's configuration is at least basic, and allowed and used communication protocols
          may not be checked and managed regularly and meaningfully.
      2:
      - id: '2.1'
        text: >-
          Processes that exchange highly critical information (e.g. passwords) have been identified and
          use encrypted protocols and communication methods.
      - id: '2.2'
        text: >-
          In such cases, protocols without strong encryption are used only combined with a second measure
          (e.g. telnet, VNC or RDP over SSL or IPsec).
      3:
      - id: '3.1'
        text: >-
          Secure protocols for information flows between network points, applications and systems, protecting
          confidentiality and integrity in transit and preventing network attacks such as eavesdropping,
          have been established, are applied and are maintained.
      - id: '3.2'
        text: >-
          The most current communication protocols are considered when securing information transfer and
          exchange over networks.
      - id: '3.3'
        text: >-
          Cryptographic security measures as defined in [AM5] are considered, using technologies such
          as HTTPS, IPsec and TLS/SSL as appropriate.
      - id: '3.4'
        text: >-
          Critical or sensitive data is encrypted in exchange or transfer, for example with TLS or OpenSSH.
      - id: '3.5'
        text: >-
          Data on physical media is encrypted before it is sent; encryption keys are sent separately,
          by another channel, without indicating their purpose.
      - id: '3.6'
        text: Online transfers use the latest stable versions of protocols such as SFTP or HTTPS.
      - id: '3.8'
        text: >-
          Systems and assets are reviewed to identify which protocols, ports and services they need; anything
          not needed is disabled (including Bluetooth, FTP, peer-to-peer, etc.).
      4:
      - id: '4.1'
        text: >-
          Information exchange through APIs is designed, configured, implemented and operated to match
          the organisation's security level.
      - id: '4.2'
        text: International best practice (e.g. OWASP API Security Top 10) is applied.
      - id: '4.3'
        text: >-
          Data confidentiality is ensured by channel-level or data-level encryption when data crosses
          different networks, even within the organisation.
      - id: '4.4'
        text: >-
          Outbound traffic (web, FTP, SSL) is routed through at least one proxy in a DMZ that monitors
          TCP sessions and blocks specific URLs, domain names and IPs.
      - id: '4.5'
        text: >-
          Feedback to senders on protocol format validation failures is disabled (at least for information
          the sender does not already have).
      - id: '4.6'
        text: >-
          Secure routing protocols or static routes are used so the internal structure is not exposed.
      - id: '4.7'
        common: R1
        text: >-
          The related documents are reviewed for suitability at least once a year. Any changes follow
          the change management process.
      5:
      - id: '5.1'
        text: Restrictions on VoIP are in place.
      - id: '5.2'
        text: >-
          VoIP is used only for specific authorised purposes and only through dedicated network segments.
      - id: '5.3'
        text: Settings protect VoIP and ensure a high level of communication security.
      - id: '5.4'
        common: K1
        text: >-
          The skills, capabilities and knowledge that the authorised roles need to run this process have
          been identified.
      - id: '5.5'
        common: K2
        text: >-
          The organisation ensures that the responsible staff already have this knowledge, or otherwise
          arranges for them to acquire it.
  - id: NS5
    title: Network access control
    objective: >-
      Ensure access to the logical network from external and internal systems is properly secured, so
      that only authorised persons can access organisational resources.
    description: >-
      Establish, apply and maintain network access controls to secure logical access to the network and
      information resources and prevent unauthorised access. Consider technical and organisational measures
      such as network authentication, control of wired, wireless and other connections, and integration
      with central credentials and identity and access management as defined in [IAM5].
    page: 85
    level0: The organisation does not manage logical or physical access to its systems at all.
    levels:
      1:
      - id: '1.1'
        text: Systems exist for managing network access.
      2:
      - id: '2.1'
        text: >-
          An access control policy covers all assets and buildings listed in the asset inventory [AM2].
      - id: '2.2'
        text: The policy covers at least access to applications, networks, resources and buildings.
      3:
      - id: '3.1'
        text: >-
          Network access controls that secure logical access to the network and information resources
          and prevent unauthorised access have been established, are applied and are maintained.
      - id: '3.2'
        text: >-
          Specific technical and organisational measures, such as network authentication mechanisms, support
          this.
      - id: '3.3'
        text: Access control covers wired, wireless and other network connections.
      - id: '3.4'
        text: Public wireless networks, where offered, are separated from the rest of the network.
      - id: '3.5'
        text: The procedures in [IAM1] always apply.
      4:
      - id: '4.1'
        text: Wireless traffic is encrypted with AES using 256-bit keys.
      - id: '4.2'
        text: >-
          A wireless intrusion detection system (WIDS) detects unauthorised wireless access points connected
          to the network.
      - id: '4.3'
        text: Wireless access uses suitable authentication protocols such as EAP-TLS.
      - id: '4.4'
        common: R1
        text: >-
          The related documents are reviewed for suitability at least once a year. Any changes follow
          the change management process.
      5:
      - id: '5.1'
        text: Wireless capability is disabled on assets that have it but do not need it.
      - id: '5.2'
        text: >-
          Technical procedures and tools authorise use of wireless networks, and a strict policy defines
          who may configure wireless networking capabilities.
      - id: '5.3'
        common: K1
        text: >-
          The skills, capabilities and knowledge that the authorised roles need to run this process have
          been identified.
      - id: '5.4'
        common: K2
        text: >-
          The organisation ensures that the responsible staff already have this knowledge, or otherwise
          arranges for them to acquire it.
  - id: NS6
    title: Redundancy and high availability
    objective: >-
      Ensure the availability of information and information networks through sufficient resource availability,
      redundant equipment, and high-availability systems and connections.
    description: >-
      Establish, apply and maintain adequate measures for a reasonable level of redundancy and high availability,
      especially for vital systems, services and applications processing classified or business information,
      at all technology layers (storage, communication, processing). Consider technologies such as failover
      or standby systems, RAID, and cold, warm and hot data storage facilities.
    page: 86
    level0: >-
      The organisation has taken no measures to ensure the availability of networks and IT systems.
    levels:
      1:
      - id: '1.1'
        text: Some spare equipment exists that can be used if an asset fails.
      2:
      - id: '2.1'
        text: Critical assets have been identified.
      - id: '2.2'
        text: For each of them there is at least one spare (identical or of equivalent capability).
      - id: '2.3'
        text: These assets are listed in the asset inventory.
      3:
      - id: '3.1'
        text: >-
          Adequate measures for a reasonable level of redundancy and high availability, especially for
          vital systems, services and applications processing classified or business information, have
          been established, are applied and are maintained.
      - id: '3.2'
        text: >-
          Redundancy and high availability are ensured at all technology layers, including storage, communication
          and processing.
      - id: '3.3'
        text: >-
          Redundancy and high-availability technologies such as failover or standby systems, RAID, and
          cold, warm and hot storage facilities are considered.
      - id: '3.4'
        text: >-
          At least power, capacity, network and connectivity are redundant on-site, and no critical equipment
          lacks an active or standby spare on the same premises.
      - id: '3.5'
        text: >-
          Equipment at a secondary site has been planned so that core activities can be recovered within
          a defined time and to a defined level.
      - id: '3.6'
        text: Backups are kept as described in [DS3].
      - id: '3.7'
        text: >-
          Threshold rules on resource consumption (e.g. bandwidth, memory, disk) notify administrators
          immediately; staff analyse trends to find the cause and trigger the incident management process
          under [EIM1].
      4:
      - id: '4.1'
        text: >-
          The planning and measures needed for the business continuity plan and disaster recovery plan
          in [BCR1-4] to work correctly and effectively have been implemented.
      - id: '4.2'
        text: There is at least a second data facility with critical equipment in a warm state.
      - id: '4.3'
        text: >-
          Redundant cabling (network, power and other) follows physically separate routes, taking the
          related risks into account.
      - id: '4.4'
        text: >-
          Tests confirm this equipment exists and can operate correctly and effectively if needed; problems
          found are fixed immediately and recorded through change management [CM1].
      - id: '4.5'
        common: R1
        text: >-
          The related documents are reviewed for suitability at least once a year. Any changes follow
          the change management process.
      5:
      - id: '5.1'
        text: There is at least a second data facility with critical equipment in a hot state.
      - id: '5.2'
        text: >-
          Failover between the two facilities is automatic with minimal human intervention (facilities
          follow international availability and resilience best practice, e.g. at least Uptime Institute
          Tier III).
      - id: '5.3'
        text: Tests confirm this equipment exists and can operate correctly and effectively when needed.
      - id: '5.4'
        text: Problems found are fixed immediately and recorded through change management [CM1].
      - id: '5.5'
        common: K1
        text: >-
          The skills, capabilities and knowledge that the authorised roles need to run this process have
          been identified.
      - id: '5.6'
        common: K2
        text: >-
          The organisation ensures that the responsible staff already have this knowledge, or otherwise
          arranges for them to acquire it.
  - id: NS7
    title: Intrusion detection and prevention
    objective: Ensure external intrusion attempts and security attacks are detected and prevented.
    description: >-
      Establish, apply and maintain adequate measures to detect and prevent intrusions into the network
      and resources. Consider intrusion detection (IDS) and prevention (IPS) systems, a management console
      that records all intrusion attempts for analysis, automatic triggering of incident response as defined
      in [EIM2], and security information and event management (SIEM) solutions.
    page: 87
    level0: The organisation applies no measures to protect its (logical) perimeter.
    levels:
      1:
      - id: '1.1'
        text: A firewall acts as the interface between the local and external network.
      - id: '1.2'
        text: >-
          The firewall's configuration is at least basic, and it may not be checked and managed regularly
          and meaningfully.
      2:
      - id: '2.1'
        text: >-
          At least non-automated monitoring is enabled for critical assets listed in the inventory [AM2
          / RM2].
      - id: '2.2'
        text: >-
          Monitoring covers at least: actions of people, objects and entities accessing or using assets;
          events that could disrupt normal operation; asset changes that deviate from the security baseline;
          unexpected assets connecting to the networks; and any other suspicious activity.
      3:
      - id: '3.1'
        text: >-
          Adequate measures to detect and prevent intrusions into the network and resources have been
          established, are applied and are maintained.
      - id: '3.2'
        text: >-
          Intrusion detection (IDS) and intrusion prevention (IPS) systems are implemented and maintained
          to reduce the risk of external intrusion.
      - id: '3.3'
        text: >-
          When anomalous behaviour is detected, the security incident response process is triggered and
          the assets involved are isolated until fully investigated.
      - id: '3.4'
        text: >-
          Asset monitoring capabilities that detect anomalies against normal conditions (e.g. location,
          use) or in asset operation have been established, are applied and are maintained, as required
          by [AM3].
      4:
      - id: '4.1'
        text: >-
          A management console monitors the network and records all intrusion attempts for further analysis.
      - id: '4.2'
        text: >-
          Intrusion detection and prevention processes automatically trigger incident response actions,
          as defined in [EIM2].
      - id: '4.3'
        text: >-
          A wireless intrusion detection system (WIDS) detects unauthorised wireless access points connected
          to the network.
      - id: '4.4'
        text: An IDS in the DMZ analyses information exchanged with the external network.
      - id: '4.5'
        text: >-
          IDS sensors on the external and exposed networks detect attacks earlier using signatures, traffic
          analysis or other mechanisms.
      - id: '4.6'
        text: >-
          Information from the monitoring and logging tools and layers is analysed and used to tune the
          tools, reducing false positives and false negatives.
      - id: '4.7'
        common: R1
        text: >-
          The related documents are reviewed for suitability at least once a year. Any changes follow
          the change management process.
      5:
      - id: '5.1'
        text: A SIEM collects monitoring data from all of the organisation's assets.
      - id: '5.2'
        text: >-
          Rules are configured and notifications and alerts are sent to the appropriate staff when a rule
          fires; rules take common attack methods into account.
      - id: '5.3'
        text: The SIEM operates at least according to the rules and specifications in [AM3].
      - id: '5.4'
        text: A network-based IPS, working with the IDS, blocks specific traffic or behaviour.
      - id: '5.5'
        text: >-
          The IPS, like other network devices in [NS1], is configured to monitor and log all traffic.
      - id: '5.6'
        text: >-
          The IDS is integrated with access control tools so that blocking actions can be triggered immediately
          during an attack.
      - id: '5.7'
        text: >-
          The SIEM notifies appropriately authorised and trained teams when a possible security-related
          event is detected.
      - id: '5.8'
        text: >-
          The SIEM correlates information from different sources (not only IDS/IPS, but also firewalls,
          routers, anti-virus, servers, etc.); where possible, sources are extended to physical monitoring
          and supply chain data.
      - id: '5.9'
        text: >-
          Suitable internal or external staff monitor the tools and data 24x7x365 for the earliest possible
          warning and fastest response.
      - id: '5.10'
        text: >-
          The IDS, IPS and SIEM tools, and the readiness and capability of the staff, are tested regularly.
      - id: '5.11'
        text: >-
          Monitoring needs and protection needs (e.g. encryption) are taken into account in the design
          and deployment of these tools (network position, tool type, rule types, etc.).
      - id: '5.12'
        text: Measures control information leaving the network, as referred to in [NS1].
      - id: '5.13'
        text: >-
          Indicators of Compromise are identified to respond faster and reduce the impact of attacks.
      - id: '5.14'
        common: K1
        text: >-
          The skills, capabilities and knowledge that the authorised roles need to run this process have
          been identified.
      - id: '5.15'
        common: K2
        text: >-
          The organisation ensures that the responsible staff already have this knowledge, or otherwise
          arranges for them to acquire it.
- id: SS
  title: System security
  measures:
  - id: SS1
    title: Malware protection
    objective: Ensure organisational resources are not affected by malicious software and code.
    description: >-
      Establish, apply and maintain adequate measures to protect systems from malware and malicious code
      infections, ensuring the confidentiality, integrity, availability and authenticity of information.
      Cover operating systems, network systems and services, network equipment operating systems, user
      endpoints and mobile devices, and portable media. Anti-malware measures must rely on up-to-date
      data to detect and resolve threats.
    page: 89
    level0: The organisation has no protection against malicious software or code.
    levels:
      1:
      - id: '1.1'
        text: Anti-malware software is installed and used on some endpoint devices.
      2:
      - id: '2.1'
        text: Anti-malware software is installed and used on all endpoint devices.
      - id: '2.2'
        text: It is deployed systematically with central management.
      3:
      - id: '3.1'
        text: >-
          A procedure or policy and measures to protect systems from malware and malicious code have been
          established, are applied and are maintained.
      - id: '3.2'
        text: >-
          Anti-malware measures cover operating systems, network systems and services, network equipment
          operating systems, user endpoints and mobile devices, and portable media.
      - id: '3.3'
        text: Anti-malware measures rely on up-to-date data to detect and resolve threats.
      - id: '3.4'
        text: >-
          The protection software is configured to: (a) scan anything incoming automatically (autoprotect);
          (b) scan and block email attachments containing malicious code or high-risk file types; (c)
          regularly scan storage locations for malicious files; (d) block auto-run from media; (e) notify
          the user when a threat is detected; (f) delete or quarantine threats automatically; (g) update
          both signatures and functionality automatically.
      - id: '3.5'
        text: Protection is applied both at device level and at network level (e.g. firewall, proxy).
      - id: '3.6'
        text: Training covers malware protection, attack techniques, phishing and social engineering.
      4:
      - id: '4.1'
        text: >-
          Automated, centralised systems continuously monitor malware protection on all assets (workstations,
          servers, mobile devices, firewalls, IPS, etc.) and let authorised staff see the protection status
          of every asset regardless of type and operating system; action is taken when an asset stops
          receiving updates.
      - id: '4.2'
        text: >-
          Anti-malware solutions with vulnerability detection and anti-exploitation filters are in place.
      - id: '4.3'
        text: >-
          When a threat is detected, a message appears both locally and centrally and the appropriate
          staff are notified immediately; tools have default actions (e.g. quarantine, delete) and fallback
          combinations if those fail.
      - id: '4.4'
        text: >-
          Tests and exercises check training effectiveness and staff readiness and resilience against
          these threats.
      - id: '4.5'
        text: Anti-tampering protection prevents unauthorised people from disabling the protection.
      - id: '4.6'
        common: R1
        text: >-
          The related documents are reviewed for suitability at least once a year. Any changes follow
          the change management process.
      5:
      - id: '5.1'
        text: An allow-list of permitted software is maintained and enforced.
      - id: '5.2'
        text: >-
          Regular file integrity monitoring detects unauthorised changes and threats in the organisation.
      - id: '5.3'
        text: >-
          Organisational or technical means ensure that assets can securely receive updates and security
          policies even when off the network.
      - id: '5.4'
        text: The effectiveness of anti-malware solutions is tested.
      - id: '5.5'
        text: >-
          Protection against current threats uses detection mechanisms that do not rely on signatures.
      - id: '5.6'
        text: >-
          For critical systems, before new software or a change is introduced, a security analysis is
          carried out (e.g. code analysis and testing for malicious behaviour in a controlled environment).
      - id: '5.7'
        common: K1
        text: >-
          The skills, capabilities and knowledge that the authorised roles need to run this process have
          been identified.
      - id: '5.8'
        common: K2
        text: >-
          The organisation ensures that the responsible staff already have this knowledge, or otherwise
          arranges for them to acquire it.
  - id: SS2
    title: System and device hardening and security baselines
    objective: >-
      Minimise, as far as possible, the attack surface of information systems by reducing their functionality
      and features.
    description: >-
      Establish, apply and maintain a process for hardening systems and devices against defined security
      baselines, to prevent unauthorised access and use. Cover operating systems, applications and other
      installed software; use vendor hardening guides and best practice from technology groups, regulators
      and international frameworks. At least: change default configurations and remove unnecessary default
      accounts, run a single primary function per server, provide only necessary services, protocols and
      daemons, configure security parameters to prevent misuse, and remove unnecessary functionality (scripts,
      drivers, features, subsystems). Consider host-level firewalls.
    page: 90
    level0: The organisation does not identify or apply a minimum security profile for its assets.
    levels:
      1:
      - id: '1.1'
        text: At least basic device configuration is carried out.
      - id: '1.2'
        text: >-
          Security requirements built into devices are applied at least ad hoc and may be incomplete.
      2:
      - id: '2.1'
        text: Basic elements that must be restricted for specific asset categories have been identified.
      - id: '2.2'
        text: They may be applied either at installation or afterwards.
      3:
      - id: '3.1'
        text: >-
          A process for hardening systems and devices against defined security baselines, to prevent unauthorised
          access and use of system resources and services, has been established, is applied and is maintained.
      - id: '3.2'
        text: >-
          Operating systems, applications and other software installed on in-scope devices are covered.
      - id: '3.3'
        text: >-
          Hardening guides from software and hardware vendors, and guidelines and best practice from technology
          groups, regulators and other international frameworks, are considered.
      - id: '3.4'
        text: >-
          At least the following are addressed: default configurations and removal of unnecessary default
          accounts; one primary function per server so that functions of different security levels do
          not share a server; only necessary services, protocols and daemons; security parameters that
          prevent misuse; and removal of unnecessary functionality such as scripts, drivers, features
          and subsystems, in line with [IAM1].
      - id: '3.5'
        text: >-
          Host-level firewalls are considered to prevent malicious code from affecting information stored
          on the endpoint, in line with [NS1].
      - id: '3.6'
        text: Software is installed only by specifically authorised staff.
      4:
      - id: '4.1'
        text: >-
          For each operating system, a baseline image (container, VM, image, etc., depending on deployment)
          holds the most current, stable and secure configuration.
      - id: '4.2'
        text: >-
          The configuration follows the vendor's or other trusted sources' recommendations and is hardened
          to the required level.
      - id: '4.3'
        text: >-
          The principles in [IAM1], [NS1] and [AM1-4] apply. At least the level 3 elements are covered,
          plus: unused ports, diagnostic ports, unwanted protocols, disabling unused accounts, anti-malware,
          and enabling host firewall, IDS and IPS where applicable.
      - id: '4.4'
        text: >-
          Changes to these baselines go through change management [CM1] (for updates and patches, or setting
          changes based on incidents or information from trusted parties); an asset with a problem is
          replaced with a clean build from the baseline.
      - id: '4.5'
        text: >-
          Every asset on the network is uniquely identifiable and listed in the asset inventory in [DS1/RM2].
      - id: '4.6'
        text: >-
          Equivalent procedures and instructions exist for other kinds of software, such as applications
          and databases.
      - id: '4.7'
        common: R1
        text: >-
          The related documents are reviewed for suitability at least once a year. Any changes follow
          the change management process.
      5:
      - id: '5.1'
        text: >-
          An allow-list of permitted software is maintained and enforced for all software recognised as
          supporting business operations.
      - id: '5.2'
        text: >-
          Permitted versions of each piece of software, including operating systems, are identified and
          recorded according to the organisation's objectives and risk.
      - id: '5.3'
        text: >-
          On assets with direct or indirect access to information, peer-to-peer wireless networking and
          wireless peripheral access (including Bluetooth) are disabled, unless technically restricted
          to specific devices authorised by the organisation.
      - id: '5.4'
        text: Previous baselines are kept for history and rollback if needed.
      - id: '5.5'
        text: Baselines are also kept for development and test systems, separate from production ones.
      - id: '5.6'
        text: >-
          The resilience of baselines is checked and tested; weaknesses found are fixed promptly through
          change management.
      - id: '5.7'
        text: >-
          Regular checks confirm that asset configuration and operation comply with recognised hardening
          best practice; actions are taken promptly through change management and/or incident management
          as required.
      - id: '5.8'
        common: K1
        text: >-
          The skills, capabilities and knowledge that the authorised roles need to run this process have
          been identified.
      - id: '5.9'
        common: K2
        text: >-
          The organisation ensures that the responsible staff already have this knowledge, or otherwise
          arranges for them to acquire it.
  - id: SS3
    title: Mobile device security
    objective: Ensure appropriate security of mobile devices that access organisational resources.
    description: >-
      Establish, apply and maintain mobile device security measures to ensure the confidentiality, integrity,
      availability and authenticity of mobile systems staff use to connect to or process organisational
      resources. Consider mobile device management, secure storage and encryption [DS5], strong authentication
      [IAM4] and secure communication and networking [NS4]. Protect devices and their information against
      theft and loss, and consider remote wipe and geolocation.
    page: 92
    level0: The organisation takes no measures to secure mobile devices.
    levels:
      1:
      - id: '1.1'
        text: Some mobile device security measures are applied to some or all devices, at least ad hoc.
      2:
      - id: '2.1'
        text: >-
          Portable and mobile devices are identified in the asset inventory referred to in [DS2/RM2].
      - id: '2.2'
        text: Risks related to portable and mobile devices are identified as required by [RM1/RM3].
      - id: '2.3'
        text: These devices use device-level encryption, in line with [AM5].
      3:
      - id: '3.1'
        text: >-
          Mobile device security measures ensuring the confidentiality, integrity, availability and authenticity
          of mobile systems staff use to connect to or process organisational resources have been established,
          are applied and are maintained.
      - id: '3.2'
        text: >-
          Mobile device management, secure storage and encryption [DS5], strong authentication [IAM4]
          and secure communication and networking [NS4] are considered.
      - id: '3.3'
        text: >-
          Mobile devices and the information on them are adequately protected against theft and loss.
      - id: '3.4'
        text: Changes to devices are made by authorised users following [IAM1].
      4:
      - id: '4.1'
        text: >-
          A mobile device management (MDM) system lets the organisation identify each device, its location
          and assigned user, enforce security policies (data storage, encryption, connectivity, permitted
          software, protocols, services and ports) and perform secure remote wipe when needed.
      - id: '4.2'
        text: This practice complies with applicable personal data protection laws and regulations.
      - id: '4.3'
        text: >-
          Where needed for effective operations, privileged rights are granted remotely with technical
          safeguards (event-based authorisation without exposing privileged passwords to unauthorised
          entities).
      - id: '4.4'
        text: The remote capability determines and tracks geographic location.
      - id: '4.5'
        common: R1
        text: >-
          The related documents are reviewed for suitability at least once a year. Any changes follow
          the change management process.
      5:
      - id: '5.1'
        text: The vendors and devices procured and used have been analysed and identified.
      - id: '5.2'
        text: >-
          Where feasible, vendors are engaged so that devices are delivered with a secure out-of-the-box
          configuration reflecting the security requirements.
      - id: '5.3'
        text: Mobile devices are regularly checked for compliance with the organisation's requirements.
      - id: '5.4'
        text: >-
          Checks and tests determine the effectiveness of the measures; deviations are acted on immediately
          through change management or incident response as required.
      - id: '5.5'
        text: >-
          Every new medium or asset is encrypted automatically where possible, before or when it enters
          the organisation.
      - id: '5.6'
        text: >-
          Where data is erased by software, additional physical measures are used (e.g. degaussing), as
          required by [DS1].
      - id: '5.7'
        common: K1
        text: >-
          The skills, capabilities and knowledge that the authorised roles need to run this process have
          been identified.
      - id: '5.8'
        common: K2
        text: >-
          The organisation ensures that the responsible staff already have this knowledge, or otherwise
          arranges for them to acquire it.
  - id: SS4
    title: Application configuration management
    objective: >-
      Ensure proper management of the applications used to access or process organisational resources.
    description: >-
      Establish, apply and maintain application configuration management to prevent unauthorised or malicious
      installation, configuration or modification of applications and software on organisational assets
      and devices. Consider a central management interface so that all organisational devices are centrally
      managed and configuration and software updates can be pushed to endpoints, with a list of permitted
      or prohibited application types.
    page: 93
    level0: The organisation applies no measures or controls on application installation.
    levels:
      1:
      - id: '1.1'
        text: Some measures control application installation on critical systems such as servers.
      - id: '1.2'
        text: Measures are chosen and applied at least ad hoc.
      2:
      - id: '2.1'
        text: Monitoring is enabled for critical assets listed in the inventory [AM2 / RM2].
      - id: '2.2'
        text: >-
          An access control policy covers all assets and buildings listed in the asset inventory [AM2].
      - id: '2.3'
        text: Not all users can change or install software on critical systems.
      3:
      - id: '3.1'
        text: >-
          Application configuration management measures to prevent unauthorised or malicious installation,
          configuration or modification of applications and software have been established, are applied
          and are maintained.
      - id: '3.2'
        text: >-
          Each software item has an identified owner who, with other technical staff, defines which roles
          need access to it and at what level.
      - id: '3.3'
        text: Changes to devices are made by authorised users following [IAM1].
      4:
      - id: '4.1'
        text: >-
          A central management interface ensures all organisational devices are centrally managed and
          that configuration and software updates can be pushed to endpoints.
      - id: '4.2'
        common: R1
        text: >-
          The related documents are reviewed for suitability at least once a year. Any changes follow
          the change management process.
      5:
      - id: '5.1'
        text: >-
          An allow-list of permitted software, for all software recognised as supporting business operations,
          is maintained and enforced through the central management interface.
      - id: '5.2'
        text: >-
          Permitted versions of each piece of software, including operating systems, are identified and
          recorded according to the organisation's objectives and risk.
      - id: '5.3'
        text: Lists and measures for permitted software components are maintained.
      - id: '5.4'
        text: >-
          Regular checks confirm that configuration and operation comply with recognised hardening best
          practice.
      - id: '5.5'
        text: >-
          Where needed, actions are taken promptly through change management and/or incident management
          as required.
      - id: '5.6'
        common: K1
        text: >-
          The skills, capabilities and knowledge that the authorised roles need to run this process have
          been identified.
      - id: '5.7'
        common: K2
        text: >-
          The organisation ensures that the responsible staff already have this knowledge, or otherwise
          arranges for them to acquire it.
- id: AS
  title: Application security
  measures:
  - id: AS1
    title: Secure software development lifecycle
    objective: >-
      Ensure adequate security measures in the organisation's own software development activities.
    description: >-
      Establish, apply and maintain secure development practices within the software development lifecycle,
      so that security is built in by design. At least: a risk assessment at project start, security testing
      and code review during development, and a security and secure-configuration assessment at delivery.
      Separate development from production environments, and use anonymised test data not linked to confidential
      or sensitive information.
    page: 95
    level0: The organisation takes no measures for secure software development.
    levels:
      1:
      - id: '1.1'
        text: >-
          Some security specifications and tests are set during development, periodically and not necessarily
          systematically.
      2:
      - id: '2.1'
        text: A separate project is created for each software development effort.
      - id: '2.2'
        text: A software development lifecycle (SDLC) management process exists.
      - id: '2.3'
        text: Security requirements are identified in the early lifecycle stages.
      - id: '2.4'
        text: >-
          In the final stages, before production, acceptance tests against quality, functionality and
          security criteria are planned and carried out.
      3:
      - id: '3.1'
        text: >-
          Secure development practices within the software development lifecycle, so that security is
          built in by design, have been established, are applied and are maintained.
      - id: '3.2'
        text: Development environments are separated from the production environment.
      - id: '3.3'
        text: Test data is anonymised and not linked to confidential or sensitive information.
      - id: '3.4'
        text: >-
          When development is outsourced, at least security specifications are given and adequate guarantees,
          assurances and evidence that they are met are required before acceptance or operation.
      - id: '3.6'
        text: >-
          A risk assessment or threat profiling is carried out during software design, and appropriate
          security measures are built in based on the results.
      - id: '3.7'
        text: Software changes are controlled through change management [CM1].
      - id: '3.8'
        text: >-
          Secure development skills and knowledge are recognised as a prerequisite for the relevant positions.
      - id: '3.9'
        text: >-
          Security and privacy by default and by design requirements are included, according to regulations,
          legislation and best practice.
      4:
      - id: '4.1'
        text: >-
          At least a risk assessment at project start, security testing and code review during development,
          and a security and secure-configuration assessment at delivery are carried out.
      - id: '4.2'
        text: The development environment is defined at the start of design.
      - id: '4.3'
        text: It is defined according to the security requirements and intended use of the software.
      - id: '4.4'
        text: >-
          The development environment covers programming language, framework, development, testing and
          code management and storage tools; versions are chosen considering their capabilities and open
          weaknesses from authoritative sources.
      - id: '4.5'
        text: Test results are kept and trigger fixes as required through change management [CM1].
      - id: '4.6'
        text: Duties are fully segregated between development, testing and production operations staff.
      - id: '4.7'
        text: >-
          For third-party software, the organisation checks that the development process meets the requirements
          it would apply itself, and reviews the third party's history (incidents, updates, open vulnerabilities)
          and its vulnerability response processes.
      - id: '4.8'
        text: >-
          Mandatory secure development guidelines exist, specific to each language or environment and
          consistent with international best practice and vendor guidance.
      - id: '4.9'
        text: >-
          Equivalent procedures and instructions exist for other kinds of software, such as applications
          and databases.
      - id: '4.10'
        common: R1
        text: >-
          The related documents are reviewed for suitability at least once a year. Any changes follow
          the change management process.
      5:
      - id: '5.1'
        text: Automated static application security testing tools are part of development.
      - id: '5.2'
        text: >-
          Specific tests run for every development or change, automatically or semi-automatically, with
          suitable tools. For critical systems, before new software or a change is introduced, a security
          analysis is carried out (e.g. code analysis and testing for malicious behaviour in a controlled
          environment).
      - id: '5.3'
        text: >-
          Where feasible, the organisation obtains external review or certification of software security
          from an independent lab before production use.
      - id: '5.4'
        common: K1
        text: >-
          The skills, capabilities and knowledge that the authorised roles need to run this process have
          been identified.
      - id: '5.5'
        common: K2
        text: >-
          The organisation ensures that the responsible staff already have this knowledge, or otherwise
          arranges for them to acquire it.
- id: HRS
  title: Human resources security
  measures:
  - id: HRS1
    title: Employment lifecycle
    objective: >-
      Apply adequate measures so that staff working for the organisation who have access to its resources
      support its information security policy and objectives.
    description: >-
      Draw up, apply and maintain a plan so that information security is built into the whole employment
      lifecycle (before, during and after employment) and make every reasonable effort for employees to
      understand their information security responsibilities. The plan includes measures in each phase,
      e.g. pre-employment background checks, training and awareness, adequate clauses in employment contracts,
      an acceptable use policy, return of devices holding critical information, and removal of access
      to systems and applications according to the identity lifecycle in [IAM7].
    source: 27002, PNNL
    page: 97
    level0: >-
      The organisation takes no measures to build information security into the employment lifecycle.
    levels:
      1:
      - id: '1.1'
        text: >-
          Mandatory academic and professional qualifications are verified by obtaining and checking the
          relevant documents.
      - id: '1.2'
        text: Check results involving personal data are protected at the highest classification level.
      2:
      - id: '2.1'
        text: >-
          Background checks are carried out for key staff and external contractors, when needed and permitted
          by law.
      - id: '2.2'
        text: References confirming the characteristics declared by the candidate are requested.
      - id: '2.3'
        text: A basic background check procedure for candidate employees has been established.
      3:
      - id: '3.1'
        text: >-
          A procedure that builds information security into the whole employment lifecycle, and makes
          every reasonable effort for employees to understand their information security responsibilities,
          has been established, is applied and is maintained.
      - id: '3.2'
        text: >-
          The procedure includes appropriate information security measures in each employment phase, e.g.
          pre-employment background checks, training and awareness.
      4:
      - id: '4.1'
        text: >-
          A screening procedure details the criteria and limits of verification checks, e.g. who is eligible
          to screen people, and how, when and why checks are carried out.
      - id: '4.2'
        common: R1
        text: >-
          The related documents are reviewed for suitability at least once a year. Any changes follow
          the change management process.
      5:
      - id: '5.1'
        text: A third party carries out background checks in line with the relevant legislation.
      - id: '5.2'
        common: K1
        text: >-
          The skills, capabilities and knowledge that the authorised roles need to run this process have
          been identified.
      - id: '5.3'
        common: K2
        text: >-
          The organisation ensures that the responsible staff already have this knowledge, or otherwise
          arranges for them to acquire it.
  - id: HRS2
    title: Employee monitoring
    objective: >-
      Ensure staff working for the organisation comply with the information security policy and meet their
      security responsibilities throughout their employment.
    description: >-
      Establish, apply and maintain a plan to monitor employees' compliance with their information security
      obligations and responsibilities throughout their employment.
    page: 97
    level0: >-
      The organisation does not monitor employees' compliance with their information security obligations
      and responsibilities during employment.
    levels:
      1:
      - id: '1.1'
        text: >-
          Non-compliance by staff with policies, procedures or measures can be identified during security
          incident investigations.
      2:
      - id: '2.1'
        text: Roles and responsibilities are recorded and assigned to the corresponding staff.
      - id: '2.2'
        text: Staff have been informed of their obligations.
      - id: '2.3'
        text: Staff compliance with their obligations is checked at least ad hoc.
      3:
      - id: '3.1'
        text: >-
          A procedure to monitor employees' compliance with their information security obligations and
          responsibilities throughout their employment has been established, is applied and is maintained.
      - id: '3.2'
        text: Checks include tests of staff training effectiveness, as referred to in [DS5] and [SS1].
      4:
      - id: '4.1'
        text: >-
          Internal and external audit plans include checks of staff compliance with the organisation's
          security policies, procedures and measures.
      - id: '4.2'
        text: >-
          Audit data is analysed to draw conclusions on staff compliance; any deviation triggers the security
          incident response process [EIM1] and the disciplinary process [HRS3].
      - id: '4.3'
        common: R1
        text: >-
          The related documents are reviewed for suitability at least once a year. Any changes follow
          the change management process.
      5:
      - id: '5.1'
        text: >-
          Automated measures check staff compliance with security policies, procedures and measures where
          feasible (e.g. MDM enforcing policies on mobile devices, DLP controlling information handling,
          centralised and analysed activity logs).
      - id: '5.2'
        text: >-
          Data from automated tools and other checks is analysed to draw conclusions on staff compliance;
          any deviation triggers the security incident response process [EIM1] and the disciplinary process
          [HRS3].
      - id: '5.3'
        text: >-
          Evidence of staff compliance with procedures and policies is collected in line with applicable
          legislation.
      - id: '5.4'
        common: K1
        text: >-
          The skills, capabilities and knowledge that the authorised roles need to run this process have
          been identified.
      - id: '5.5'
        common: K2
        text: >-
          The organisation ensures that the responsible staff already have this knowledge, or otherwise
          arranges for them to acquire it.
  - id: HRS3
    title: Disciplinary measures and enforcement
    objective: >-
      Ensure staff working for the organisation are accountable for intentional or unintentional activities
      that affect its information security objectives.
    description: >-
      Establish, apply and maintain disciplinary measures so that staff comply with their information
      security obligations and action is taken when they are breached. Consider a formal sanctions process
      for staff who do not comply. Non-compliance is detected through employee monitoring [HRS2].
    source: '27002'
    page: 98
    level0: >-
      The organisation has no measures or sanctions process to ensure staff comply with their information
      security obligations or to act on breaches.
    levels:
      1:
      - id: '1.1'
        text: >-
          In cases of information security misconduct, the staff involved are removed, at least ad hoc.
      2:
      - id: '2.1'
        text: >-
          A disciplinary process for action against employees who have breached information security has
          been established.
      3:
      - id: '3.1'
        text: >-
          Disciplinary measures, through a disciplinary process, have been established, are applied and
          are maintained to ensure staff comply with their information security obligations and to act
          on breaches.
      - id: '3.2'
        text: >-
          The disciplinary process ensures correct and fair treatment of employees suspected of information
          security breaches.
      - id: '3.3'
        text: >-
          The process provides a graduated response considering the nature and severity of the breach
          and its business impact, whether it is a first or repeat offence, whether the offender was properly
          trained, business contracts and other factors as required.
      - id: '3.4'
        text: The disciplinary process has been communicated to all staff.
      - id: '3.5'
        text: >-
          A formal sanctions process for staff who do not comply with their information security obligations
          has been considered.
      - id: '3.6'
        text: >-
          Non-compliance with information security obligations is detected through employee monitoring
          [HRS2].
      4:
      - id: '4.1'
        text: >-
          A formal sanctions process for staff who do not comply with their information security obligations
          has been established.
      - id: '4.2'
        text: >-
          Non-compliance with information security obligations is detected through employee monitoring
          [HRS2].
      - id: '4.3'
        text: The sanctions process has been communicated to all staff.
      - id: '4.4'
        common: R1
        text: >-
          The related documents are reviewed for suitability at least once a year. Any changes follow
          the change management process.
      5:
      - id: '5.1'
        text: >-
          Evidence of staff compliance with procedures and policies is collected in line with applicable
          legislation.
      - id: '5.2'
        text: Monitoring data from [HRS2] triggers the disciplinary process.
      - id: '5.3'
        common: K1
        text: >-
          The skills, capabilities and knowledge that the authorised roles need to run this process have
          been identified.
      - id: '5.4'
        common: K2
        text: >-
          The organisation ensures that the responsible staff already have this knowledge, or otherwise
          arranges for them to acquire it.
  - id: HRS4
    title: External personnel
    objective: >-
      Ensure external personnel working for the organisation comply with its information security policy
      and objectives.
    description: >-
      Establish, apply and maintain information security measures for the external workforce, e.g. contractors,
      so that information exchanged with external personnel is properly protected.
    source: '27002'
    page: 99
    level0: The organisation has no information security measures for its external workforce.
    levels:
      1:
      - id: '1.1'
        text: >-
          External personnel are told about basic information security measures, which may not be reflected
          in contracts.
      2:
      - id: '2.1'
        text: >-
          Contracts with key external parties, but not necessarily all, include information security measures.
      - id: '2.2'
        text: >-
          Contracts state the contractor's legal responsibilities and rights, e.g. regarding copyright
          or data protection law.
      3:
      - id: '3.1'
        text: >-
          Information security measures for the external workforce, protecting information exchanged with
          external personnel, have been established, are applied and are maintained.
      - id: '3.2'
        text: >-
          Contracts include an annex informing external personnel of the organisation's information security
          policy and their obligation to comply with it.
      - id: '3.3'
        text: >-
          The organisation has a contract with each external worker that includes information security
          measures.
      - id: '3.4'
        text: >-
          Contracts clearly state that all contractors given access to confidential information sign a
          confidentiality or non-disclosure agreement before accessing information processing facilities;
          the NDA may be part of the contract.
      - id: '3.5'
        text: >-
          The contract covers responsibilities for information classification and for managing organisational
          assets related to information, information processing facilities and information services handled
          by the contractor, and the contractor's responsibilities for information received from other
          companies or external parties.
      4:
      - id: '4.1'
        text: A specific procedure for the external workforce has been established.
      - id: '4.2'
        text: >-
          The contract states the actions to be taken if the contractor ignores the organisation's security
          requirements.
      - id: '4.3'
        text: >-
          Contracts include an annex informing external personnel of the organisation's security objectives
          and their obligation to meet them.
      - id: '4.4'
        common: R1
        text: >-
          The related documents are reviewed for suitability at least once a year. Any changes follow
          the change management process.
      5:
      - id: '5.1'
        text: >-
          A code of conduct states the contractor's information security responsibilities regarding confidentiality,
          data protection, ethics, appropriate use of the organisation's equipment and facilities, and
          the reputable practices the organisation expects; an external party the contractor is linked
          to may be asked to enter into contractual arrangements on the contractor's behalf.
      - id: '5.2'
        common: K1
        text: >-
          The skills, capabilities and knowledge that the authorised roles need to run this process have
          been identified.
      - id: '5.3'
        common: K2
        text: >-
          The organisation ensures that the responsible staff already have this knowledge, or otherwise
          arranges for them to acquire it.
  - id: HRS5
    title: Insider threat protection
    objective: >-
      Protect against network and information security threats originating inside the organisation.
    description: >-
      Establish, apply and maintain appropriate measures to prevent, detect and monitor insider attacks
      arising from ignorance, negligence, or malicious or professional intent. Train and raise awareness
      among employees [TA2], screen candidates adequately [HRS1] and monitor employees [HRS2] to reduce
      the likelihood of insider attacks.
    page: 100
    level0: The organisation takes no measures to protect against insider threats.
    levels:
      1:
      - id: '1.1'
        text: >-
          Staff non-compliance with policies, procedures or measures found during an incident investigation
          is identified, and measures are taken to respond to that incident.
      2:
      - id: '2.1'
        text: >-
          A defined method (process) is followed to identify risks originating inside the organisation.
      - id: '2.3'
        text: Some risks related to insider threats have been identified.
      3:
      - id: '3.1'
        text: >-
          Appropriate measures to prevent, detect and monitor insider attacks arising from ignorance,
          negligence, or malicious or professional intent have been established, are applied and are maintained.
      - id: '3.2'
        text: >-
          Employees are trained and made aware of information security practices [TA2], candidates are
          adequately screened [HRS1], and employees are monitored [HRS2], to reduce the likelihood of
          insider attacks.
      4:
      - id: '4.1'
        text: >-
          Risks cover all categories of risk sources, whether or not they are under the organisation's
          control.
      - id: '4.2'
        text: At least risk sources related to the human factor have been identified.
      - id: '4.3'
        text: >-
          Threats such as remote spying, theft of equipment, theft of information or media, retrieval
          of recycled or discarded media, data input from untrustworthy sources, incorrect use of devices,
          illegal processing of data, sending or distributing malware and abuse of rights are included.
      - id: '4.4'
        text: >-
          Weaknesses such as insufficient staff resources, staff acting with a conflict of interest or
          without segregation of duties, lack of monitoring and supervision, partly defined policies,
          and inability to enforce policies and procedures technically are included.
      - id: '4.5'
        common: R1
        text: >-
          The related documents are reviewed for suitability at least once a year. Any changes follow
          the change management process.
      5:
      - id: '5.1'
        text: >-
          Data from staff monitoring [HRS2] and from incident management [EIM1] feeds risk management:
          existing risks are updated, or new ones are added following [RM1-RM4]. The reasons a risk was
          missed or incompletely identified are diagnosed, and if a systematic gap is found, risk management
          is repeated in whole or for the affected part.
      - id: '5.2'
        common: K1
        text: >-
          The skills, capabilities and knowledge that the authorised roles need to run this process have
          been identified.
      - id: '5.3'
        common: K2
        text: >-
          The organisation ensures that the responsible staff already have this knowledge, or otherwise
          arranges for them to acquire it.
  - id: HRS6
    title: Employment agreements and acceptable use
    objective: >-
      Ensure responsibilities for information security and acceptable use of assets are included in employment
      agreements and onboarding, for accountability and awareness.
    description: >-
      Establish, apply and maintain an acceptable use policy defining the acceptable uses of information
      systems provided to staff (e.g. computers and mobile devices), so that staff know what is expected
      of them. Consider checking awareness of the policy, and conclude employment agreements that clearly
      state the employee's information security obligations and responsibilities.
    page: 101
    level0: >-
      The organisation has no acceptable use policy defining acceptable uses of the information systems
      provided to staff.
    levels:
      1:
      - id: '1.1'
        text: >-
          Staff are told about acceptable use of resources and/or information, not necessarily in writing
          or systematically.
      2:
      - id: '2.1'
        text: >-
          Basic rules for acceptable use of information and assets related to critical information have
          been defined and are applied.
      - id: '2.2'
        text: >-
          They include: (a) restrictions on internet browsing; (b) use of computers and other resources
          assigned for company work; (c) a ban on personal use of computers and other resources assigned
          for company work.
      3:
      - id: '3.1'
        text: >-
          An acceptable use policy defining acceptable uses of the information systems provided to staff,
          so that staff know what is expected of them, has been established, is applied and is maintained.
      - id: '3.2'
        text: >-
          Employment agreements clearly state the employee's information security obligations and responsibilities.
      - id: '3.3'
        text: >-
          The acceptable use policy is communicated to all staff and accepted through the employment agreements.
      - id: '3.4'
        text: Staff have been trained on the acceptable use policy.
      - id: '3.5'
        text: >-
          The policy states that: (a) organisational assets are used only by authorised persons; (b) passwords
          or other authentication means are not shared with anyone; (c) staff apply measures according
          to the information's criticality as specified in [DS2]; (d) only licensed software is used;
          (e) security incidents must be reported with relevant details; (f) acceptable use of removable
          media (including storage in transit and transport) is described.
      - id: '3.6'
        text: >-
          The policy describes expected and unacceptable behaviour in the organisation and in handling
          its information and resources, and the monitoring and logging the organisation has in place.
      4:
      - id: '4.1'
        text: Awareness of the acceptable use policy is checked through annual staff questionnaires.
      - id: '4.2'
        text: >-
          The rules and policies apply both to the organisation's employees and to people providing services
          through third parties or who could affect its security.
      - id: '4.3'
        text: >-
          Policies cover: (a) web access and filtering; (b) mobile computing; (c) removable media; (d)
          teleworking; (e) access control per classification level, as in [AM1] and [DS2]; (f) instructions
          on maintenance and storage of resources by staff according to role; (g) secure erasure and disposal.
      - id: '4.4'
        common: R1
        text: >-
          The related documents are reviewed for suitability at least once a year. Any changes follow
          the change management process.
      5:
      - id: '5.1'
        text: >-
          Technical measures show staff the acceptable use guidelines each time they access the organisation's
          systems.
      - id: '5.2'
        text: >-
          Each time, staff must actively confirm they have read the guidelines, and the time and location
          of the confirmation are recorded.
      - id: '5.3'
        text: >-
          These actions and guidelines comply with applicable legislation, especially on personal data.
      - id: '5.4'
        na: cloud
        text: >-
          Where cloud services are used, the guidelines and policies also apply to those resources, both
          for staff and for the cloud provider (the latter through contracts).
      - id: '5.5'
        common: K1
        text: >-
          The skills, capabilities and knowledge that the authorised roles need to run this process have
          been identified.
      - id: '5.6'
        common: K2
        text: >-
          The organisation ensures that the responsible staff already have this knowledge, or otherwise
          arranges for them to acquire it.
- id: PS
  title: Physical security
  measures:
  - id: PS1
    title: Environmental measures
    objective: >-
      Ensure adequate measures protect the organisation from the effects of natural disasters such as
      floods, earthquakes and fires.
    description: >-
      Establish, apply and maintain appropriate measures to protect the organisation from the effects
      of natural disasters such as floods, earthquakes and fires. Consider geographic location when building
      network infrastructure, and ensure critical infrastructure elements and systems are geographically
      dispersed.
    source: ENISA
    page: 103
    level0: >-
      The organisation takes no measures to protect itself from the effects of natural disasters.
    levels:
      1:
      - id: '1.1'
        text: >-
          At least some basic measures have been taken to protect the organisation from the effects of
          natural disasters such as floods, earthquakes and fires.
      - id: '1.2'
        text: >-
          Appropriate fire protection planning for the building has been drawn up and implemented, as
          required by fire safety regulations.
      2:
      - id: '2.1'
        text: Evacuation drills are carried out regularly for relevant risk scenarios.
      - id: '2.2'
        text: >-
          Drill results are taken into account when designing the business continuity and disaster recovery
          plans.
      3:
      - id: '3.1'
        text: >-
          Appropriate measures to protect the organisation from the effects of natural disasters such
          as floods, earthquakes and fires have been established, are applied and are maintained.
      - id: '3.2'
        text: >-
          Geographic location is considered when building network infrastructure, and critical infrastructure
          elements and systems are geographically dispersed.
      - id: '3.3'
        text: >-
          Essential utilities (e.g. power, network) and critical third-party connections, where needed,
          have at least 2 different routes and, where possible, different providers.
      - id: '3.4'
        text: Drawings showing these routes have been recorded and are updated as required.
      4:
      - id: '4.1'
        text: >-
          The building(s) housing, operating or serving some or all of the organisation's critical functions
          and staff were designed and built according to the standards, codes of practice and seismic
          code in force at the time of construction.
      - id: '4.2'
        text: The building(s) hold a valid permit for their use.
      - id: '4.3'
        text: >-
          A risk assessment of environmental hazards (e.g. earthquake, flood, fire) has been carried out.
      - id: '4.4'
        text: >-
          For these hazards, basic preventive measures both outside and inside the building, as referred
          to in [PS5], have been analysed and planned, considering historical data and available studies
          for the area. (Specific measures must be taken if the building(s) are in areas identified as
          Areas of Potential Significant Flood Risk under Directive 2007/60/EC.)
      - id: '4.5'
        text: >-
          A policy on physical security measures and environmental controls has been established, is applied
          and is maintained.
      - id: '4.6'
        text: A flood alert system is installed in the computer room.
      - id: '4.7'
        text: An automatic fire detection and suppression system is installed in the computer room.
      - id: '4.8'
        text: A plan for responding to these hazards has been drawn up.
      - id: '4.9'
        text: A study of the environmental measures implemented has been carried out.
      - id: '4.10'
        common: R1
        text: >-
          The related documents are reviewed for suitability at least once a year. Any changes follow
          the change management process.
      5:
      - id: '5.1'
        text: >-
          Buildings are regularly inspected for structural adequacy by suitably authorised and experienced
          staff; where deviations are found, appropriate corrective measures are implemented.
      - id: '5.2'
        text: >-
          Appropriate links and contacts are kept with reliable sources (e.g. national authorities, interest
          groups, observatories) to receive valid and timely information on environmental hazards.
      - id: '5.3'
        text: >-
          Information received is assessed to keep the organisation at the highest readiness against these
          hazards. The organisation keeps structured crisis response plans according to [BCR1-4].
      - id: '5.4'
        text: >-
          The plans are tested regularly with the participation of the relevant authorities and national
          response teams.
      - id: '5.5'
        common: K1
        text: >-
          The skills, capabilities and knowledge that the authorised roles need to run this process have
          been identified.
      - id: '5.6'
        common: K2
        text: >-
          The organisation ensures that the responsible staff already have this knowledge, or otherwise
          arranges for them to acquire it.
  - id: PS2
    title: Perimeter access control
    objective: Secure the organisation's physical perimeter and prevent unauthorised access.
    description: >-
      Establish, apply and maintain a physical security perimeter to protect information processing facilities.
      Put in place appropriate perimeter access controls using physical barriers such as fences, doors
      and walls. Require employees and visitors to prove their identity to security guards to enter (parts
      of) the organisation. Consider CCTV cameras to detect intruders at the organisation's boundaries.
    source: NIST
    page: 104
    level0: The organisation takes no measures to secure its physical perimeter.
    levels:
      1:
      - id: '1.1'
        text: >-
          At least some basic perimeter security measures are kept, such as locking all main entrances
          and checking people entering the organisation, but without recording them.
      2:
      - id: '2.1'
        text: A list of people entering the organisation is kept at the facility entrance.
      - id: '2.2'
        text: A camera is installed only at the main entrance.
      3:
      - id: '3.1'
        text: >-
          Measures to secure the organisation's perimeter, protecting information processing facilities,
          have been established, are applied and are maintained.
      - id: '3.2'
        text: >-
          Appropriate perimeter access controls using physical barriers such as fences, doors and walls
          have been put in place.
      - id: '3.3'
        text: An alarm system is installed at the facilities.
      - id: '3.4'
        text: An access control system is installed for staff entry to the facilities.
      - id: '3.5'
        text: Visitors are escorted throughout their presence at the facilities.
      4:
      - id: '4.1'
        text: >-
          A procedure and policy on perimeter security and facility entry have been established, are applied
          and are maintained.
      - id: '4.2'
        text: A CCTV system is installed to detect intruders at the organisation's boundaries.
      - id: '4.3'
        text: Camera recording logs are kept in line with personal data legislation.
      - id: '4.4'
        text: Access control system logs are kept, and alerts notify of any breaches.
      - id: '4.5'
        text: >-
          The alarm and CCTV systems are monitored, and notifications are received when any movement occurs.
      - id: '4.6'
        text: >-
          Security checks are carried out at the facility's physical boundary for unauthorised access
          and removal of information.
      - id: '4.7'
        text: >-
          Staff rights and access to the alarm and access control systems are reviewed at least annually.
      - id: '4.8'
        common: R1
        text: >-
          The related documents are reviewed for suitability at least once a year. Any changes follow
          the change management process.
      5:
      - id: '5.1'
        text: >-
          A contract with a security company covers guarding of the facilities and 24-hour CCTV monitoring.
      - id: '5.2'
        text: >-
          Annual penetration tests include unannounced attempts to bypass or circumvent security controls
          at the facility's physical access points.
      - id: '5.3'
        text: >-
          Entry to the facilities has 2 levels of control: the first at the facility perimeter and the
          second at the building entrance.
      - id: '5.4'
        common: K1
        text: >-
          The skills, capabilities and knowledge that the authorised roles need to run this process have
          been identified.
      - id: '5.5'
        common: K2
        text: >-
          The organisation ensures that the responsible staff already have this knowledge, or otherwise
          arranges for them to acquire it.
  - id: PS3
    title: Internal access control
    objective: >-
      Control access to internal work areas and facilities so that physical access is limited on a need
      basis.
    description: >-
      Establish, apply and maintain internal access measures, aligned with the roles described in [IAM1],
      so that only staff with a legitimate interest can access (specific parts of) the organisation, e.g.
      through dedicated badge readers for access to a part of the organisation.
    source: 27002, NIST
    page: 105
    level0: The organisation takes no internal access measures.
    levels:
      1:
      - id: '1.1'
        text: People entering and leaving the facilities are checked, but may not be recorded.
      2:
      - id: '2.1'
        text: A list of people who have entered the organisation is kept at the facility entrance.
      3:
      - id: '3.1'
        text: >-
          Internal access measures, aligned with the roles described in [IAM1], so that only staff with
          a legitimate interest can access (specific parts of) the organisation, have been established,
          are applied and are maintained.
      - id: '3.2'
        text: An access control system is installed and used for staff entry to the facilities.
      - id: '3.3'
        text: Access to individual areas is defined according to each employee's role.
      - id: '3.4'
        text: >-
          Visitors receive cards that open only the main entrance, and are always escorted during their
          stay.
      4:
      - id: '4.1'
        text: >-
          A procedure and policy on internal access control to work areas have been established, are applied
          and are maintained.
      - id: '4.2'
        text: Security checks are carried out at the facilities for unauthorised access.
      - id: '4.3'
        text: Staff access and rights in the access control system are reviewed at least once a year.
      - id: '4.4'
        text: Access control system logs are kept, and alerts notify of any breaches.
      - id: '4.5'
        common: R1
        text: >-
          The related documents are reviewed for suitability at least once a year. Any changes follow
          the change management process.
      5:
      - id: '5.1'
        text: >-
          Entry to the facilities has 2 levels of control: the first at the facility perimeter and the
          second at the building entrance.
      - id: '5.2'
        text: >-
          Annual penetration tests include unannounced attempts to bypass or circumvent security controls
          at the facility's physical access points.
      - id: '5.3'
        text: Automated mechanisms support review of visitor and staff access records.
      - id: '5.4'
        common: K1
        text: >-
          The skills, capabilities and knowledge that the authorised roles need to run this process have
          been identified.
      - id: '5.5'
        common: K2
        text: >-
          The organisation ensures that the responsible staff already have this knowledge, or otherwise
          arranges for them to acquire it.
  - id: PS4
    title: Cabling, equipment and facility security
    objective: >-
      Ensure cabling and equipment supporting information processing are physically protected against
      interference, interception or damage.
    description: >-
      Establish, apply and maintain appropriate measures to protect cabling and other equipment against
      interference, interception or damage that would disrupt the organisation's services. Ensure power
      cables supplying critical infrastructure are properly protected, and train employees under [TA2]
      on the importance of equipment supporting information processing. Protect physical access to logical
      networks to prevent unauthorised physical access to logical equipment and the network; consider
      network access measures as defined in [NS5]. Ensure the physical integrity and regular maintenance
      of facilities housing network equipment, and the correct operation of security measures.
    source: 27002, NIST
    page: 106
    level0: >-
      The organisation applies no measures for cabling security or physical access to logical networks.
    levels:
      1:
      - id: '1.1'
        text: >-
          Power and telecommunications cables carrying data or supporting information services are protected
          against interception, interference or damage.
      - id: '1.2'
        text: >-
          Equipment is maintained according to the vendor's recommended service intervals and specifications.
      2:
      - id: '2.1'
        text: >-
          Power and telecommunications lines into information processing facilities are underground where
          possible.
      - id: '2.2'
        text: Only authorised maintenance staff carry out repairs and service equipment.
      3:
      - id: '3.1'
        text: >-
          Appropriate measures to protect cabling and other equipment against interference, interception
          or damage that would disrupt the organisation's services have been established, are applied
          and are maintained.
      - id: '3.2'
        text: >-
          Power cables supplying critical infrastructure are properly protected, and employees are trained
          under [TA2] on the importance of equipment supporting information processing.
      - id: '3.3'
        text: Power cables are separated from communication cables to prevent interference.
      - id: '3.4'
        text: >-
          Physical access to logical networks is protected to prevent unauthorised physical access to
          logical equipment and the network.
      - id: '3.5'
        text: >-
          Areas giving possible access to patch panels or any network equipment are secured (e.g. lockable
          racks).
      - id: '3.6'
        text: Network access measures as defined in [NS5] are considered.
      - id: '3.7'
        text: >-
          The physical integrity and regular maintenance of facilities housing network equipment, and
          the correct operation of security measures, are ensured.
      - id: '3.8'
        text: Records are kept of all faults and all preventive and corrective maintenance.
      - id: '3.9'
        text: >-
          Remote maintenance of organisational assets is approved, logged and performed in a way that
          prevents unauthorised access.
      - id: '3.10'
        text: >-
          Controls apply when equipment is scheduled for maintenance, considering whether it is performed
          by staff on-site or off-site; where needed, confidential information is erased from the equipment.
      4:
      - id: '4.1'
        text: >-
          A procedure and policy on cabling, equipment and facility security have been established, are
          applied and are maintained.
      - id: '4.2'
        text: Armoured conduit protects communication cables.
      - id: '4.3'
        text: >-
          Technical sweeps and physical inspections look for unauthorised devices attached to cables.
      - id: '4.4'
        text: Before equipment is put back into service, it is checked for tampering and malfunction.
      - id: '4.5'
        text: Suppliers meet all requirements imposed by insurance policies.
      - id: '4.6'
        common: R1
        text: >-
          The related documents are reviewed for suitability at least once a year. Any changes follow
          the change management process.
      5:
      - id: '5.1'
        text: Electromagnetic shielding protects cables.
      - id: '5.2'
        text: Integrity verification mechanisms confirm hardware integrity.
      - id: '5.3'
        text: >-
          During maintenance, engineers must wear an electrostatic discharge (ESD) wrist strap to prevent
          static build-up near sensitive electronics.
      - id: '5.4'
        common: K1
        text: >-
          The skills, capabilities and knowledge that the authorised roles need to run this process have
          been identified.
      - id: '5.5'
        common: K2
        text: >-
          The organisation ensures that the responsible staff already have this knowledge, or otherwise
          arranges for them to acquire it.
  - id: PS5
    title: Internal environmental measures
    objective: >-
      Ensure the organisation's internal areas and facilities are protected against physical damage.
    description: >-
      Establish, apply and maintain physical security and protection measures to prevent physical damage
      to the organisation's internal areas and facilities. When applying internal environmental measures,
      consider risks from fire and temperature, humidity, power, water use and other factors that could
      harm the physical security of assets. Consider fire suppression, humidity control and other measures
      suited to the characteristics of internal spaces such as data centres or other areas housing information
      processing equipment.
    page: 107
    level0: >-
      The organisation has taken no measures to protect its internal areas and facilities against physical
      damage.
    levels:
      1:
      - id: '1.1'
        text: >-
          The organisation's critical assets, as identified in [DS2] and [AM2], are housed in separate
          areas with access control, even if access is not recorded.
      - id: '1.2'
        text: >-
          At least some basic measures protect the area, the equipment and the information housed there
          from the effects of natural disasters such as floods, earthquakes and fires (e.g. at least one
          fire extinguisher outside the area; equipment placed so it cannot easily move in an earthquake).
      2:
      - id: '2.1'
        text: Temperature and humidity in areas housing critical assets are monitored, even manually.
      - id: '2.2'
        text: >-
          At least one person in the organisation is responsible for monitoring these values and informing
          the responsible staff if they fall outside predefined acceptable limits.
      - id: '2.3'
        text: >-
          Appropriate measures (at least one air-conditioning unit) keep a stable temperature in these
          areas.
      3:
      - id: '3.1'
        text: >-
          Physical security and protection measures to prevent physical damage to the organisation's internal
          areas and facilities have been established, are applied and are maintained.
      - id: '3.2'
        text: >-
          When applying internal environmental measures, the organisation has considered risks from fire
          and temperature, humidity, power, water use and other factors that could harm the physical security
          of assets.
      - id: '3.3'
        text: >-
          Fire suppression, humidity control and other measures suited to the characteristics of internal
          spaces, such as data centres or other areas housing information processing equipment, are considered.
      - id: '3.4'
        text: Temperature and humidity in areas housing critical assets are monitored automatically.
      - id: '3.5'
        text: >-
          Rules have been set to notify the appropriate staff when values fall outside predefined acceptable
          limits.
      - id: '3.6'
        text: >-
          Minimum measures include: (a) automatic fire detection; (b) all equipment mounted in racks with
          controlled access; (c) a recorded floor plan identifying equipment locations; (d) signage, loudspeaker
          and evacuation button, and suitable emergency lighting; (e) raised floor; (f) loading and unloading,
          and entry of unauthorised staff, prohibited in these areas; (g) appropriate fire detection where
          required (e.g. indoor areas) and fire suppression for generator and fuel storage areas.
      4:
      - id: '4.1'
        text: >-
          A plan and procedure for segregating and classifying information processing areas have been
          created.
      - id: '4.2'
        text: >-
          Area classification considers the criticality of processes run in them, based on the Business
          Impact Analysis [BCR1], the criticality and sensitivity of information processed as described
          in [DS2], and the results of risk management.
      - id: '4.3'
        text: The measures applied for each area category have been recorded.
      - id: '4.4'
        text: >-
          For areas in the highest category, at minimum: (a) automatic fire suppression with a suitable
          agent that minimises impact on people, equipment and information; (b) duplicate (standby) systems
          to keep a stable temperature; (c) redundant power and network connections; (d) at least 3 kinds
          of power supply (grid, UPS, generator); (e) physical protection of cables against rodents and
          other factors; (f) dedicated power strips for each equipment rack, connected to at least 2 separate
          power sources; (g) staff authorised to monitor, maintain, operate and respond immediately regarding
          physical protection measures; (h) a cable identification and labelling system; (i) a study and
          design of the room and floor for maximum load and its distribution; (j) when the generator starts,
          power is also supplied to temperature control, lighting and access control systems and to all
          network points needed for operational connectivity and delivery of critical services; (k) a
          procedure for regular maintenance, checking and testing of power supply elements; (l) generator
          start-up time and method measured and built into planning for UPS capacity and automation; (m)
          an automated bypass system to isolate power elements during maintenance, replacement of components
          or batteries, or failure; (n) a procedure for regular maintenance, checking and testing of fire
          protection and temperature control elements; (o) suitable signage and detectors showing that
          a gas unsafe for people has been released in the area; (p) adequate earthing of the whole installation
          or equipment. All of the above also apply when the organisation uses third-party premises and
          facilities to host the equipment.
      - id: '4.5'
        common: R1
        text: >-
          The related documents are reviewed for suitability at least once a year. Any changes follow
          the change management process.
      5:
      - id: '5.1'
        text: >-
          Storage and operating facilities follow international resilience best practice, e.g. at least
          Uptime Institute Tier III.
      - id: '5.2'
        text: >-
          Tests assess whether this equipment exists and can operate correctly and effectively. Problems
          found are fixed immediately and recorded according to change management [CM1].
      - id: '5.3'
        text: >-
          The measures applied for each area category have been recorded. For areas in the highest category,
          at minimum: (a) specific design for maximum thermal efficiency and temperature stability (hot
          and cold aisles, etc.); (b) fibre-optic network connections for the core network and critical
          systems; (c) blanking elements in unused racks, so access control is kept without affecting
          hot and cold aisle operation and efficiency; (d) automatic monitoring of rack contents, power
          consumption and status; (e) machines configured to shut down gracefully on imminent total power
          loss, with UPS units carrying the full load for at least 30 minutes; (f) a battery monitoring
          system for UPS units that monitors, records and analyses battery performance and voltages; (g)
          suitable equipment for staff outside these areas, such as masks, respirators, torches and fire
          blankets; (h) access, humidity and temperature protection for the room holding the UPS units
          and batteries; (i) a lightning protection system; (j) a BMS for overall monitoring and operation
          of mechanical, electrical and fire safety measures.
      - id: '5.4'
        common: K1
        text: >-
          The skills, capabilities and knowledge that the authorised roles need to run this process have
          been identified.
      - id: '5.5'
        common: K2
        text: >-
          The organisation ensures that the responsible staff already have this knowledge, or otherwise
          arranges for them to acquire it.
- id: EIM
  title: Event and incident management
  measures:
  - id: EIM1
    title: Event and incident readiness and detection
    objective: >-
      Ensure the organisation can detect events and incidents that may threaten its information security
      objectives and trigger the corresponding incident response processes.
    description: >-
      Establish, apply and maintain an event and incident management and response plan so that the organisation
      is ready to react to a serious information security event or incident. Consider aligning event and
      incident response processes with general monitoring capabilities and specific security monitoring
      functions, such as the intrusion detection and prevention services described in [NS7].
    source: NIST
    page: 110
    level0: >-
      The organisation has no event and incident management and response plan to ensure it is ready to
      react to a serious information security event or incident.
    levels:
      1:
      - id: '1.1'
        text: >-
          Incidents and events are handled at least ad hoc, not necessarily under an established event
          and incident management and response plan.
      2:
      - id: '2.1'
        text: >-
          A basic event and incident management and response plan has been established and is applied.
      3:
      - id: '3.1'
        text: >-
          An event and incident management and response plan, ensuring the organisation is ready to react
          to a serious information security event or incident, has been established, is applied and is
          maintained.
      - id: '3.2'
        text: >-
          The plan: (a) gives the organisation a roadmap for implementing its incident response capability;
          (b) describes the structure and organisation of the incident response capability; (c) gives
          a high-level view of how the incident response capability fits into the organisation as a whole;
          (d) meets the organisation's unique requirements related to its mission, size, structure and
          functions; (e) defines which security incidents must be reported; (f) provides KPIs for measuring
          the incident response capability; (g) defines the resources and management support needed to
          maintain and mature the incident response capability effectively.
      - id: '3.3'
        text: >-
          Aligning event and incident response processes with general monitoring capabilities and specific
          security monitoring functions, such as the intrusion detection and prevention services described
          in [NS7], is considered.
      - id: '3.4'
        text: >-
          Copies of the plan are distributed to all involved parties (internal and/or external), and a
          distribution list is kept.
      - id: '3.5'
        text: The plan is approved by the organisation's management.
      4:
      - id: '4.1'
        text: >-
          Event and incident response processes are aligned with general monitoring capabilities and specific
          security monitoring functions, such as the intrusion detection and prevention services described
          in [NS7].
      - id: '4.2'
        text: Changes to the plan are communicated to all involved parties (internal and/or external).
      - id: '4.3'
        common: R1
        text: >-
          The related documents are reviewed for suitability at least once a year. Any changes follow
          the change management process.
      5:
      - id: '5.1'
        text: >-
          The plan is protected against unauthorised disclosure and unauthorised or uncontrolled modification.
      - id: '5.2'
        text: >-
          Valid cyber threat intelligence is received in a timely manner and used, among other things,
          to update the list of threats, vulnerabilities and risks the organisation is exposed to.
      - id: '5.3'
        common: K1
        text: >-
          The skills, capabilities and knowledge that the authorised roles need to run this process have
          been identified.
      - id: '5.4'
        common: K2
        text: >-
          The organisation ensures that the responsible staff already have this knowledge, or otherwise
          arranges for them to acquire it.
  - id: EIM2
    title: Event and incident analysis and assessment
    objective: >-
      Ensure the organisation can analyse and assess information security events and incidents so it can
      trigger appropriate containment and recovery processes.
    description: >-
      Establish, apply and maintain processes for analysing and assessing events and incidents, so the
      organisation can make reasoned decisions on the actions and measures needed to respond to or recover
      from security events and incidents. Consider the impact on data subjects, business activities, external
      parties and the wider ecosystem of entities. Ensure analysis and assessment are carried out in consultation
      with senior management, to link events and incidents with high-risk scenarios.
    page: 111
    level0: >-
      The organisation does not analyse or assess information security events and incidents and has no
      processes for doing so.
    levels:
      1:
      - id: '1.1'
        text: >-
          Events and incidents are assessed and analysed at least ad hoc, not necessarily under an established
          process.
      2:
      - id: '2.1'
        text: A process for how events and incidents are analysed and assessed has been established.
      3:
      - id: '3.1'
        text: >-
          Processes for analysing and assessing events and incidents, so the organisation can make reasoned
          decisions on the actions and measures to respond to or recover from security events and incidents,
          have been established, are applied and are maintained.
      - id: '3.2'
        text: >-
          The impact on data subjects, business activities, external parties and the wider ecosystem of
          entities is considered.
      - id: '3.3'
        text: >-
          Analysis and assessment of events and incidents are carried out in consultation with senior
          management, to link events and incidents with high-risk scenarios.
      - id: '3.4'
        text: >-
          The results of the analysis and assessment of each event or incident detected are recorded.
      - id: '3.5'
        text: >-
          Information security incidents are classified by severity on the scale: (a) Information: no
          impact, but analysis could improve information security policies, procedures or controls; (b)
          Warning: low impact; (c) Critical: medium impact; (d) Emergency: severe impact; or an equivalent
          multi-level classification scheme.
      - id: '3.6'
        text: >-
          Based on these classification factors, information security events are classified into four
          categories: (a) very serious, (b) serious, (c) less serious, (d) minor, or an equivalent multi-level
          scheme. (a) Very serious incidents affect critical information systems and cause particularly
          serious business loss or particularly significant social impact. (b) Serious incidents affect
          critical or important information systems and cause serious business loss or significant social
          impact. (c) Less serious incidents affect important information systems or systems of limited
          importance to the organisation and cause considerable business loss or considerable social impact.
          (d) Minor incidents affect systems of limited importance to the organisation and cause little
          or no business loss, or little or no social impact.
      - id: '3.7'
        text: >-
          An internal point of contact assesses each information security event using the agreed incident
          classification scale and decides whether it should be classified as an information security
          incident.
      4:
      - id: '4.1'
        text: An information security incident response team (ISIRT) exists.
      - id: '4.2'
        text: >-
          The assessment and decision on an incident and/or event are escalated for confirmation or reassessment
          according to severity.
      - id: '4.3'
        text: The ISIRT analyses detected incidents to understand attack methods and objectives.
      - id: '4.4'
        text: The organisation works with a service provider for incident management.
      - id: '4.5'
        common: R1
        text: >-
          The related documents are reviewed for suitability at least once a year. Any changes follow
          the change management process.
      5:
      - id: '5.1'
        text: >-
          A contract with a third party covers digital forensics for the organisation in case of a relevant
          security incident or event.
      - id: '5.2'
        text: >-
          The organisation takes part in internal and/or external exercises assessing staff effectiveness
          and awareness in incident analysis and assessment.
      - id: '5.3'
        common: K1
        text: >-
          The skills, capabilities and knowledge that the authorised roles need to run this process have
          been identified.
      - id: '5.4'
        common: K2
        text: >-
          The organisation ensures that the responsible staff already have this knowledge, or otherwise
          arranges for them to acquire it.
  - id: EIM3
    title: Event and incident containment and recovery
    objective: >-
      Ensure adequate containment of, and recovery from, security events and incidents that adversely
      affect the organisation's information security objectives.
    description: >-
      Establish, apply and maintain processes for containing and recovering from events and incidents,
      minimising the impact on systems, applications, networks and data and preserving, as far as possible,
      the organisation's critical functions. Consider recovery objectives, taking into account the recovery
      point objective (RPO) and recovery time objective (RTO), to determine the target duration and service
      level within which a business process must be restored after an incident.
    page: 112
    level0: >-
      The organisation has not established and does not apply processes for containing and recovering
      from events and incidents.
    levels:
      1:
      - id: '1.1'
        text: Security incidents are responded to at least ad hoc.
      2:
      - id: '2.1'
        text: >-
          Some security incident response roles have been identified, and the people in those roles and
          other staff have been informed of their obligations regarding possible security incidents.
      3:
      - id: '3.1'
        text: >-
          Processes for containing and recovering from events and incidents, minimising the impact on
          systems, applications, networks and data and preserving, as far as possible, the organisation's
          critical functions, have been established, are applied and are maintained.
      - id: '3.2'
        text: >-
          Recovery objectives are considered, taking into account the RPO and RTO, to determine the target
          duration and service level within which a business process must be restored after an incident.
      - id: '3.3'
        text: The incident categorisation described in [EIM2] is followed.
      4:
      - id: '4.1'
        text: >-
          Specific plans describe operating modes, measures and steps for specific types of incident.
      - id: '4.2'
        text: >-
          The plans are based on the relevant risk assessment and cover the main types of threats and
          attacks according to international reports and data.
      - id: '4.3'
        text: >-
          At minimum, the plans cover cases such as: (a) ransomware; (b) malware; (c) social engineering
          attack; (d) denial of service; (e) supply chain availability attack; (f) physical security attack;
          (g) theft of media, devices or information.
      - id: '4.4'
        text: >-
          The RPO and RTO are taken into account to determine the target duration and service level within
          which a business process must be restored after an incident.
      - id: '4.5'
        text: >-
          The actions planned to limit the impact on the organisation are appropriate to the incident's
          criticality and to the information or functions affected or likely to be affected. During containment
          and response, the organisation may request assistance from the relevant authorities.
      - id: '4.6'
        common: R1
        text: >-
          The related documents are reviewed for suitability at least once a year. Any changes follow
          the change management process.
      5:
      - id: '5.1'
        text: >-
          Specific procedures for handling and preserving data during a security incident have been defined.
      - id: '5.2'
        text: >-
          Appropriate actions ensure suitably authorised roles collect evidence securely (preserving the
          chain of custody) so it can later be used by the competent authorities or other specifically
          authorised parties.
      - id: '5.3'
        text: >-
          Regular exercises and tests ensure staff know the plans, that the plans are correct and effective,
          and that they can achieve the security and operational level the organisation wants even during
          an incident.
      - id: '5.4'
        text: >-
          Partners and subcontractors forming the supply chain of critical functions are required to have
          equivalent documented and tested security incident response processes and to commit to assisting
          promptly when the organisation needs it.
      - id: '5.5'
        common: K1
        text: >-
          The skills, capabilities and knowledge that the authorised roles need to run this process have
          been identified.
      - id: '5.6'
        common: K2
        text: >-
          The organisation ensures that the responsible staff already have this knowledge, or otherwise
          arranges for them to acquire it.
  - id: EIM4
    title: Post-event and post-incident activities
    objective: >-
      Ensure the organisation learns from security events and incidents to prevent similar ones in the
      future.
    description: >-
      Establish, apply and maintain post-event and post-incident processes to capture lessons learned
      from information security events and incidents and determine whether additional security measures
      are needed to prevent similar ones. Consider a post-incident process that includes a review meeting
      with affected system owners, data custodians and other parties involved in the response, to share
      lessons and identify preventive measures.
    source: 27002, 27035
    page: 113
    level0: >-
      The organisation has no processes to capture lessons learned after information security events and
      incidents or to determine whether additional security measures are needed to prevent similar ones.
    levels:
      1:
      - id: '1.1'
        text: >-
          After a security event or incident, available information is collected at least ad hoc to understand
          it.
      2:
      - id: '2.1'
        text: >-
          A process defines the steps to follow after an incident so the organisation assesses its security
          level and prevents similar events and incidents in the future.
      3:
      - id: '3.1'
        text: >-
          Post-event and post-incident processes to capture lessons learned from information security
          events and incidents, and to determine whether additional security measures are needed to prevent
          similar ones, have been established, are applied and are maintained.
      - id: '3.2'
        text: >-
          In the lessons-learned phase, the following activities are carried out and recorded in the process:
          (a) identifying lessons learned from information security events and vulnerabilities; (b) identifying,
          reviewing and making improvements to information security measures; (c) reviewing and improving
          the information security risk assessment; (d) reviewing the effectiveness of the processes,
          policies and people involved in the incident (e.g. the response team), incident analysis and
          recovery, and handling of information security vulnerabilities. Based on lessons learned, improvements
          to the information security event management plan are identified and made.
      - id: '3.3'
        text: >-
          Information from assessing information security events or incidents is used to [identify] recurring
          or high-impact events.
      - id: '3.4'
        text: >-
          A post-incident process including a review meeting with affected system owners, data custodians
          and other parties involved in the response, to share lessons and identify preventive measures,
          is considered.
      4:
      - id: '4.1'
        text: >-
          A process including a review meeting with affected system owners, data custodians and other
          parties involved in the response, to share lessons and identify preventive measures, has been
          established and is applied.
      - id: '4.2'
        text: >-
          After an incident or event, the effectiveness and correctness of the information security incident
          response team's response are assessed.
      - id: '4.3'
        text: >-
          Data from real information security incidents is used in staff training as examples of what
          could happen, how to respond and how to avoid such incidents in the future.
      - id: '4.4'
        common: R1
        text: >-
          The related documents are reviewed for suitability at least once a year. Any changes follow
          the change management process.
      5:
      - id: '5.1'
        text: >-
          The organisation checks whether incident information, related attack vectors and vulnerabilities
          can be shared with partner organisations to help prevent the same incidents in their environment.
      - id: '5.2'
        common: K1
        text: >-
          The skills, capabilities and knowledge that the authorised roles need to run this process have
          been identified.
      - id: '5.3'
        common: K2
        text: >-
          The organisation ensures that the responsible staff already have this knowledge, or otherwise
          arranges for them to acquire it.
  - id: EIM5
    title: Regulatory incident notification and cooperation obligations
    objective: >-
      Ensure the organisation informs the relevant parties of security events or incidents as required
      by legal and regulatory obligations.
    description: >-
      Establish, apply and maintain processes to ensure compliance with regulatory and legal incident
      notification requirements. Ensure adequate notification and reporting processes for information
      security events and incidents to the competent regulators, such as the Digital Security Authority
      (DSA). For personal data, ensure compliance with applicable data protection laws and regulations
      and communicate, where needed, with the competent data protection authority.
    page: 114
    level0: >-
      The organisation has no process to ensure compliance with regulatory and legal incident notification
      requirements.
    levels:
      1:
      - id: '1.1'
        text: Relevant parties are informed of security events or incidents at least ad hoc.
      2:
      - id: '2.1'
        text: >-
          Contact details of the parties to be informed of security events or incidents are recorded in
          a list.
      - id: '2.2'
        text: >-
          The list also records the notification deadline, the type of incident the notification concerns
          and the person responsible on the organisation's side.
      3:
      - id: '3.1'
        text: >-
          A process to ensure compliance with regulatory and legal incident notification requirements
          has been established, is applied and is maintained.
      - id: '3.2'
        text: >-
          Adequate notification and reporting processes for information security events and incidents
          to the competent regulators, such as the DSA, are in place.
      - id: '3.3'
        text: >-
          For personal data, compliance with applicable data protection laws and regulations is ensured,
          and the competent data protection authority is contacted where needed.
      - id: '3.4'
        text: >-
          Specific duties and responsibilities for notifying regulators of incidents have been defined
          and assigned in writing to the corresponding people or roles, including those of the network
          and information security officer referred to in [GOV1].
      4:
      - id: '4.1'
        text: >-
          Security incident simulation exercises are planned and run at set times to record and check
          the time taken to notify and report information security events and incidents to the competent
          regulators, ensuring compliance with regulatory and legal notification requirements.
      - id: '4.2'
        text: >-
          Template forms have been created for the responsible staff to complete in case of an incident,
          per incident type and per authority.
      - id: '4.3'
        common: R1
        text: >-
          The related documents are reviewed for suitability at least once a year. Any changes follow
          the change management process.
      5:
      - id: '5.1'
        text: >-
          Detailed guides set out the steps the responsible staff follow at defined points in time to
          inform the authorities involved correctly, promptly and effectively. (The guides include deadlines,
          roles, minutes, guidance on digital evidence, guidance on who must be notified — e.g. whether
          data subjects must also be informed in a personal data incident — notification text templates,
          etc.)
      - id: '5.2'
        common: K1
        text: >-
          The skills, capabilities and knowledge that the authorised roles need to run this process have
          been identified.
      - id: '5.3'
        common: K2
        text: >-
          The organisation ensures that the responsible staff already have this knowledge, or otherwise
          arranges for them to acquire it.
  - id: EIM6
    title: Communication with stakeholders about events and incidents
    objective: >-
      Ensure the organisation shares information about network and information security events and incidents
      with internal and external stakeholders.
    description: >-
      Establish, apply and maintain processes for communicating about information security events and
      incidents to external and internal recipients, ensuring awareness of the event or incident and enabling
      external and internal stakeholders to decide on appropriate response measures where needed. Consider
      cooperating with external and internal stakeholders, such as the DSA and emergency services, on
      containing events and incidents to minimise their impact, and on post-incident activities to determine
      preventive measures.
    page: 115
    level0: The organisation does not communicate with stakeholders about events and incidents.
    levels:
      1:
      - id: '1.1'
        text: >-
          The organisation communicates with stakeholders about security events and incidents at least
          ad hoc, not necessarily systematically.
      2:
      - id: '2.1'
        text: >-
          A list of stakeholders is kept, with whom the organisation communicates systematically to ensure
          awareness of the event.
      3:
      - id: '3.1'
        text: >-
          A process for communicating about information security events and incidents to external and
          internal recipients, ensuring awareness of the event or incident and enabling external and internal
          stakeholders to decide on appropriate response measures where needed, has been established,
          is applied and is maintained.
      - id: '3.2'
        text: >-
          Cooperation with external and internal stakeholders, such as the DSA and emergency services,
          on containing events and incidents to minimise their impact, and on post-incident activities
          to determine preventive measures, is considered.
      4:
      - id: '4.1'
        text: >-
          The organisation cooperates with external and internal stakeholders, such as the DSA and emergency
          services, on containing events and incidents to minimise their impact, and on post-incident
          activities to determine preventive measures.
      - id: '4.2'
        common: R1
        text: >-
          The related documents are reviewed for suitability at least once a year. Any changes follow
          the change management process.
      5:
      - id: '5.1'
        text: >-
          Automated mechanisms increase the availability of incident response information and support
          (e.g. the organisation can receive automated information by message or email as part of a growing
          understanding of current response and support capabilities).
      - id: '5.2'
        text: >-
          Valid cyber threat intelligence is received and shared through contacts with relevant organisations
          (such as sector-specific ISACs, CSIRTs, coalitions, etc.).
      - id: '5.3'
        text: >-
          Procedures set out the measures and steps the organisation takes when exchanging such information,
          so it is transferred and read effectively without exposing internal confidential information
          to unauthorised parties; these procedures also define the protocols, tools and information structure.
      - id: '5.4'
        common: K1
        text: >-
          The skills, capabilities and knowledge that the authorised roles need to run this process have
          been identified.
      - id: '5.5'
        common: K2
        text: >-
          The organisation ensures that the responsible staff already have this knowledge, or otherwise
          arranges for them to acquire it.
- id: BCR
  title: Business continuity and resilience
  measures:
  - id: BCR1
    title: Business impact analysis
    objective: >-
      Ensure the organisation has analysed and assessed the critical business processes to be covered
      by the business continuity plan, so it can restore them to an acceptable level as soon as possible
      after an event or incident.
    description: >-
      Establish, apply and maintain a business impact analysis process to identify all critical assets
      in the organisation. The analysis lets the organisation prioritise functions and systems by how
      necessary they are for delivering business services. It is carried out using a classification scheme
      with defined criticality levels and considers whether critical functions or systems operate independently
      or are linked to other functions or systems of the organisation.
    source: '22313'
    page: 117
    level0: The organisation has not carried out a business impact analysis.
    levels:
      1:
      - id: '1.1'
        text: >-
          The organisation has analysed the core services it provides and identified some of its business
          activities, though not necessarily systematically.
      2:
      - id: '2.1'
        text: >-
          A process, even a simple one, for identifying critical business activities has been created.
      - id: '2.2'
        text: >-
          The results of this process are recorded in the inventory of assets, systems and processes referred
          to in [RM2].
      - id: '2.3'
        text: Roles and responsibilities for this process have been assigned to suitable staff.
      - id: '2.4'
        text: The process is carried out at least once a year.
      3:
      - id: '3.1'
        text: >-
          A business impact analysis process to identify all critical assets in the organisation has been
          established, is applied and is maintained.
      - id: '3.2'
        text: >-
          The analysis lets the organisation prioritise functions and systems by how necessary they are
          for delivering business services.
      - id: '3.3'
        text: >-
          The analysis uses a classification scheme with defined criticality levels and considers whether
          critical functions or systems operate independently or are linked to other functions or systems
          of the organisation.
      - id: '3.4'
        text: >-
          The process includes: (a) defining assessment criteria for the organisation's context, including
          impact types and timeframes; (b) identifying the activities that support delivery of the organisation's
          products and services; (c) using the criteria to assess the expected impact over time of disruption
          to those activities; (d) estimating the time after which the impact of not resuming the activities
          becomes unacceptable; (e) setting timeframes, within that time, for resuming activities at defined
          minimum acceptable capability; (f) identifying prioritised activities; (g) identifying dependencies
          of prioritised activities, including people, information and data, buildings, workspaces and
          related utilities, equipment and consumables, ICT systems, transport and logistics, finance,
          and partners and the supply chain.
      - id: '3.5'
        text: >-
          The process is carried out and its results are recorded in a report presented to and approved
          by management.
      - id: '3.6'
        text: >-
          The report contains at minimum the RTO, MAO/MTPD, RPO and MBCO identified per process and/or
          activity.
      4:
      - id: '4.1'
        text: >-
          Workshops and meetings with a representative sample of staff from each department or process
          involved are held to collect business impact analysis data.
      - id: '4.2'
        text: >-
          As part of the analysis, staff identify, analyse and assess risks that could compromise the
          organisation's ability to keep that department, process or service running.
      - id: '4.3'
        text: >-
          The scales used to assess expected impact and to analyse and assess risk are approved by management
          and expressed so that all staff involved understand them (including those without IT or business
          continuity expertise).
      - id: '4.4'
        text: >-
          The criteria always take into account, and are aligned with, the requirements of applicable
          legislation.
      - id: '4.5'
        text: >-
          Impact is assessed at least in terms of: compliance, achievement of the organisation's objectives,
          financial impact, reputation, health, safety and wellbeing of staff, and health, safety and
          wellbeing of service users.
      - id: '4.6'
        common: R1
        text: >-
          The related documents are reviewed for suitability at least once a year. Any changes follow
          the change management process.
      5:
      - id: '5.1'
        text: >-
          An automated tool supports the business impact analysis process, letting the organisation map
          dependencies between resources (people, equipment, IT processes, records, etc.) and between
          processes. The analysis data is updated at least once a year and after significant changes.
      - id: '5.2'
        text: >-
          Tests, analyses and exercises check the validity of the business impact analysis data. Where
          a deviation is identified, appropriate actions are taken immediately to address its cause and
          fix the problem.
      - id: '5.3'
        common: K1
        text: >-
          The skills, capabilities and knowledge that the authorised roles need to run this process have
          been identified.
      - id: '5.4'
        common: K2
        text: >-
          The organisation ensures that the responsible staff already have this knowledge, or otherwise
          arranges for them to acquire it.
  - id: BCR2
    title: Business continuity plan
    objective: >-
      Ensure the organisation has a plan to maintain continuity of critical business processes and to
      recover during and after an event or incident.
    description: >-
      Establish, apply and maintain a business continuity plan so the organisation can respond to emergencies
      promptly and appropriately and keep business operations running while minimising the consequences
      and damage of an incident. The plan includes the disaster recovery plan described in [BCR4] and
      takes the business impact analysis into account.
    page: 118
    level0: The organisation has not drawn up a business continuity plan.
    levels:
      1:
      - id: '1.1'
        text: >-
          Some alternatives for disruptive incidents have been identified, though they may be occasional,
          may not be based on the business impact analysis and may not be fully documented.
      2:
      - id: '2.1'
        text: Business continuity plans have been built for critical activities.
      - id: '2.2'
        text: >-
          These plans are documented, but may not be based on structured business impact analysis data.
      - id: '2.3'
        text: >-
          The plans contain the desired recovery time per activity and the actions to carry out in case
          of disruption.
      3:
      - id: '3.1'
        text: >-
          A business continuity plan, ensuring the organisation can respond to emergencies promptly and
          appropriately and keep business operations running while minimising the consequences and damage
          of an incident, has been established, is applied and is maintained.
      - id: '3.2'
        text: >-
          The plan includes the disaster recovery plan described in [BCR4] and takes the business impact
          analysis [BCR1] into account.
      - id: '3.3'
        text: >-
          One or more business continuity plans have been created, focusing on the impacts the organisation
          may face from a disruption rather than on the causes that may lead to them.
      - id: '3.4'
        text: >-
          The plan(s) include: (a) the purpose, scope and objectives of each plan; (b) the plan's assumptions
          and exclusions; (c) the roles and responsibilities of the team implementing the plan; (d) the
          detailed steps the teams will take to continue or recover business activities to a predefined
          level within an agreed, acceptable timeframe; (e) how the teams will monitor and respond to
          the incident's impact to limit its effect on people and the organisation as far as possible,
          considering the health and safety of individuals, limiting the spread and reducing the effects
          of the disruption, and the impact on the environment and society; (f) RTO/RPO/MAO-MTPD per process
          or service and, where feasible, per activity; (g) the process and responsibilities for notification,
          diagnosis, the decision to invoke, and implementation of the plan; (h) internal and external
          interdependencies and the provisions made for their continuity; (i) resource requirements; (j)
          communication methods and contact details between stakeholders; (k) analysis of required human
          resources over time; (l) the documentation to be kept when the plan is invoked; (m) the stand-down
          process.
      - id: '3.5'
        text: >-
          Each business continuity plan is known to the staff involved and available when they need it.
      4:
      - id: '4.1'
        text: >-
          Possible business continuity and disaster recovery strategies are analysed, and those that,
          per process, impact type and RTO/MAO, can let the organisation recover its business activities
          within a predefined acceptable time and to a predefined level are selected and recorded.
      - id: '4.2'
        text: >-
          The strategy options are recorded and presented to management with a cost-benefit analysis.
      - id: '4.3'
        text: Management approves the acceptable strategies.
      - id: '4.4'
        text: >-
          Business continuity and disaster recovery plans are drawn up according to the strategies accepted
          and approved by management.
      - id: '4.5'
        common: R1
        text: >-
          The related documents are reviewed for suitability at least once a year. Any changes follow
          the change management process.
      5:
      - id: '5.1'
        text: >-
          Each business continuity plan has an owner responsible for monitoring it throughout its lifecycle.
      - id: '5.2'
        text: >-
          The owner creates an action plan to implement the provisions of each business continuity plan.
      - id: '5.3'
        text: >-
          The action plan includes actions such as: coordinating and ensuring availability of resources,
          staff training, writing guidance, a test plan to check the plan's effectiveness, secure storage
          of the plan where needed and its availability when needed, coordinating the recording and updating
          of call trees where required, and identifying roles for response, operation, invocation and
          testing of the plan.
      - id: '5.4'
        text: >-
          The owner tracks readiness actions for each business continuity plan and reports the level of
          readiness and performance to management.
      - id: '5.5'
        common: K1
        text: >-
          The skills, capabilities and knowledge that the authorised roles need to run this process have
          been identified.
      - id: '5.6'
        common: K2
        text: >-
          The organisation ensures that the responsible staff already have this knowledge, or otherwise
          arranges for them to acquire it.
  - id: BCR3
    title: Business continuity exercises and simulations
    objective: >-
      Ensure the organisation and its staff know their responsibilities during an event or incident that
      invokes the business continuity plan.
    description: >-
      Establish, apply and maintain measures to test, review and improve the business continuity plan
      through exercises simulating events and incidents, to check the organisation's response and improve
      business continuity processes. Exercises and simulations should let the organisation identify improvement
      opportunities and achieve better results over time. Consider linking the plan to change management
      processes as described in [CM1], so the effects of any organisational change are reflected in it.
      Run exercises and simulations at regular intervals to keep employees alert to events and incidents
      that could harm the organisation. When drawing up the plan, also consider disaster recovery as defined
      in [BCR4].
    page: 120
    level0: The organisation has not drawn up a business continuity plan.
    levels:
      1:
      - id: '1.1'
        text: >-
          Some alternatives for disruptive incidents have been identified, though they may be occasional,
          may not be based on the business impact analysis, and may not be fully documented or exercised
          systematically.
      2:
      - id: '2.1'
        text: Business continuity plans have been built for critical activities.
      - id: '2.2'
        text: >-
          These plans are documented, but may not be based on structured business impact analysis data.
      - id: '2.3'
        text: >-
          The plans contain the desired recovery time per activity and the actions needed to achieve it
          in case of disruption.
      - id: '2.4'
        text: The business continuity plans have been tested at least once in the last two years.
      3:
      - id: '3.1'
        text: >-
          Measures to test, review and improve the business continuity plan through exercises simulating
          events and incidents, to check the organisation's response and improve business continuity processes,
          have been established, are applied and are maintained.
      - id: '3.2'
        text: >-
          Exercises and simulations let the organisation identify improvement opportunities and achieve
          better results over time.
      - id: '3.3'
        text: >-
          Exercises and simulations are run at regular intervals to keep employees alert to events and
          incidents that could harm the organisation. When drawing up the plan, disaster recovery as defined
          in [BCR4] is also considered.
      - id: '3.4'
        text: >-
          Tests and exercises take place at least once a year and cover all business continuity provisions
          at least once and in at least one way (even if only a tabletop exercise).
      4:
      - id: '4.1'
        text: An exercise and test plan or programme has been created.
      - id: '4.2'
        text: >-
          The programme ensures exercises and tests are consistent with the organisation's business continuity
          objectives, are based on suitable scenarios (clear and documented, each with a specific objective),
          target specific aspects of the plans (e.g. communication, technology readiness, cooperation,
          effectiveness), and, taken together over a full year, test all of the organisation's business
          continuity provisions using a variety of methods.
      - id: '4.3'
        text: >-
          Documented minutes are kept for exercises and tests, recording the test history, the time taken
          per step according to the applicable plan or part of it, and any observations.
      - id: '4.4'
        text: >-
          The business continuity plan is linked to the change management processes described in [CM1],
          so the effects of any organisational change are reflected in it.
      - id: '4.5'
        common: R1
        text: >-
          The related documents are reviewed for suitability at least once a year. Any changes follow
          the change management process.
      5:
      - id: '5.1'
        text: An exercise and test plan or programme has been created.
      - id: '5.2'
        text: >-
          The programme ensures exercises and tests are consistent with the organisation's business continuity
          objectives and, taken together over a full year, test all of the organisation's business continuity
          provisions using a variety of methods.
      - id: '5.3'
        text: >-
          The programme includes, and the organisation carries out, at least once a year a full test of
          the business continuity plan(s) and the disaster recovery plan. Where a full test is not possible
          because of the organisation's specific environment, the justification is recorded and enough
          simulation exercises or smaller tests are run to check all provisions.
      - id: '5.4'
        text: >-
          Where possible, relevant authorities are asked to take part in the tests. Where feasible, the
          organisation runs incident simulations in digital twin environments.
      - id: '5.5'
        text: >-
          A risk analysis and assessment determines how much staff are told in advance about the tests,
          with staff health and safety as a guiding factor.
      - id: '5.6'
        text: >-
          Post-test discussions and meetings assess the performance of each part of the plans, surface
          problems and identify areas for improvement.
      - id: '5.7'
        text: >-
          Tests and discussions are coordinated and observed by an independent observer (who may be internal
          to the organisation but must not take part in recovery, response or operations).
      - id: '5.8'
        common: K1
        text: >-
          The skills, capabilities and knowledge that the authorised roles need to run this process have
          been identified.
      - id: '5.9'
        common: K2
        text: >-
          The organisation ensures that the responsible staff already have this knowledge, or otherwise
          arranges for them to acquire it.
  - id: BCR4
    title: Disaster recovery plan
    objective: >-
      Ensure the organisation has a plan to restore critical information systems to an acceptable level
      during or after an incident.
    description: >-
      Establish, apply and maintain a disaster recovery plan to ensure restoration and recovery of all
      critical IT system processes and supporting assets, such as power supply, after an incident. The
      plan should give IT staff clear instructions for a timely and effective response to all incidents
      affecting the organisation's IT environment, and should define the recovery point objective (RPO)
      and recovery time objective (RTO) to avoid unacceptable consequences for the organisation.
    page: 121
    level0: The organisation has not drawn up a disaster recovery plan.
    levels:
      1:
      - id: '1.1'
        text: >-
          Some steps to carry out in a disaster have been identified, though they may be occasional, may
          not be based on the business impact analysis and may not be fully documented.
      2:
      - id: '2.1'
        text: A disaster recovery plan has been built for critical activities.
      - id: '2.2'
        text: The plan is documented, but may not be based on structured business impact analysis data.
      - id: '2.3'
        text: >-
          The plan relies on backups and their use for recovery at the same or a different site in a disaster.
      3:
      - id: '3.1'
        text: >-
          A disaster recovery plan, ensuring restoration and recovery of all critical IT system processes
          and supporting assets, such as power supply, after an incident, has been established, is applied
          and is maintained.
      - id: '3.2'
        text: >-
          The plan gives IT staff clear instructions for a timely and effective response to all incidents
          affecting the organisation's IT environment.
      - id: '3.3'
        text: The plan defines the RPO and RTO to avoid unacceptable consequences for the organisation.
      - id: '3.4'
        text: >-
          The plan includes all resources identified in the business impact analysis as needed for critical
          processes to operate correctly within a predefined timeframe.
      - id: '3.5'
        text: >-
          Staff involved in operating the plan are fully informed of their duties and responsibilities.
      - id: '3.6'
        text: The plan is tested according to [BCR3].
      - id: '3.7'
        text: Updates and changes follow the change management process [CM1].
      4:
      - id: '4.1'
        text: The plan provides for suitable licensed software to restore data from backups.
      - id: '4.2'
        text: Backup files are encrypted using algorithms as required by [AM1].
      - id: '4.3'
        text: >-
          Provision has been made to access and restore data from backups as required (e.g. the backup
          software can be downloaded, installed or used, and the relevant keys are available).
      - id: '4.4'
        text: >-
          Disaster recovery plans are stored in a secure location, protected as information of the highest
          classification level, and available if the primary facility is destroyed.
      - id: '4.5'
        common: R1
        text: >-
          The related documents are reviewed for suitability at least once a year. Any changes follow
          the change management process.
      5:
      - id: '5.1'
        text: >-
          Replication to an alternative site is in place for critical systems, as identified by the business
          impact analysis and the related strategies.
      - id: '5.2'
        text: >-
          The plans are exercised at least annually, and their ability to be applied correctly and effectively
          is assessed.
      - id: '5.3'
        text: >-
          Post-test discussions and meetings assess the performance of each part of the plans, surface
          problems and identify areas for improvement.
      - id: '5.4'
        text: >-
          Tests and discussions are coordinated and observed by an independent observer (who may be internal
          to the organisation but must not take part in recovery, response or operations).
      - id: '5.5'
        common: K1
        text: >-
          The skills, capabilities and knowledge that the authorised roles need to run this process have
          been identified.
      - id: '5.6'
        common: K2
        text: >-
          The organisation ensures that the responsible staff already have this knowledge, or otherwise
          arranges for them to acquire it.
